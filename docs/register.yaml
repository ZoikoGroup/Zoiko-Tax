# ZoikoTax — Canonical Document Register
#
# Format: ZTAX-GOV-001 v3.0 §19 "Canonical Register".
# This file is the machine-readable authority; any human-readable estate index
# is generated FROM this file, never edited alongside it.
#
# Field meanings (Governance §19):
#   document_id        stable ID, e.g. ZTAX-DOM-001
#   title              document title
#   class              C (Constitutional) | S (Specification) | L (Living) | A (Artefact)
#   version            semantic version of the document itself
#   status             PROPOSED | DRAFT | BASELINED-FOR-BUILD | APPROVED | EFFECTIVE |
#                      SUPERSEDED | WITHDRAWN | TODO-CONFIRM
#   owner              accountable owner (verbatim from document header)
#   approvers          the roles who must sign off (verbatim from document header)
#   effective_date     when this version takes effect (null if not yet effective)
#   supersedes         document_id this replaces, or null
#   dependencies       document_ids this document assumes/requires
#   source_path        path to the source file in this repository
#   publication_hash   sha256 of the published artefact (fill in once hashed)
#   review_due         next scheduled review date
#   applicable_release which release train(s)/wave(s) this governs (per GOV §7)
#   retention_policy   PERMANENT | statutory horizon | operational
#
# STATUS NOTES
# - "TODO-CONFIRM": 13 documents in complete-info-docs all carry "For approval" in
#   their own headers, which does not map directly to any GOV §4.4 status. They are
#   neither APPROVED (all required approvers have signed) nor EFFECTIVE. The user
#   must confirm whether these map to APPROVED or BASELINED-FOR-BUILD.
# - ZTAX-DOM-001 says "For approval / BASELINED-FOR-BUILD candidate" — still TODO-CONFIRM.
# - ZTAX-EVID-001 says "For approval / build baseline" — still TODO-CONFIRM.
# - ZTAX-ARCH-001 is SUPERSEDED per ADR README ("Status of the set").
# - ZTAX-DET-001 and ZTAX-JUR-001 are DRAFT per their own spec headers.
# - 11 documents from GOV §6 not yet supplied as files: registered as PROPOSED.

