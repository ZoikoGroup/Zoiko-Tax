# ZoikoTax documentation estate register — ZTAX-GOV-001 §9.4, §19.
#
# This file is the authoritative index of primary documents. It is validated in
# CI by docs/tools/check_registry.py against docs/schema/register.schema.json,
# and the human-readable estate index (docs/ESTATE.md) is generated from it
# rather than maintained beside it.
#
# What CI rejects (GOV-001 §9.4):
#   - a primary document ID used anywhere in the repository that is not here
#   - a duplicate document ID
#   - a document with no owner, or no review date once it is past PROPOSED
#   - a review date in the past on a document that is still live
#   - a publication_hash that does not match the file at source_path
#   - an EFFECTIVE document with no version, hash or effective date, unless an
#     open, in-date gap entry at the foot of this file says why
#
# Statuses are GOV-001 §4.4's lifecycle and nothing else. They record what has
# actually happened to a document. Nothing here is marked BASELINED-FOR-BUILD,
# APPROVED or EFFECTIVE until the named approvers have approved the exact
# version whose hash is registered — that is a human act, and this file records
# it rather than performing it.
#
# Changing a DRAFT's source file changes its hash. Run
#   python docs/tools/check_registry.py --rehash-drafts
# to re-register DRAFT hashes. A document past DRAFT is never rehashed by tool:
# a new version is a new registration.

