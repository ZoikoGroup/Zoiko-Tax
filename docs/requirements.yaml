# ZoikoTax requirement registry — ZTAX-GOV-001 §9.
#
# Every normative requirement in a Class C or S document, under a globally
# unique ZTAX-<DOC>-REQ-#### identifier, with the eleven fields of GOV-001 §9.2.
# Validated in CI by docs/tools/check_registry.py against
# docs/schema/requirements.schema.json.
#
# What CI rejects (GOV-001 §9.4):
#   - a duplicate requirement ID
#   - a requirement whose document is not in docs/register.yaml, or whose ID
#     prefix does not match its document
#   - a requirement ID referenced anywhere in the repository that is not here
#   - a requirement with no owner
#   - an EFFECTIVE requirement with no verification_ref, or whose document is
#     not itself EFFECTIVE
#   - a verification_ref that names a repository path which does not exist
#
# Status follows the document. Every document below is DRAFT, so every
# requirement is PROPOSED. A requirement becomes BASELINED when its document is
# baselined for build, and EFFECTIVE only with its document and with a
# verification_ref that resolves.
#
# verification_ref is either a repository path (optionally path::TestName) or an
# opaque control identifier. It is null until a verification artefact exists;
# a planned test is not a verification reference.
#
# The statements are the documents' own register text. Where the text and the
# requirement disagree, the document wins and this file is corrected — GOV-001
# §9.3 forbids either one silently superseding the other.

