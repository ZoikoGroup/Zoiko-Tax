  - id: ZTAX-INT-REQ-0001
    document_id: "ZTAX-INT-001"
    version: null
    statement: >
      Idempotency-Key MUST be mandatory and enforced on POST
      /v1/transactions:commit, :adjust, :refund and POST /v1/batches. A
      missing key on these endpoints MUST be rejected before any work begins.
    rationale: >
      Build Plan §8 rates duplicate legal submission as Critical; this is
      the outer layer of a two-layer defence (the inner is the accumulator's
      unique constraint, ADR-0004 §2.4).
    source_authority: "ADR-0013 §2.1, control 1; ADR-0010 §5.1 control 6"
    owner: "Lane K — Integration & SDK"
    applies_to: ["backend", "APP", "SCHEMA"]
