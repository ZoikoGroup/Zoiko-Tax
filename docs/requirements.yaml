# ZoikoTax — Requirement Registry
#
# Format: ZTAX-GOV-001 v3.0 §9 "Requirement Registry & Verification System",
# read together with §9.4 "Registry implementation" and §19's example entry.
#
# Governance §9.3 — Verification authority rule:
#   The normative specification states the required behaviour.
#   The verification artefact proves whether the implementation conforms.
#   If they disagree, NEITHER silently supersedes the other: the affected
#   release fails until the defect is reconciled, the requirement is
#   amended, or the verification is corrected — with a record of which.
#
# CI MUST reject (Governance §9.4) — enforced by docs/validate_registry.py:
#   - a requirement id that is not globally unique
#   - a document_id referenced here that is not in register.yaml
#   - a requirement with no owner
#   - a requirement status not in {PROPOSED, BASELINED, EFFECTIVE, RETIRED}
#     (GOV §9.2 — different from the document status set §4.4)
#   - a requirement with status EFFECTIVE and no verification_ref
#   - a requirement with status EFFECTIVE whose source document is not EFFECTIVE
#   - a requirement with status BASELINED whose source document is not in
#     {BASELINED-FOR-BUILD, APPROVED, EFFECTIVE}
#   - a verification_ref that is not a plain repo-relative file path
#   - a verification_ref that does not resolve to an existing file in the repo
#
# id format: ZTAX-<DOC>-REQ-####, sequential per document, never reused
# (Governance §9.1).
#
# VERIFICATION_REF RULE:
#   verification_ref MUST be a plain repo-relative path and nothing else.
#   Any description of what the file does goes in the "note" field.
#   If no file exists, set null and ensure status is not EFFECTIVE.
#
# STATUS NOTES:
#   - ARCH-REQ-0001: backend/tools/fiscalfloat/analyzer_test.go (test suite).
#     Status PROPOSED pending ARCH-001 replacement.
#   - ARCH-REQ-0002: INSPECTION; backend/Makefile (target: vendor-verify).
#   - DOM-REQ-0001/0002: backend/internal/adapter/postgres/numeric_integration_test.go
#   - DOM-REQ-0003: no grant-audit test file found in repo — null.
#   - DOM-REQ-0004: INSPECTION; backend/.golangci.yml (partial: bans time.Now in domain/app;
#     SQL now() not covered).
#   - DOM-REQ-0005: INSPECTION; backend/.golangci.yml
#   - EVID-REQ-0001: backend/internal/platform/canonical/canonical_test.go
#   - AIGOV-REQ-0001: intelligence/tests/test_tool_broker.py
#   - AIGOV-REQ-0002: intelligence/tests/test_citation.py
#   - GOV-REQ-0001: docs/test_validate_registry.py (self-test suite for validator).
#   - INT-REQ-0001: null (no test file; source doc ZTAX-INT-001 is PROPOSED).
#   - All DET/JUR entries: null (source docs DRAFT, no tests exist).

requirements:

  # ---------------------------------------------------------------------------
  # ZTAX-ARCH-001 requirements
  # Source doc is SUPERSEDED; controls remain operative via ADR-0001.
  # ---------------------------------------------------------------------------

  - id: ZTAX-ARCH-REQ-0001
    document_id: "ZTAX-ARCH-001"
    version: "2.1"
    statement: >
      The Go fiscal core MUST NOT use float64 for any type reachable from
      Money, Rate or Quantity, including telemetry attributes and log fields.
    rationale: >
      A binary float silently loses precision on decimal values; a tax
      amount computed this way is wrong in a way that looks plausible.
    source_authority: "ADR-0001 control 1; ADR-0002 §2.8"
    owner: "Lane D — Domain & Evidence Core"
    applies_to: ["backend", "APP"]
    verification_method: TEST
    verification_ref: "backend/tools/fiscalfloat/analyzer_test.go"
    status: PROPOSED
    effective_from: null
    effective_to: null
    note: >
      Test suite for the float64 analyzer. Analyzer run in CI job 'float64 unreachable';
      the full tool is at backend/tools/fiscalfloat/. Status downgraded from EFFECTIVE:
      source document ZTAX-ARCH-001 is SUPERSEDED.

  - id: ZTAX-ARCH-REQ-0002
    document_id: "ZTAX-ARCH-001"
    version: "2.1"
    statement: >
      The arithmetic dependency (cockroachdb/apd) MUST be vendored from
      source, with no local patching, and drift MUST be detected in CI.
    rationale: >
      A years-long replay guarantee cannot depend on a third-party package
      that can change or disappear upstream.
    source_authority: "ADR-0001 control 6"
    owner: "Lane D — Domain & Evidence Core"
    applies_to: ["backend", "APP"]
    verification_method: INSPECTION
    verification_ref: "backend/Makefile"
    status: PROPOSED
    effective_from: null
    effective_to: null
    note: >
      target: vendor-verify. Verified by 'make vendor-verify' target in backend/Makefile —
      checks vendor/ matches go.mod with no patch. Status downgraded from EFFECTIVE:
      source doc ZTAX-ARCH-001 is SUPERSEDED.

  # ---------------------------------------------------------------------------
  # ZTAX-DOM-001 requirements
  # ---------------------------------------------------------------------------

  - id: ZTAX-DOM-REQ-0001
    document_id: "ZTAX-DOM-001"
    version: "1.0"
    statement: >
      PostgreSQL NUMERIC MUST bind to apd.Decimal through explicit type
      mapping; no driver path SHALL narrow a numeric value to float64.
    rationale: >
      Most Go data-access libraries silently scan NUMERIC into float64 if a
      struct field invites it; this is the single most likely place for
      precision loss to enter unnoticed.
    source_authority: "ADR-0001 control 2; ADR-0008 §2.4"
    owner: "Lane D — Domain & Evidence Core"
    applies_to: ["backend", "APP", "SCHEMA"]
    verification_method: TEST
    verification_ref: "backend/internal/adapter/postgres/numeric_integration_test.go"
    status: PROPOSED
    effective_from: null
    effective_to: null
    note: >
      NUMERIC conformance suite run against real PostgreSQL 17 / PostGIS 3.5.
      verification_ref corrected from 'internal/adapter/postgres' (wrong root)
      to the actual file. Integration test is numeric_integration_test.go in same dir.
      Status downgraded from EFFECTIVE pending TODO-CONFIRM on source doc ZTAX-DOM-001.

  - id: ZTAX-DOM-REQ-0002
    document_id: "ZTAX-DOM-001"
    version: "1.0"
    statement: >
      A value with no significant digits (e.g. 0.00) MUST round-trip through
      the database with its scale preserved; scale is semantic and 0.00
      MUST NOT be read back as 0.
    rationale: >
      Scale carries legal meaning (ADR-0002 §2.3, ADR-0011 §2.2): a zero-tax
      line that loses its scale on read canonicalizes differently from the
      one written, and the decision fails to replay against its own evidence.
    source_authority: "ADR-0008 §2.4; ADR-0011 §2.2"
    owner: "Lane D — Domain & Evidence Core"
    applies_to: ["backend", "APP"]
    verification_method: TEST
    verification_ref: "backend/internal/adapter/postgres/numeric_integration_test.go"
    status: PROPOSED
    effective_from: null
    effective_to: null
    note: >
      textNumericCodec boundary-value conformance test. verification_ref corrected
      from 'internal/adapter/postgres/pool.go textNumericCodec …' to plain path.
      Status downgraded from EFFECTIVE pending TODO-CONFIRM on source doc ZTAX-DOM-001.

  - id: ZTAX-DOM-REQ-0003
    document_id: "ZTAX-DOM-001"
    version: "1.0"
    statement: >
      The application's database role MUST NOT hold UPDATE or DELETE grants
      on fiscal, decision, content or evidence tables. Corrections MUST be
      new rows linked by supersession.
    rationale: >
      A seal over data that can still be mutated is not a seal (EVID-001).
    source_authority: "ADR-0003 §2.1, control 1; ADR-0008 §2.8"
    owner: "Lane D — Domain & Evidence Core / Lane B — Platform"
    applies_to: ["backend", "APP", "SCHEMA"]
    verification_method: TEST
    verification_ref: null
    status: PROPOSED
    effective_from: null
    effective_to: null
    note: >
      Requires a grant-audit integration test asserting app role has no UPDATE/DELETE
      on evidence-bearing tables. No such test file was found in the repo.
      verification_ref is null until the test file is created.

  - id: ZTAX-DOM-REQ-0004
    document_id: "ZTAX-DOM-001"
    version: "1.0"
    statement: >
      No code under internal/domain or internal/app MAY call time.Now(),
      now() in SQL, or any other unpinned clock. Decision time MUST arrive
      as an explicit parameter from the request or replay envelope.
    rationale: >
      Replay must be parameter substitution against historical decision
      time, exercising the same code path as production, not a simulation.
    source_authority: "ADR-0003 §2.5, control 2; ADR-0018 §2.12"
    owner: "Lane D — Domain & Evidence Core"
    applies_to: ["backend", "APP"]
    verification_method: INSPECTION
    verification_ref: "backend/.golangci.yml"
    status: PROPOSED
    effective_from: null
    effective_to: null
    note: "partial: bans time.Now in domain/app; SQL now() not covered"

  - id: ZTAX-DOM-REQ-0005
    document_id: "ZTAX-DOM-001"
    version: "1.0"
    statement: >
      internal/domain/fiscal MUST NOT import internal/domain/ai. There MUST
      be no function anywhere in the codebase that converts an AI-typed
      record into a fiscal-typed record.
    rationale: >
      This is the control against the Build Plan's top AI risk — AI output
      reaching an authoritative path — made a compile-time impossibility
      rather than a review convention.
    source_authority: "ADR-0006 §2.6, control 1; ADR-0007 §2.5"
    owner: "Lane D — Domain & Evidence Core / Lane L — Intelligence Fabric"
    applies_to: ["backend", "APP", "AI"]
    verification_method: INSPECTION
    verification_ref: "backend/.golangci.yml"
    status: PROPOSED
    effective_from: null
    effective_to: null
    note: >
      Verified by golangci-lint depguard rule in CI job 'architectural controls'.
      verification_ref points to the lint config file. Status downgraded from EFFECTIVE
      pending TODO-CONFIRM on source doc ZTAX-DOM-001.

  # ---------------------------------------------------------------------------
  # ZTAX-EVID-001 requirements
  # ---------------------------------------------------------------------------

  - id: ZTAX-EVID-REQ-0001
    document_id: "ZTAX-EVID-001"
    version: "1.0"
    statement: >
      Every digest-bearing record MUST record the canonicalization profile
      version (canon/v1) it was produced under. A record without it is
      invalid.
    rationale: >
      canon/v1 is permanent once referenced by sealed evidence; future
      profile changes are additive (canon/v2), never a silent redefinition.
    source_authority: "ADR-0011 §2.6, control 5"
    owner: "Lane D — Domain & Evidence Core"
    applies_to: ["backend", "APP", "SCHEMA", "CONTENT"]
    verification_method: TEST
    verification_ref: "backend/internal/platform/canonical/canonical_test.go"
    status: PROPOSED
    effective_from: null
    effective_to: null
    note: >
      Golden vectors in backend/internal/platform/canonical/. verification_ref
      corrected from 'internal/platform/canonical golden vectors — testdata/golden/canonical'
      to the actual test file path. Status downgraded from BASELINED pending
      TODO-CONFIRM on source doc ZTAX-EVID-001.

