  # Engineering requirements registered by #15 and #18 while the document has
  # no requirement register of its own. Owners: replace with the document's
  # text when it gets one (GOV-001 §9.3).

  - id: ZTAX-GOV-REQ-0001
    document_id: ZTAX-GOV-001
    version: "3.0"
    statement: "CI MUST reject an unregistered primary document ID, a broken requirement reference, a requirement with a missing owner, an expired mandatory review, or a duplicate requirement ID."
