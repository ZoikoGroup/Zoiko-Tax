  # ---- ZTAX-ARCH-001 ------------------------------------------------
  # Engineering requirements registered by #15 and #18 while the document has
  # no requirement register of its own. Owners: replace with the document's
  # text when it gets one (GOV-001 §9.3).

  - id: ZTAX-ARCH-REQ-0001
    document_id: ZTAX-ARCH-001
    version: "2.0"
    statement: "The Go fiscal core MUST NOT use float64 for any type reachable from Money, Rate or Quantity, including telemetry attributes and log fields."
    rationale: "A binary float silently loses precision on decimal values; a tax amount computed this way is wrong in a way that looks plausible."
    source_authority: "ADR-0001 control 1; ADR-0002 §2.8"
    owner: "Lane D — Domain & Evidence Core"
    applies_to: ["backend", "APP"]
    verification_method: TEST
    verification_ref: "backend/tools/fiscalfloat/analyzer_test.go"
    status: PROPOSED
    effective_from: null
    effective_to: null

  - id: ZTAX-ARCH-REQ-0002
    document_id: ZTAX-ARCH-001
    version: "2.0"
    statement: "The arithmetic dependency (cockroachdb/apd) MUST be vendored from source, with no local patching, and drift MUST be detected in CI."
    rationale: "A years-long replay guarantee cannot depend on a third-party package that can change or disappear upstream."
    source_authority: "ADR-0001 control 6"
    owner: "Lane D — Domain & Evidence Core"
    applies_to: ["backend", "APP"]
    verification_method: INSPECTION
    verification_ref: "backend/Makefile"
    status: PROPOSED
    effective_from: null
    effective_to: null

