  - id: ZTAX-GOV-REQ-0001
    document_id: "ZTAX-GOV-001"
    version: "3.0"
    statement: >
      CI MUST reject an unregistered primary document ID, a broken
      requirement reference, a requirement with a missing owner, an expired
      mandatory review, or a duplicate requirement ID.
    rationale: >
      This is the registry's own self-check — without it, register.yaml and
      requirements.yaml degrade into unverified documentation rather than a
      governed system.
    source_authority: "Governance §9.4"
    owner: "QA / CI & Security Automation"
    applies_to: ["docs", "CI"]
    verification_method: TEST
    verification_ref: "docs/test_validate_registry.py"
    status: PROPOSED
    effective_from: null
    effective_to: null
    note: >
      docs/validate_registry.py is the checker and docs/test_validate_registry.py
      is its self-test suite. Status PROPOSED pending GOV-001 lifecycle mapping.

