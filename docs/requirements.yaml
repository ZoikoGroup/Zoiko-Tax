  - id: ZTAX-AIGOV-REQ-0001
    document_id: "ZTAX-AIGOV-001"
    version: "1.0"
    statement: >
      A PRIVILEGED-class AI tool action MUST be rejected unconditionally,
      regardless of use case, prompt content, or any model output.
    rationale: >
      The independent policy gate must hold even if a model is convinced,
      tricked, or instructed otherwise — the refusal cannot be a property
      of the model's judgement.
    source_authority: "ADR-0006 §2.5; Intelligence tool_broker.py ActionClass"
    owner: "Head of Intelligence"
    applies_to: ["intelligence", "AI"]
    verification_method: TEST
    verification_ref: "intelligence/tests/test_tool_broker.py"
    status: PROPOSED
    effective_from: null
    effective_to: null
    note: >
      35 Tool Broker tests, merged commit 7252336. Status downgraded from EFFECTIVE
      pending TODO-CONFIRM on source doc ZTAX-AIGOV-001.

  - id: ZTAX-AIGOV-REQ-0002
    document_id: "ZTAX-AIGOV-001"
    version: "1.0"
    statement: >
      Every AI-plane retrieval result presented as an answer MUST carry a
      citation to a source with a content hash, verifiable against the
      source document.
    rationale: >
      An AI answer with no traceable source cannot be trusted as authority
      in a tax-compliance context, however plausible it reads.
    source_authority: "ADR-0006 §2.7; Intelligence citation.py"
    owner: "Head of Intelligence"
    applies_to: ["intelligence", "AI"]
    verification_method: TEST
    verification_ref: "intelligence/tests/test_citation.py"
    status: PROPOSED
    effective_from: null
    effective_to: null
    note: >
      SHA-256 content hashing and citation verification tests. Status downgraded
      from EFFECTIVE pending TODO-CONFIRM on source doc ZTAX-AIGOV-001.

