# ZoikoTax waiver register — ZTAX-GOV-001 §16.
#
# "No engineer, product manager, tax analyst or AI agent may bypass an EFFECTIVE
# requirement informally." An exception is a row here, validated in CI by
# docs/tools/check_registry.py against docs/schema/waivers.schema.json.
#
# CI rejects a waiver that:
#   - names a requirement not in docs/requirements.yaml
#   - has expired (expires_at in the past) — delete it, or renew it with a new
#     approval; an expired waiver left in place reads as a live one
#   - is approved only by its own risk owner (no self-approval)
#   - duplicates another waiver's ID
#
# Shape, from GOV-001 §16:
#
#   - waiver_id: ZTAX-WVR-2026-0001
#     requirement_id: <a registered requirement ID>
#     scope: "eu-west filing adapter only"
#     reason: "Authority endpoint emergency certificate rotation"
#     risk: "A submission could be attempted without dual confirmation"
#     risk_owner: "Head of Global Compliance"
#     compensating_control: "Manual confirmation + dual approval"
#     expires_at: "2026-10-05T23:59:59Z"
#     approvers: ["CTO", "Head of Global Compliance"]
#     approved_at: "2026-09-25"
#
# There are none. Nothing is EFFECTIVE yet, so there is nothing to waive.
waivers: []
