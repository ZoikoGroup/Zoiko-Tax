# Real, existing images, so the signature policy reaches a verdict rather than
# a lookup error. Needs the registries and Rekor; CI runs it, a laptop may not.
#
# Neither is signed by ZoikoGroup/Zoiko-Tax's release workflow, so both must be
# refused by cell-release-signature — the first because nothing signed it, the
# second because somebody else did. The second is the case that matters: a
# valid Sigstore signature from the wrong identity is still a refusal.

# Unsigned: an official Docker Hub image, pinned by its real digest.
apiVersion: v1
kind: Pod
metadata:
  name: real-unsigned-image
  namespace: ztax-cell
spec:
  containers:
    - name: app
      image: docker.io/library/busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
---
# Signed keylessly and verifiably — by Google's distroless pipeline
# (keyless@distroless.iam.gserviceaccount.com), not by ours. It is the base
# image ztax-core is built FROM, which is the point: a genuine signature from
# the wrong identity is a refusal. With the attestor swapped for the
# distroless identity the same check passes, so the refusal is the identity
# binding, not a verifier that refuses everything (policy/README.md).
apiVersion: v1
kind: Pod
metadata:
  name: signed-by-another-identity
  namespace: ztax-cell
spec:
  containers:
    - name: app
      image: gcr.io/distroless/static-debian12@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
