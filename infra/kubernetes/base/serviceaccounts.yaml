# One service account per deployable, each bound to its own workload identity
# (infra/tofu/modules/regional-cell: workload_identities). The overlay sets the
# role for the cell; the base carries a placeholder that cannot assume
# anything, so a base applied without an overlay has no cloud credentials at
# all rather than someone else's.
#
# automountServiceAccountToken is false everywhere: none of these processes
# talks to the Kubernetes API. The IRSA web-identity token is a separate,
# audience-scoped projected token (audience sts.amazonaws.com) injected by the
# platform's identity webhook; it is not the Kubernetes API token and does not
# need automounting.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ztax-core
  namespace: ztax-cell
  labels:
    app.kubernetes.io/name: ztax-core
    app.kubernetes.io/part-of: zoikotax
  annotations:
    eks.amazonaws.com/role-arn: unset-set-by-overlay
    eks.amazonaws.com/token-expiration: "3600"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ztax-outbox-relay
  namespace: ztax-cell
  labels:
    app.kubernetes.io/name: ztax-outbox-relay
    app.kubernetes.io/part-of: zoikotax
  annotations:
    eks.amazonaws.com/role-arn: unset-set-by-overlay
    eks.amazonaws.com/token-expiration: "3600"
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ztax-migrate
  namespace: ztax-cell
  labels:
    app.kubernetes.io/name: ztax-migrate
    app.kubernetes.io/part-of: zoikotax
  annotations:
    eks.amazonaws.com/role-arn: unset-set-by-overlay
    eks.amazonaws.com/token-expiration: "3600"
automountServiceAccountToken: false
