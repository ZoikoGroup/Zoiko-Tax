# The provider-neutral cell baseline. It does not start on its own — the cell
# identity, train versions, credential references, workload identities and
# image digests come from the cell's overlay — and that is deliberate: a base
# that could run would run with somebody's defaults.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - networkpolicies.yaml
  - ztax-core.yaml
  - ztax-outbox-relay.yaml
  - ztax-migrate-job.yaml
