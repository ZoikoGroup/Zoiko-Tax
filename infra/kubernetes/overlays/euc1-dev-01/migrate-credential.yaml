# The one materialised credential in the cell, and why it exists: see the
# KNOWN DEVIATION note in base/ztax-migrate-job.yaml. External Secrets reads
# aws-sm://ztax/euc1-dev-01/database/migrate under ztax-migrate's own workload
# identity — not under a controller-wide role — so the migration DSN is
# readable by exactly the principal that already holds DDL rights.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: ztax-migrate
  namespace: ztax-cell
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        jwt:
          serviceAccountRef:
            name: ztax-migrate
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ztax-migrate-database
  namespace: ztax-cell
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: ztax-migrate
  target:
    name: ztax-migrate-database
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: dsn
      remoteRef:
        key: ztax/euc1-dev-01/database/migrate
