      example: "1.0842"

    WorkpaperRef:
      x-ztax-privacy: { class: P0 }
      type: string
      title: WorkpaperRef
      description: A reference or label — an authority, a content release, a category, an exception key, a rate source. Never a customer identity.
      minLength: 1
      maxLength: 200
      example: "usf-499q@2026.3"

    WorkpaperLabel:
      x-ztax-privacy: { class: P0 }
      type: string
      title: WorkpaperLabel
      description: Text a build computed — a classification, an exclusion reason as the rule gave it, an exception's detail.
      example: "usf:interstate-telecom"

    WorkpaperText:
      x-ztax-privacy: { class: P2, purposes: [PURP-FILE, PURP-EVID], retention: RET-EVIDENCE, redaction: REDACT, aiAllowed: NONE }
      type: string
      title: WorkpaperText
      description: Free text from the person acting — a reason, an explanation of an exception, a review note.
      minLength: 1
      maxLength: 2000
      example: Credit notes issued in October for September usage, per the billing audit

    WorkpaperFilename:
      x-ztax-privacy: { class: P2, purposes: [PURP-FILE, PURP-EVID], retention: RET-EVIDENCE, redaction: REDACT, aiAllowed: NONE }
      type: string
      title: WorkpaperFilename
      minLength: 1
      maxLength: 255
      description: A recorded document's file name, as given. It may name a person.
      example: billing-audit-2026-09.pdf

    WorkpaperMediaType:
      x-ztax-privacy: { class: P0 }
      type: string
      title: WorkpaperMediaType
      maxLength: 192
      example: application/pdf

    WorkpaperCount:
      x-ztax-privacy: { class: P0 }
      type: integer
      title: WorkpaperCount
      format: int32
      minimum: 0

    WorkpaperFlag:
      x-ztax-privacy: { class: P0 }
      type: boolean
      title: WorkpaperFlag

    WorkpaperActor:
      x-ztax-privacy: { class: P1, purposes: [PURP-SEC, PURP-EVID], retention: RET-EVIDENCE, redaction: NONE }
      type: string
      title: WorkpaperActor
      format: uuid
      description: The person who acted.

    WorkpaperEvidence:
      type: object
      title: WorkpaperEvidence
      description: A document named by its SHA-256, computed where the document is. Nothing is uploaded.
      additionalProperties: false
      required: [sha256, filename, mediaType]
      properties:
        sha256: { $ref: "#/components/schemas/Sha256Hex" }
        filename: { $ref: "#/components/schemas/WorkpaperFilename" }
        mediaType: { $ref: "#/components/schemas/WorkpaperMediaType" }

    WorkpaperFXRequest:
      type: object
      title: WorkpaperFXRequest
      description: A documented FX rate and its conversion basis for one source currency.
      additionalProperties: false
      required: [currency, rate, rateSource, rateDate, roundingMode, scale, conversionBasis]
      properties:
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        rate: { $ref: "#/components/schemas/WorkpaperRate" }
        rateSource: { $ref: "#/components/schemas/WorkpaperRef" }
        rateDate: { $ref: "#/components/schemas/CivilDate" }
        roundingMode: { $ref: "#/components/schemas/WorkpaperRoundingMode" }
        scale:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 0
          maximum: 12
        conversionBasis: { $ref: "#/components/schemas/WorkpaperText" }

    WorkpaperFXRate:
      type: object
      title: WorkpaperFXRate
      description: The documented rate in force for one source currency.
      additionalProperties: false
      required: [currency, rate, rateSource, rateDate, roundingMode, scale, conversionBasis, recordedAt, recordedBy]
      properties:
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        rate: { $ref: "#/components/schemas/WorkpaperRate" }
        rateSource: { $ref: "#/components/schemas/WorkpaperRef" }
        rateDate: { $ref: "#/components/schemas/CivilDate" }
        roundingMode: { $ref: "#/components/schemas/WorkpaperRoundingMode" }
        scale: { $ref: "#/components/schemas/WorkpaperCount" }
        conversionBasis: { $ref: "#/components/schemas/WorkpaperText" }
        recordedAt: { $ref: "#/components/schemas/Timestamp" }
        recordedBy: { $ref: "#/components/schemas/WorkpaperActor" }

    WorkpaperAdjustmentRequest:
      type: object
      title: WorkpaperAdjustmentRequest
      additionalProperties: false
      required: [kind, category, amount, reason]
      properties:
        kind: { $ref: "#/components/schemas/WorkpaperAdjustmentKind" }
        category: { $ref: "#/components/schemas/WorkpaperRef" }
        amount: { $ref: "#/components/schemas/WorkpaperAmount" }
        reason: { $ref: "#/components/schemas/WorkpaperText" }

    WorkpaperAdjustment:
      type: object
      title: WorkpaperAdjustment
      description: A permitted allowance or audited adjustment in the reporting currency, with its evidence and decision.
      additionalProperties: false
      required: [number, kind, category, amount, currency, reason, evidence, material, state, proposedAt, proposedBy]
      properties:
        number: { $ref: "#/components/schemas/WorkpaperCount" }
        kind: { $ref: "#/components/schemas/WorkpaperAdjustmentKind" }
        category: { $ref: "#/components/schemas/WorkpaperRef" }
        amount: { $ref: "#/components/schemas/WorkpaperAmount" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        reason: { $ref: "#/components/schemas/WorkpaperText" }
        evidence: { $ref: "#/components/schemas/WorkpaperEvidence" }
        material: { $ref: "#/components/schemas/WorkpaperFlag" }
        state: { $ref: "#/components/schemas/WorkpaperAdjustmentState" }
        proposedAt: { $ref: "#/components/schemas/Timestamp" }
        proposedBy: { $ref: "#/components/schemas/WorkpaperActor" }
        decidedAt: { $ref: "#/components/schemas/Timestamp" }
        decidedBy: { $ref: "#/components/schemas/WorkpaperActor" }
        decisionNote: { $ref: "#/components/schemas/WorkpaperText" }

    WorkpaperResolution:
      type: object
      title: WorkpaperResolution
      description: An evidence-linked explanation of one exception, confirmed or rejected by a second person.
      additionalProperties: false
      required: [exceptionKey, fingerprint, explanation, evidence, state, proposedAt, proposedBy]
      properties:
        exceptionKey: { $ref: "#/components/schemas/WorkpaperRef" }
        fingerprint: { $ref: "#/components/schemas/Digest" }
        explanation: { $ref: "#/components/schemas/WorkpaperText" }
        evidence: { $ref: "#/components/schemas/WorkpaperEvidence" }
        state: { $ref: "#/components/schemas/WorkpaperResolutionState" }
        proposedAt: { $ref: "#/components/schemas/Timestamp" }
        proposedBy: { $ref: "#/components/schemas/WorkpaperActor" }
        decidedAt: { $ref: "#/components/schemas/Timestamp" }
        decidedBy: { $ref: "#/components/schemas/WorkpaperActor" }
        decisionNote: { $ref: "#/components/schemas/WorkpaperText" }

    WorkpaperException:
      type: object
      title: WorkpaperException
      description: One exception of the latest build and where its resolution stands.
      additionalProperties: false
      required: [key, code, detail, resolvable, fingerprint, state]
      properties:
        key: { $ref: "#/components/schemas/WorkpaperRef" }
        code: { $ref: "#/components/schemas/WorkpaperExceptionCode" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        difference: { $ref: "#/components/schemas/WorkpaperAmount" }
        detail: { $ref: "#/components/schemas/WorkpaperLabel" }
        resolvable: { $ref: "#/components/schemas/WorkpaperFlag" }
        fingerprint: { $ref: "#/components/schemas/Digest" }
        state: { $ref: "#/components/schemas/WorkpaperExceptionState" }
        resolution: { $ref: "#/components/schemas/WorkpaperResolution" }

    WorkpaperSourceRef:
      type: object
      title: WorkpaperSourceRef
      description: Lineage from a schedule line to one source event.
      additionalProperties: false
      required: [contributionId, sourceEventId, sourceVersion, sourceRef, ruleVersion, amount]
      properties:
        contributionId: { $ref: "#/components/schemas/ContributionId" }
        sourceEventId: { $ref: "#/components/schemas/ContributionRef" }
        sourceVersion: { $ref: "#/components/schemas/WorkpaperCount" }
        sourceRef: { $ref: "#/components/schemas/ContributionRef" }
        ruleVersion: { $ref: "#/components/schemas/ContributionRef" }
        amount: { $ref: "#/components/schemas/WorkpaperAmount" }
        reverses: { $ref: "#/components/schemas/WorkpaperLabel" }

    WorkpaperRevenueLine:
      type: object
      title: WorkpaperRevenueLine
      description: One revenue category in one source currency, with its source events.
      additionalProperties: false
      required: [category, currency, count, amount, sources]
      properties:
        category: { $ref: "#/components/schemas/WorkpaperLabel" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        count: { $ref: "#/components/schemas/WorkpaperCount" }
        amount: { $ref: "#/components/schemas/WorkpaperAmount" }
        converted: { $ref: "#/components/schemas/WorkpaperAmount" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/WorkpaperSourceRef" }

    WorkpaperExclusionLine:
      type: object
      title: WorkpaperExclusionLine
      description: One excluded base, by the reason the rule gave, with its source events.
      additionalProperties: false
      required: [reason, currency, count, amount, sources]
      properties:
        reason: { $ref: "#/components/schemas/WorkpaperLabel" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        count: { $ref: "#/components/schemas/WorkpaperCount" }
        amount: { $ref: "#/components/schemas/WorkpaperAmount" }
        converted: { $ref: "#/components/schemas/WorkpaperAmount" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/WorkpaperSourceRef" }

    WorkpaperQuantityLine:
      type: object
      title: WorkpaperQuantityLine
      additionalProperties: false
      required: [unit, total]
      properties:
        unit: { $ref: "#/components/schemas/WorkpaperLabel" }
        total: { $ref: "#/components/schemas/WorkpaperAmount" }

    WorkpaperSourceTypeLine:
      type: object
      title: WorkpaperSourceTypeLine
      description: The BSS control total of one kind of source record in one currency.
      additionalProperties: false
      required: [sourceType, currency, count, eligible]
      properties:
        sourceType: { $ref: "#/components/schemas/ContributionSourceType" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        count: { $ref: "#/components/schemas/WorkpaperCount" }
        eligible: { $ref: "#/components/schemas/WorkpaperAmount" }

    WorkpaperVolumes:
      type: object
      title: WorkpaperVolumes
      description: Volume and transaction counts.
      additionalProperties: false
      required: [accepted, quarantined, reversals, amendments, quantities, bySource]
      properties:
        accepted: { $ref: "#/components/schemas/WorkpaperCount" }
        quarantined: { $ref: "#/components/schemas/WorkpaperCount" }
        reversals: { $ref: "#/components/schemas/WorkpaperCount" }
        amendments: { $ref: "#/components/schemas/WorkpaperCount" }
        quantities:
          type: array
          items: { $ref: "#/components/schemas/WorkpaperQuantityLine" }
        bySource:
          type: array
          items: { $ref: "#/components/schemas/WorkpaperSourceTypeLine" }

    WorkpaperAdjustmentLine:
      type: object
      title: WorkpaperAdjustmentLine
      description: An approved allowance or adjustment as it entered the build.
      additionalProperties: false
      required: [number, category, amount, reason, evidenceSha256, material]
      properties:
        number: { $ref: "#/components/schemas/WorkpaperCount" }
        category: { $ref: "#/components/schemas/WorkpaperLabel" }
        amount: { $ref: "#/components/schemas/WorkpaperAmount" }
        reason: { $ref: "#/components/schemas/WorkpaperText" }
        evidenceSha256: { $ref: "#/components/schemas/Sha256Hex" }
        material: { $ref: "#/components/schemas/WorkpaperFlag" }

    WorkpaperTotals:
      type: object
      title: WorkpaperTotals
      description: The report totals in the reporting currency. Absent while a source currency has no documented conversion.
      additionalProperties: false
      required: [currency, grossEligible, excluded, allowances, adjustments, reportableBase]
      properties:
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        grossEligible: { $ref: "#/components/schemas/WorkpaperAmount" }
        excluded: { $ref: "#/components/schemas/WorkpaperAmount" }
        allowances: { $ref: "#/components/schemas/WorkpaperAmount" }
        adjustments: { $ref: "#/components/schemas/WorkpaperAmount" }
        reportableBase: { $ref: "#/components/schemas/WorkpaperAmount" }

    WorkpaperControlTotal:
      type: object
      title: WorkpaperControlTotal
      description: The contribution ledger's own control total for the filer, duty, period and one currency — the independent expectation the schedules are reconciled to.
      additionalProperties: false
      required: [currency, accepted, quarantined, reversals, eligible, excluded, periodDigest, incomplete, sourceChecksums]
      properties:
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        accepted: { $ref: "#/components/schemas/WorkpaperCount" }
        quarantined: { $ref: "#/components/schemas/WorkpaperCount" }
        reversals: { $ref: "#/components/schemas/WorkpaperCount" }
        eligible: { $ref: "#/components/schemas/WorkpaperAmount" }
        excluded: { $ref: "#/components/schemas/WorkpaperAmount" }
        periodDigest: { $ref: "#/components/schemas/Digest" }
        incomplete:
          type: array
          items: { $ref: "#/components/schemas/ContributionIncompleteReason" }
        sourceChecksums:
          type: array
          items: { $ref: "#/components/schemas/WorkpaperLabel" }

    WorkpaperReconLine:
      type: object
      title: WorkpaperReconLine
      description: One reconciliation — expected against actual in one currency.
      additionalProperties: false
      required: [code, currency, expected, actual, difference, status]
      properties:
        code: { $ref: "#/components/schemas/WorkpaperLabel" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        expected: { $ref: "#/components/schemas/WorkpaperAmount" }
        actual: { $ref: "#/components/schemas/WorkpaperAmount" }
        difference: { $ref: "#/components/schemas/WorkpaperAmount" }
        status: { $ref: "#/components/schemas/WorkpaperReconStatus" }

    WorkpaperBalanceLine:
      type: object
      title: WorkpaperBalanceLine
      description: One Tax Control Subledger balance of the filer in the period, debits and credits apart. Shown beside the schedules, never netted into them.
      additionalProperties: false
      required: [account, currency, debits, credits]
      properties:
        account: { $ref: "#/components/schemas/WorkpaperLabel" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        debits: { $ref: "#/components/schemas/WorkpaperAmount" }
        credits: { $ref: "#/components/schemas/WorkpaperAmount" }

    WorkpaperConversion:
      type: object
      title: WorkpaperConversion
      description: A documented FX rate a build converted with.
      additionalProperties: false
      required: [from, to, rate, rateSource, rateDate, roundingMode, scale, basis]
      properties:
        from: { $ref: "#/components/schemas/CurrencyCode" }
        to: { $ref: "#/components/schemas/CurrencyCode" }
        rate: { $ref: "#/components/schemas/WorkpaperRate" }
        rateSource: { $ref: "#/components/schemas/WorkpaperRef" }
        rateDate: { $ref: "#/components/schemas/CivilDate" }
        roundingMode: { $ref: "#/components/schemas/WorkpaperRoundingMode" }
        scale: { $ref: "#/components/schemas/WorkpaperCount" }
        basis: { $ref: "#/components/schemas/WorkpaperText" }

    WorkpaperOutput:
      type: object
      title: WorkpaperOutput
      description: A build's sealed document — its schedules, control totals and reconciliation. Its exceptions are listed on the workpaper with their resolutions.
      additionalProperties: false
      required: [formulaVersion, contentRelease, reportingCurrency, revenue, excluded, volumes, allowances, adjustments, controlTotals, reconciliation, subledger, conversions]
      properties:
        formulaVersion: { $ref: "#/components/schemas/WorkpaperRef" }
        contentRelease: { $ref: "#/components/schemas/WorkpaperRef" }
        reportingCurrency: { $ref: "#/components/schemas/CurrencyCode" }
        revenue:
          type: array
          items: { $ref: "#/components/schemas/WorkpaperRevenueLine" }
        excluded:
          type: array
          items: { $ref: "#/components/schemas/WorkpaperExclusionLine" }
        volumes: { $ref: "#/components/schemas/WorkpaperVolumes" }
        allowances:
          type: array
          items: { $ref: "#/components/schemas/WorkpaperAdjustmentLine" }
        adjustments:
          type: array
          items: { $ref: "#/components/schemas/WorkpaperAdjustmentLine" }
        totals: { $ref: "#/components/schemas/WorkpaperTotals" }
        controlTotals:
          type: array
          items: { $ref: "#/components/schemas/WorkpaperControlTotal" }
        reconciliation:
          type: array
          items: { $ref: "#/components/schemas/WorkpaperReconLine" }
        subledger:
          type: array
          items: { $ref: "#/components/schemas/WorkpaperBalanceLine" }
        conversions:
          type: array
          items: { $ref: "#/components/schemas/WorkpaperConversion" }

    WorkpaperBuild:
      type: object
      title: WorkpaperBuild
      description: One build version — the hash of what it read, the hash of what it produced. Only the latest build carries its output.
      additionalProperties: false
      required: [version, inputsHash, outputHash, basisDigest, formulaVersion, contentRelease, builtAt, builtBy]
      properties:
        version: { $ref: "#/components/schemas/WorkpaperCount" }
        inputsHash: { $ref: "#/components/schemas/Digest" }
        outputHash: { $ref: "#/components/schemas/Digest" }
        basisDigest: { $ref: "#/components/schemas/Digest" }
        formulaVersion: { $ref: "#/components/schemas/WorkpaperRef" }
        contentRelease: { $ref: "#/components/schemas/WorkpaperRef" }
        builtAt: { $ref: "#/components/schemas/Timestamp" }
        builtBy: { $ref: "#/components/schemas/WorkpaperActor" }
        output: { $ref: "#/components/schemas/WorkpaperOutput" }

    WorkpaperEvent:
      type: object
      title: WorkpaperEvent
      additionalProperties: false
      required: [seq, kind, status, recordedAt, recordedBy]
      properties:
        seq: { $ref: "#/components/schemas/WorkpaperCount" }
        kind: { $ref: "#/components/schemas/WorkpaperEventKind" }
        status: { $ref: "#/components/schemas/WorkpaperStatus" }
        note: { $ref: "#/components/schemas/WorkpaperText" }
        buildVersion: { $ref: "#/components/schemas/WorkpaperCount" }
        contentRelease: { $ref: "#/components/schemas/WorkpaperRef" }
        fx: { $ref: "#/components/schemas/WorkpaperFXRequest" }
        adjustmentNumber: { $ref: "#/components/schemas/WorkpaperCount" }
        adjustmentKind: { $ref: "#/components/schemas/WorkpaperAdjustmentKind" }
        adjustmentCategory: { $ref: "#/components/schemas/WorkpaperRef" }
        adjustmentAmount: { $ref: "#/components/schemas/WorkpaperAmount" }
        decision: { $ref: "#/components/schemas/WorkpaperDecision" }
        exceptionKey: { $ref: "#/components/schemas/WorkpaperRef" }
        fingerprint: { $ref: "#/components/schemas/Digest" }
        evidence: { $ref: "#/components/schemas/WorkpaperEvidence" }
        recordedAt: { $ref: "#/components/schemas/Timestamp" }
        recordedBy: { $ref: "#/components/schemas/WorkpaperActor" }

    Workpaper:
      type: object
      title: Workpaper
      description: |
        A regulatory workpaper (OBL-07): the header, its builds, the latest
        build's schedules and reconciliation, the exceptions and their
        resolutions, the documented FX rates, the adjustments, the history, and
        what it admits now. `eventCount` is the `expectedSeq` an act sends.
      additionalProperties: false
      required: [id, legalEntityId, duty, period, authority, reportingCurrency, materialityThreshold, initialContentRelease, contentRelease, formulaVersion, status, eventCount, createdAt, createdBy, builds, exceptions, fxRates, adjustments, resolutions, history, allowedActions, blockers]
      properties:
        id: { $ref: "#/components/schemas/WorkpaperId" }
        legalEntityId: { $ref: "#/components/schemas/LegalEntityId" }
        duty: { $ref: "#/components/schemas/ContributionRegime" }
        period: { $ref: "#/components/schemas/LegalPeriod" }
        authority: { $ref: "#/components/schemas/WorkpaperRef" }
        reportingCurrency: { $ref: "#/components/schemas/CurrencyCode" }
        materialityThreshold: { $ref: "#/components/schemas/WorkpaperAmount" }
        obligationId: { $ref: "#/components/schemas/ObligationId" }
        initialContentRelease: { $ref: "#/components/schemas/WorkpaperRef" }
        contentRelease: { $ref: "#/components/schemas/WorkpaperRef" }
        formulaVersion: { $ref: "#/components/schemas/WorkpaperRef" }
        status: { $ref: "#/components/schemas/WorkpaperStatus" }
        eventCount: { $ref: "#/components/schemas/WorkpaperCount" }
        frozenBuildVersion: { $ref: "#/components/schemas/WorkpaperCount" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        createdBy: { $ref: "#/components/schemas/WorkpaperActor" }
        builds:
          type: array
          items: { $ref: "#/components/schemas/WorkpaperBuild" }
        latestBuild: { $ref: "#/components/schemas/WorkpaperBuild" }
        exceptions:
          type: array
          items: { $ref: "#/components/schemas/WorkpaperException" }
        fxRates:
          type: array
          items: { $ref: "#/components/schemas/WorkpaperFXRate" }
        adjustments:
          type: array
          items: { $ref: "#/components/schemas/WorkpaperAdjustment" }
        resolutions:
          type: array
          items: { $ref: "#/components/schemas/WorkpaperResolution" }
        history:
          type: array
          items: { $ref: "#/components/schemas/WorkpaperEvent" }
        allowedActions:
          type: array
          items: { $ref: "#/components/schemas/WorkpaperAction" }
        blockers:
          type: array
          items: { $ref: "#/components/schemas/WorkpaperBlocker" }

    WorkpaperList:
      type: object
      title: WorkpaperList
      additionalProperties: false
      required: [workpapers]
      properties:
        workpapers:
          type: array
          items: { $ref: "#/components/schemas/Workpaper" }

    WorkpaperRequest:
      type: object
      title: WorkpaperRequest
      additionalProperties: false
      required: [duty, period, authority, reportingCurrency, contentRelease]
      properties:
        legalEntityId: { $ref: "#/components/schemas/LegalEntityId" }
        duty: { $ref: "#/components/schemas/ContributionRegime" }
        period: { $ref: "#/components/schemas/LegalPeriod" }
        authority: { $ref: "#/components/schemas/WorkpaperRef" }
        reportingCurrency: { $ref: "#/components/schemas/CurrencyCode" }
        materialityThreshold: { $ref: "#/components/schemas/WorkpaperAmount" }
        obligationId: { $ref: "#/components/schemas/ObligationId" }
        contentRelease: { $ref: "#/components/schemas/WorkpaperRef" }

    WorkpaperBuildRequest:
      type: object
      title: WorkpaperBuildRequest
      additionalProperties: false
      properties:
        expectedSeq: { $ref: "#/components/schemas/WorkpaperCount" }

    WorkpaperActionRequest:
      type: object
      title: WorkpaperActionRequest
      description: One act. The fields an action does not use are ignored.
      additionalProperties: false
      required: [action]
      properties:
        action: { $ref: "#/components/schemas/WorkpaperAction" }
        expectedSeq: { $ref: "#/components/schemas/WorkpaperCount" }
        note: { $ref: "#/components/schemas/WorkpaperText" }
        buildVersion: { $ref: "#/components/schemas/WorkpaperCount" }
        contentRelease: { $ref: "#/components/schemas/WorkpaperRef" }
        fx: { $ref: "#/components/schemas/WorkpaperFXRequest" }
        adjustment: { $ref: "#/components/schemas/WorkpaperAdjustmentRequest" }
        adjustmentNumber: { $ref: "#/components/schemas/WorkpaperCount" }
        decision: { $ref: "#/components/schemas/WorkpaperDecision" }
        exceptionKey: { $ref: "#/components/schemas/WorkpaperRef" }
        fingerprint: { $ref: "#/components/schemas/Digest" }
        evidence: { $ref: "#/components/schemas/WorkpaperEvidence" }

    WorkpaperSourceCheck:
      type: object
      title: WorkpaperSourceCheck
      description: The latest build compared with what the sources would build now. Nothing is recorded.
      additionalProperties: false
      required: [workpaperId, currentInputsHash, currentOutputHash, matches, checkedAt]
      properties:
        workpaperId: { $ref: "#/components/schemas/WorkpaperId" }
        latestBuildVersion: { $ref: "#/components/schemas/WorkpaperCount" }
        latestInputsHash: { $ref: "#/components/schemas/Digest" }
        latestOutputHash: { $ref: "#/components/schemas/Digest" }
        currentInputsHash: { $ref: "#/components/schemas/Digest" }
        currentOutputHash: { $ref: "#/components/schemas/Digest" }
        frozenBuildVersion: { $ref: "#/components/schemas/WorkpaperCount" }
        matches: { $ref: "#/components/schemas/WorkpaperFlag" }
        checkedAt: { $ref: "#/components/schemas/Timestamp" }

    # ---- registrations and exemption evidence (Engineering Doc 17, G-048) ----

    RegistrationId:
      x-ztax-privacy: { class: P0 }
      type: string
      title: RegistrationId
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      example: 01920d20-1a2b-7c3d-8e4f-5a6b7c8d9e01

    ExemptionEvidenceId:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ExemptionEvidenceId
      description: An exemption certificate held as evidence.
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      example: 01920d30-1a2b-7c3d-8e4f-5a6b7c8d9e01

    EvidenceActor:
      x-ztax-privacy: { class: P1, purposes: [PURP-SEC, PURP-EVID], retention: RET-EVIDENCE, redaction: NONE }
      type: string
      title: EvidenceActor
      description: The person who recorded an act.
      format: uuid
      example: 01920a4c-0000-7000-8000-0000000000a1

    EvidenceJurisdiction:
      x-ztax-privacy: { class: P0 }
      type: string
      title: EvidenceJurisdiction
      description: A country, or a country and one subdivision, upper case.
      pattern: "^[A-Z]{2}(-[A-Z0-9]{1,3})?$"
      example: US-NY

    EvidenceText:
      x-ztax-privacy: { class: P2, purposes: [PURP-LEGAL, PURP-EVID], retention: RET-EVIDENCE, redaction: REDACT, aiAllowed: NONE }
      type: string
      title: EvidenceText
      minLength: 1
      maxLength: 2000
      description: A reason, rationale or note from the person recording an act.

    EvidenceFilename:
      x-ztax-privacy: { class: P2, purposes: [PURP-LEGAL, PURP-EVID], retention: RET-EVIDENCE, redaction: REDACT, aiAllowed: NONE }
      type: string
      title: EvidenceFilename
      minLength: 1
      maxLength: 255
      description: A document's file name, as given. It may name a person.

    EvidenceMediaType:
      x-ztax-privacy: { class: P0 }
      type: string
      title: EvidenceMediaType
      description: A document's media type. Only a PDF or an image is accepted.
      pattern: "^(application/pdf|image/(png|jpeg|tiff|webp))$"
      example: application/pdf

    EvidenceDocument:
      type: object
      title: EvidenceDocument
      description: |
        A document recorded as evidence by its SHA-256, hashed in the browser.
        The file itself is not uploaded, scanned or stored.
      additionalProperties: false
      required: [sha256, filename, mediaType, bytes]
      properties:
        sha256: { $ref: "#/components/schemas/Sha256Hex" }
        filename: { $ref: "#/components/schemas/EvidenceFilename" }
        mediaType: { $ref: "#/components/schemas/EvidenceMediaType" }
        bytes:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int64
          minimum: 1
          maximum: 26214400

    EvidenceFlag:
      x-ztax-privacy: { class: P0 }
      type: string
      title: EvidenceFlag
      description: Something about a registration or certificate a person should look at, as of `asOf`.
      enum: [EXPIRING_SOON, PAST_EXPIRY, NOT_YET_EFFECTIVE, PENDING_VALIDATION, AUTHORITY_NEGATIVE, AWAITING_ACTIVATION, CORRECTION_REQUESTED, AWAITING_SECOND_REVIEW]

    RegistrationScheme:
      x-ztax-privacy: { class: P0 }
      type: string
      title: RegistrationScheme
      description: |
        The kind of registration. Each has its own identifier, never converted
        into another's: an FCC FRN, a USAC 499 Filer ID and a USAC 498 ID are
        distinct (Doc 17 §02).
      enum: [US_FCC_FRN, US_USAC_499_FILER_ID, US_USAC_498_ID, US_STATE_SALES_TAX_PERMIT, US_STATE_TELECOM_REGISTRATION, UK_VAT, EU_VAT, CA_GST_HST, OTHER_REGISTRATION]

    RegistrationStatus:
      x-ztax-privacy: { class: P0 }
      type: string
      title: RegistrationStatus
      description: |
        `SUBMITTED` is not `VERIFIED`, `VERIFIED` is not `ACTIVE`, and `ACTIVE`
        is not authority to file (Doc 17 §02, §07).
      enum: [DRAFT, SUBMITTED, VERIFIED, ACTIVE, SUSPENDED, EXPIRED, REVOKED, WITHDRAWN]

    RegistrationEventKind:
      x-ztax-privacy: { class: P0 }
      type: string
      title: RegistrationEventKind
      enum: [CREATED, SUBMITTED, WITHDRAWN, RETURNED, CHECK_RECORDED, ACTIVATED, SUSPENDED, REINSTATED, EXPIRED, REVOKED, ATTACHMENT_RECORDED]

    RegistrationAuthority:
      x-ztax-privacy: { class: P0 }
      type: string
      title: RegistrationAuthority
      minLength: 1
      maxLength: 128
      description: The authority the registration is held with, by name.
      example: USAC

    RegistrationNumber:
      x-ztax-privacy: { class: P2, purposes: [PURP-OBL, PURP-EVID], retention: RET-EVIDENCE, redaction: REDACT, aiAllowed: NONE }
      type: string
      title: RegistrationNumber
      minLength: 1
      maxLength: 64
      description: |
        The authority's number for the registration. Masked to its last four
        characters (`****2345`) wherever `numberMasked` is true.
      example: "812345"

    AuthorityCheckSource:
      x-ztax-privacy: { class: P0 }
      type: string
      title: AuthorityCheckSource
      description: The authority service a number was checked against. VIES does not validate GB numbers; HMRC does not validate EU ones.
      enum: [FCC, USAC, HMRC, VIES, CRA, STATE_REVENUE_AUTHORITY, OTHER_AUTHORITY]

    AuthorityCheckMethod:
      x-ztax-privacy: { class: P0 }
      type: string
      title: AuthorityCheckMethod
      description: |
        How the check was made. No authority adapter is connected, so the only
        method is a named person's lookup with the authority.
      enum: [MANUAL_LOOKUP]

    AuthorityCheckOutcome:
      x-ztax-privacy: { class: P0 }
      type: string
      title: AuthorityCheckOutcome
      description: What the authority returned. Only `VERIFIED` is positive; `INCONCLUSIVE` and `UNAVAILABLE` are never valid.
      enum: [VERIFIED, NEGATIVE, INCONCLUSIVE, UNAVAILABLE]

    AuthorityCheckReference:
      x-ztax-privacy: { class: P0 }
      type: string
      title: AuthorityCheckReference
      minLength: 1
      maxLength: 200
      description: The authority's own reference or receipt for a check, as returned.

    AuthorityCheck:
      type: object
      title: AuthorityCheck
      description: One authority check of a registration's number, as a person recorded it.
      additionalProperties: false
      required: [source, method, outcome, checkedAt]
      properties:
        source: { $ref: "#/components/schemas/AuthorityCheckSource" }
        method: { $ref: "#/components/schemas/AuthorityCheckMethod" }
        outcome: { $ref: "#/components/schemas/AuthorityCheckOutcome" }
        reference: { $ref: "#/components/schemas/AuthorityCheckReference" }
        checkedAt: { $ref: "#/components/schemas/Timestamp" }
        receiptSha256: { $ref: "#/components/schemas/Sha256Hex" }

    RegistrationEvent:
      type: object
      title: RegistrationEvent
      additionalProperties: false
      required: [seq, kind, status, recordedAt, recordedBy]
      properties:
        seq:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
        kind: { $ref: "#/components/schemas/RegistrationEventKind" }
        status: { $ref: "#/components/schemas/RegistrationStatus" }
        reason: { $ref: "#/components/schemas/EvidenceText" }
        check: { $ref: "#/components/schemas/AuthorityCheck" }
        attachment: { $ref: "#/components/schemas/EvidenceDocument" }
        recordedAt: { $ref: "#/components/schemas/Timestamp" }
        recordedBy: { $ref: "#/components/schemas/EvidenceActor" }

    Registration:
      type: object
      title: Registration
      description: |
        A registration a legal entity holds or is applying for, as of `asOf`.
        Evidence of status: it changes no tax result, and `inForce` is
        `ACTIVE` within its effective dates, nothing more.
      additionalProperties: false
      required: [id, legalEntityId, scheme, jurisdiction, authority, registrationNumber, numberMasked, effectiveFrom, status, version, inForce, flags, attachments, history, asOf, createdAt, createdBy]
      properties:
        id: { $ref: "#/components/schemas/RegistrationId" }
        legalEntityId: { $ref: "#/components/schemas/LegalEntityId" }
        scheme: { $ref: "#/components/schemas/RegistrationScheme" }
        jurisdiction: { $ref: "#/components/schemas/EvidenceJurisdiction" }
        authority: { $ref: "#/components/schemas/RegistrationAuthority" }
        registrationNumber: { $ref: "#/components/schemas/RegistrationNumber" }
        numberMasked:
          x-ztax-privacy: { class: P0 }
          type: boolean
          description: True when `registrationNumber` shows only its last four characters.
        effectiveFrom: { $ref: "#/components/schemas/CivilDate" }
        effectiveTo: { $ref: "#/components/schemas/CivilDate" }
        supersedes: { $ref: "#/components/schemas/RegistrationId" }
        status: { $ref: "#/components/schemas/RegistrationStatus" }
        version:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
          description: The number of events recorded. An activation names it.
        inForce:
          x-ztax-privacy: { class: P0 }
          type: boolean
          description: ACTIVE and within its effective dates on `asOf`'s UTC date.
        flags:
          type: array
          items: { $ref: "#/components/schemas/EvidenceFlag" }
        lastCheck: { $ref: "#/components/schemas/AuthorityCheck" }
        submittedBy: { $ref: "#/components/schemas/EvidenceActor" }
        attachments:
          type: array
          items: { $ref: "#/components/schemas/EvidenceDocument" }
        history:
          type: array
          items: { $ref: "#/components/schemas/RegistrationEvent" }
        asOf: { $ref: "#/components/schemas/Timestamp" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        createdBy: { $ref: "#/components/schemas/EvidenceActor" }

    RegistrationList:
      type: object
      title: RegistrationList
      additionalProperties: false
      required: [registrations]
      properties:
        registrations:
          type: array
          items: { $ref: "#/components/schemas/Registration" }

    RegistrationRequest:
      type: object
      title: RegistrationRequest
      additionalProperties: false
      required: [scheme, jurisdiction, authority, registrationNumber, effectiveFrom]
      properties:
        legalEntityId: { $ref: "#/components/schemas/LegalEntityId" }
        scheme: { $ref: "#/components/schemas/RegistrationScheme" }
        jurisdiction: { $ref: "#/components/schemas/EvidenceJurisdiction" }
        authority: { $ref: "#/components/schemas/RegistrationAuthority" }
        registrationNumber: { $ref: "#/components/schemas/RegistrationNumber" }
        effectiveFrom: { $ref: "#/components/schemas/CivilDate" }
        effectiveTo: { $ref: "#/components/schemas/CivilDate" }
        supersedes: { $ref: "#/components/schemas/RegistrationId" }
        attachments:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/EvidenceDocument" }
        submit:
          x-ztax-privacy: { class: P0 }
          type: boolean
          description: Submit for review now. Otherwise the registration is kept as a DRAFT.

    RegistrationTransitionRequest:
      type: object
      title: RegistrationTransitionRequest
      additionalProperties: false
      required: [to, expectedVersion]
      properties:
        to: { $ref: "#/components/schemas/RegistrationStatus" }
        expectedVersion:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
          description: The `version` that was read. Anything recorded since is `VERSION_CONFLICT`.
        reason: { $ref: "#/components/schemas/EvidenceText" }

    RegistrationCheckRequest:
      type: object
      title: RegistrationCheckRequest
      additionalProperties: false
      required: [source, method, outcome, checkedAt]
      properties:
        source: { $ref: "#/components/schemas/AuthorityCheckSource" }
        method: { $ref: "#/components/schemas/AuthorityCheckMethod" }
        outcome: { $ref: "#/components/schemas/AuthorityCheckOutcome" }
        reference: { $ref: "#/components/schemas/AuthorityCheckReference" }
        checkedAt: { $ref: "#/components/schemas/Timestamp" }
        receiptSha256: { $ref: "#/components/schemas/Sha256Hex" }
        note: { $ref: "#/components/schemas/EvidenceText" }

    ExemptionEvidenceType:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ExemptionEvidenceType
      description: The kind of exemption claimed. A resale or wholesale certificate is not an unconditional exemption and relieves no provider-side duty.
      enum: [RESALE, WHOLESALE_TELECOM, EXEMPT_ORGANIZATION, GOVERNMENT_ENTITY, DIPLOMATIC, DIRECT_PAY_PERMIT, OTHER_EXEMPTION]

    ExemptionEvidenceStatus:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ExemptionEvidenceStatus
      description: |
        `SCREENING` waits for a corrected document. `APPROVED` is evidence
        approved for its scope and dates; it is not a tax exemption.
      enum: [SUBMITTED, SCREENING, REVIEW_REQUIRED, APPROVED, REJECTED, EXPIRED, SUSPENDED, REVOKED, SUPERSEDED]

    ExemptionEvidenceEventKind:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ExemptionEvidenceEventKind
      enum: [RECEIVED, VERSION_ADDED, SCREENED, RECOMMENDED, CONFIRMED, RETURNED, SUSPENDED, REINSTATED, EXPIRED, REVOKED, SUPERSEDED]

    BuyerRef:
      x-ztax-privacy: { class: P1, purposes: [PURP-EVID, PURP-TAX-CALC], retention: RET-EVIDENCE, redaction: NONE }
      type: string
      title: BuyerRef
      minLength: 1
      maxLength: 200
      description: The buyer's identifier in the tenant's own customer system.
      example: CUST-0042

    BuyerName:
      x-ztax-privacy: { class: P2, purposes: [PURP-EVID, PURP-LEGAL], retention: RET-EVIDENCE, redaction: REDACT, aiAllowed: NONE }
      type: string
      title: BuyerName
      minLength: 1
      maxLength: 200
      description: The buyer's name as written on the certificate.

    ExemptionReasonText:
      x-ztax-privacy: { class: P2, purposes: [PURP-EVID, PURP-LEGAL], retention: RET-EVIDENCE, redaction: REDACT, aiAllowed: NONE }
      type: string
      title: ExemptionReasonText
      minLength: 1
      maxLength: 500
      description: The exemption the buyer claims, in the words of the certificate.

    CertificateNumberText:
      x-ztax-privacy: { class: P2, purposes: [PURP-EVID, PURP-LEGAL], retention: RET-EVIDENCE, redaction: REDACT, aiAllowed: NONE }
      type: string
      title: CertificateNumberText
      minLength: 1
      maxLength: 200
      description: The certificate or exemption permit number.

    ProductScopeEntry:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ProductScopeEntry
      minLength: 1
      maxLength: 100
      description: A product family or classification pattern the certificate claims, as written. Never interpreted as a rule.

    ScreeningCheckResult:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ScreeningCheckResult
      enum: [PASS, FAIL, NOT_APPLICABLE]

    ScreeningResult:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ScreeningResult
      description: |
        `DOCUMENT_COMPLETE` is not approved for use, and not a legal
        applicability pass (Doc 17 §02).
      enum: [DOCUMENT_COMPLETE, INCOMPLETE, INCONSISTENT, NEEDS_LEGAL_DECISION]

    ExemptionScreening:
      type: object
      title: ExemptionScreening
      description: The completeness checklist against one evidence version (Doc 17 EER-10).
      additionalProperties: false
      required: [sellerMatches, buyerMatches, jurisdictionMatches, formAccepted, signaturePresent, datesValid, numberPresent, result]
      properties:
        sellerMatches: { $ref: "#/components/schemas/ScreeningCheckResult" }
        buyerMatches: { $ref: "#/components/schemas/ScreeningCheckResult" }
        jurisdictionMatches: { $ref: "#/components/schemas/ScreeningCheckResult" }
        formAccepted: { $ref: "#/components/schemas/ScreeningCheckResult" }
        signaturePresent: { $ref: "#/components/schemas/ScreeningCheckResult" }
        datesValid: { $ref: "#/components/schemas/ScreeningCheckResult" }
        numberPresent: { $ref: "#/components/schemas/ScreeningCheckResult" }
        result: { $ref: "#/components/schemas/ScreeningResult" }

    ExemptionRecommendationOutcome:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ExemptionRecommendationOutcome
      enum: [APPROVE, REJECT]

    ExemptionDecision:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ExemptionDecision
      description: The checker's act on a pending recommendation.
      enum: [CONFIRM, RETURN]

    ExemptionRecommendation:
      type: object
      title: ExemptionRecommendation
      description: A recommendation awaiting a different person's confirmation.
      additionalProperties: false
      required: [recommendation, evidenceVersion, rationale, recordedAt, recordedBy]
      properties:
        recommendation: { $ref: "#/components/schemas/ExemptionRecommendationOutcome" }
        effectiveFrom: { $ref: "#/components/schemas/CivilDate" }
        effectiveTo: { $ref: "#/components/schemas/CivilDate" }
        evidenceVersion:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
        rationale: { $ref: "#/components/schemas/EvidenceText" }
        recordedAt: { $ref: "#/components/schemas/Timestamp" }
        recordedBy: { $ref: "#/components/schemas/EvidenceActor" }

    ExemptionApproval:
      type: object
      title: ExemptionApproval
      description: The confirmed approval, with its maker and checker.
      additionalProperties: false
      required: [effectiveFrom, recommendedBy, confirmedBy, confirmedAt]
      properties:
        effectiveFrom: { $ref: "#/components/schemas/CivilDate" }
        effectiveTo: { $ref: "#/components/schemas/CivilDate" }
        recommendedBy: { $ref: "#/components/schemas/EvidenceActor" }
        confirmedBy: { $ref: "#/components/schemas/EvidenceActor" }
        confirmedAt: { $ref: "#/components/schemas/Timestamp" }

    ExemptionEvidenceEvent:
      type: object
      title: ExemptionEvidenceEvent
      additionalProperties: false
      required: [seq, kind, status, evidenceVersion, recordedAt, recordedBy]
      properties:
        seq:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
        kind: { $ref: "#/components/schemas/ExemptionEvidenceEventKind" }
        status: { $ref: "#/components/schemas/ExemptionEvidenceStatus" }
        evidenceVersion:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
        note: { $ref: "#/components/schemas/EvidenceText" }
        document: { $ref: "#/components/schemas/EvidenceDocument" }
        screening: { $ref: "#/components/schemas/ExemptionScreening" }
        recommendation: { $ref: "#/components/schemas/ExemptionRecommendationOutcome" }
        effectiveFrom: { $ref: "#/components/schemas/CivilDate" }
        effectiveTo: { $ref: "#/components/schemas/CivilDate" }
        decision: { $ref: "#/components/schemas/ExemptionDecision" }
        recordedAt: { $ref: "#/components/schemas/Timestamp" }
        recordedBy: { $ref: "#/components/schemas/EvidenceActor" }

    ExemptionEvidence:
      type: object
      title: ExemptionEvidence
      description: |
        An exemption certificate held as evidence, as of `asOf`. `inForce` is
        `APPROVED` within its approved period: a statement about the document,
        never a tax treatment.
      additionalProperties: false
      required: [id, legalEntityId, buyerRef, buyerName, certificateType, exemptionReason, jurisdiction, productScope, issuedOn, status, evidenceVersion, inForce, flags, document, history, asOf, createdAt, createdBy]
      properties:
        id: { $ref: "#/components/schemas/ExemptionEvidenceId" }
        legalEntityId: { $ref: "#/components/schemas/LegalEntityId" }
        buyerRef: { $ref: "#/components/schemas/BuyerRef" }
        buyerName: { $ref: "#/components/schemas/BuyerName" }
        certificateType: { $ref: "#/components/schemas/ExemptionEvidenceType" }
        exemptionReason: { $ref: "#/components/schemas/ExemptionReasonText" }
        jurisdiction: { $ref: "#/components/schemas/EvidenceJurisdiction" }
        certificateNumber: { $ref: "#/components/schemas/CertificateNumberText" }
        productScope:
          type: array
          items: { $ref: "#/components/schemas/ProductScopeEntry" }
        issuedOn: { $ref: "#/components/schemas/CivilDate" }
        expiresOn: { $ref: "#/components/schemas/CivilDate" }
        supersedes: { $ref: "#/components/schemas/ExemptionEvidenceId" }
        status: { $ref: "#/components/schemas/ExemptionEvidenceStatus" }
        evidenceVersion:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
          description: The current document version. A checker's decision names it.
        inForce:
          x-ztax-privacy: { class: P0 }
          type: boolean
        flags:
          type: array
          items: { $ref: "#/components/schemas/EvidenceFlag" }
        document: { $ref: "#/components/schemas/EvidenceDocument" }
        screening: { $ref: "#/components/schemas/ExemptionScreening" }
        pendingRecommendation: { $ref: "#/components/schemas/ExemptionRecommendation" }
        approval: { $ref: "#/components/schemas/ExemptionApproval" }
        history:
          type: array
          items: { $ref: "#/components/schemas/ExemptionEvidenceEvent" }
        asOf: { $ref: "#/components/schemas/Timestamp" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        createdBy: { $ref: "#/components/schemas/EvidenceActor" }

    ExemptionEvidenceList:
      type: object
      title: ExemptionEvidenceList
      additionalProperties: false
      required: [certificates]
      properties:
        certificates:
          type: array
          items: { $ref: "#/components/schemas/ExemptionEvidence" }

    ExemptionEvidenceRequest:
      type: object
      title: ExemptionEvidenceRequest
      additionalProperties: false
      required: [buyerRef, buyerName, certificateType, exemptionReason, jurisdiction, issuedOn, document]
      properties:
        legalEntityId: { $ref: "#/components/schemas/LegalEntityId" }
        buyerRef: { $ref: "#/components/schemas/BuyerRef" }
        buyerName: { $ref: "#/components/schemas/BuyerName" }
        certificateType: { $ref: "#/components/schemas/ExemptionEvidenceType" }
        exemptionReason: { $ref: "#/components/schemas/ExemptionReasonText" }
        jurisdiction: { $ref: "#/components/schemas/EvidenceJurisdiction" }
        certificateNumber: { $ref: "#/components/schemas/CertificateNumberText" }
        productScope:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/ProductScopeEntry" }
        issuedOn: { $ref: "#/components/schemas/CivilDate" }
        expiresOn: { $ref: "#/components/schemas/CivilDate" }
        supersedes: { $ref: "#/components/schemas/ExemptionEvidenceId" }
        document: { $ref: "#/components/schemas/EvidenceDocument" }

    ExemptionVersionRequest:
      type: object
      title: ExemptionVersionRequest
      additionalProperties: false
      required: [document]
      properties:
        document: { $ref: "#/components/schemas/EvidenceDocument" }
        note: { $ref: "#/components/schemas/EvidenceText" }

    ExemptionScreeningRequest:
      type: object
      title: ExemptionScreeningRequest
      additionalProperties: false
      required: [screening]
      properties:
        screening: { $ref: "#/components/schemas/ExemptionScreening" }
        note: { $ref: "#/components/schemas/EvidenceText" }

    ExemptionRecommendationRequest:
      type: object
      title: ExemptionRecommendationRequest
      additionalProperties: false
      required: [recommendation, rationale]
      properties:
        recommendation: { $ref: "#/components/schemas/ExemptionRecommendationOutcome" }
        effectiveFrom: { $ref: "#/components/schemas/CivilDate" }
        effectiveTo: { $ref: "#/components/schemas/CivilDate" }
        rationale: { $ref: "#/components/schemas/EvidenceText" }

    ExemptionDecisionRequest:
      type: object
      title: ExemptionDecisionRequest
      additionalProperties: false
      required: [decision, expectedEvidenceVersion]
      properties:
        decision: { $ref: "#/components/schemas/ExemptionDecision" }
        expectedEvidenceVersion:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
          description: The evidence version that was reviewed. Any other is `VERSION_CONFLICT`.
        note: { $ref: "#/components/schemas/EvidenceText" }

    ExemptionTransitionRequest:
      type: object
      title: ExemptionTransitionRequest
      additionalProperties: false
      required: [to]
      properties:
        to: { $ref: "#/components/schemas/ExemptionEvidenceStatus" }
        reason: { $ref: "#/components/schemas/EvidenceText" }

    # ---- regulatory change intelligence (Engineering Doc 03 §04, §06, WF-05, WF-09; Sidebar WF-02) ----

    RegulatoryChangeId:
      x-ztax-privacy: { class: P0 }
      type: string
      title: RegulatoryChangeId
      description: A recorded regulatory change. A later rule-approval workflow may reference it.
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      example: 01920e10-1a2b-7c3d-8e4f-5a6b7c8d9e01

    ImpactAssessmentId:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ImpactAssessmentId
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      example: 01920e20-1a2b-7c3d-8e4f-5a6b7c8d9e01

    ReviewRecommendationId:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ReviewRecommendationId
      description: A review recommendation. This is the id a later rule-approval workflow names.
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      example: 01920e30-1a2b-7c3d-8e4f-5a6b7c8d9e01

    RegulatoryChangeKind:
      x-ztax-privacy: { class: P0 }
      type: string
      title: RegulatoryChangeKind
      description: The class of legal change (Doc 03 §06). A source with several effects is recorded as one change per kind.
      enum: [NEW_LEVY, RATE_CHANGE, REPEAL_SUNSET, BASE_CHANGE, CLASS_CHANGE, JURISDICTION_CHANGE, BACKDATED_RULE, RIGHTS_WITHDRAWAL, SOURCE_DISPUTE]

    RegulatoryChangeStatus:
      x-ztax-privacy: { class: P0 }
      type: string
      title: RegulatoryChangeStatus
      description: |
        `NEW` until triaged; `IN_IMPACT_ASSESSMENT` only by an assessment;
        `ON_HOLD` with a tracked reason; `CLOSED` and `NO_IMPACT` are final, each
        with a disposition and rationale (Doc 03 Z03-AT-09).
      enum: [NEW, TRIAGED, IN_IMPACT_ASSESSMENT, ON_HOLD, CLOSED, NO_IMPACT]

    RegulatoryChangePriority:
      x-ztax-privacy: { class: P0 }
      type: string
      title: RegulatoryChangePriority
      description: Triage's urgency (Doc 03 §06 monitoring targets).
      enum: [URGENT, MATERIAL, ORDINARY]

    RegulatoryChangeDisposition:
      x-ztax-privacy: { class: P0 }
      type: string
      title: RegulatoryChangeDisposition
      description: The decision every change ends with (Doc 03 WF-05).
      enum: [NOT_APPLICABLE, CHANGE_NEEDED, MONITOR]

    RegulatoryChangeHoldReason:
      x-ztax-privacy: { class: P0 }
      type: string
      title: RegulatoryChangeHoldReason
      enum: [SOURCE_DISPUTED, COUNSEL_QUESTION, RIGHTS_HOLD, MISSING_FACTS, MONITOR_FAILURE]

    RegulatoryChangeDetector:
      x-ztax-privacy: { class: P0 }
      type: string
      title: RegulatoryChangeDetector
      description: Human legal intake, or a watcher's alert a person recorded. No watcher is connected to this cell.
      enum: [HUMAN, MONITOR]

    RegulatoryChangeEventKind:
      x-ztax-privacy: { class: P0 }
      type: string
      title: RegulatoryChangeEventKind
      enum: [RECORDED, TRIAGED, ASSESSMENT_STARTED, HELD, RESUMED, CLOSED, NO_IMPACT]

    RegulatoryChangeTitle:
      x-ztax-privacy: { class: P0 }
      type: string
      title: RegulatoryChangeTitle
      minLength: 1
      maxLength: 200
      description: A headline for the change. About law, not about a person.
      example: New York excise on mobile voice rises

    RegulatoryChangeSummary:
      x-ztax-privacy: { class: P2, purposes: [PURP-LEGAL, PURP-EVID], retention: RET-EVIDENCE, redaction: REDACT, aiAllowed: NONE }
      type: string
      title: RegulatoryChangeSummary
      minLength: 1
      maxLength: 4000
      description: Free-text summary of the change from the person recording it.

    RegulatoryChangeSourceText:
      x-ztax-privacy: { class: P0 }
      type: string
      title: RegulatoryChangeSourceText
      minLength: 1
      maxLength: 200
      description: An authority, citation, edition or reference, as published.
      example: N.Y. Tax Law §186-e

    RegulatoryChangeSourceUrl:
      x-ztax-privacy: { class: P0 }
      type: string
      title: RegulatoryChangeSourceUrl
      maxLength: 2048
      pattern: "^https://"
      description: The source's official https URL.
      example: "https://www.tax.ny.gov/pubs_and_bulls/tg_bulletins/"

    RegulatoryChangeCode:
      x-ztax-privacy: { class: P0 }
      type: string
      title: RegulatoryChangeCode
      description: A tax type code, as the content packs name them.
      pattern: "^[A-Z][A-Z0-9_]{1,63}$"
      example: SALES_TAX

    RegulatoryChangeSource:
      type: object
      title: RegulatoryChangeSource
      description: |
        The source edition a change is reported from: its identity (authority,
        citation) and version (edition, the captured document's SHA-256, hashed
        in the browser — the document is not uploaded or stored).
      additionalProperties: false
      required: [authority, citation, edition, documentSha256]
      properties:
        authority: { $ref: "#/components/schemas/RegulatoryChangeSourceText" }
        citation: { $ref: "#/components/schemas/RegulatoryChangeSourceText" }
        url: { $ref: "#/components/schemas/RegulatoryChangeSourceUrl" }
        edition: { $ref: "#/components/schemas/RegulatoryChangeSourceText" }
        documentSha256: { $ref: "#/components/schemas/Sha256Hex" }

    RegulatoryChangeEvent:
      type: object
      title: RegulatoryChangeEvent
      additionalProperties: false
      required: [seq, kind, status, recordedAt, recordedBy]
      properties:
        seq:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
        kind: { $ref: "#/components/schemas/RegulatoryChangeEventKind" }
        status: { $ref: "#/components/schemas/RegulatoryChangeStatus" }
        priority: { $ref: "#/components/schemas/RegulatoryChangePriority" }
        disposition: { $ref: "#/components/schemas/RegulatoryChangeDisposition" }
        holdReason: { $ref: "#/components/schemas/RegulatoryChangeHoldReason" }
        reason: { $ref: "#/components/schemas/EvidenceText" }
        assessmentId: { $ref: "#/components/schemas/ImpactAssessmentId" }
        recordedAt: { $ref: "#/components/schemas/Timestamp" }
        recordedBy: { $ref: "#/components/schemas/EvidenceActor" }

    RegulatoryChange:
      type: object
      title: RegulatoryChange
      description: |
        A regulatory change as reported, with its triage and disposition. A
        reported change is not a confirmed legal effect, and nothing about it
        changes content or a tax result.
      additionalProperties: false
      required: [id, jurisdiction, kind, title, source, publishedOn, effectiveFrom, discoveredAt, detectedBy, serviceFamilies, taxTypes, retroactive, status, version, sourceKey, relatedChangeIds, recommendationCount, acceptedRecommendationCount, history, createdAt, createdBy]
      properties:
        id: { $ref: "#/components/schemas/RegulatoryChangeId" }
        jurisdiction: { $ref: "#/components/schemas/EvidenceJurisdiction" }
        kind: { $ref: "#/components/schemas/RegulatoryChangeKind" }
        title: { $ref: "#/components/schemas/RegulatoryChangeTitle" }
        summary: { $ref: "#/components/schemas/RegulatoryChangeSummary" }
        source: { $ref: "#/components/schemas/RegulatoryChangeSource" }
        publishedOn: { $ref: "#/components/schemas/CivilDate" }
        effectiveFrom: { $ref: "#/components/schemas/CivilDate" }
        discoveredAt: { $ref: "#/components/schemas/Timestamp" }
        detectedBy: { $ref: "#/components/schemas/RegulatoryChangeDetector" }
        monitorRef: { $ref: "#/components/schemas/RegulatoryChangeSourceText" }
        serviceFamilies:
          type: array
          items: { $ref: "#/components/schemas/ServiceFamily" }
        taxTypes:
          type: array
          items: { $ref: "#/components/schemas/RegulatoryChangeCode" }
        retroactive:
          x-ztax-privacy: { class: P0 }
          type: boolean
          description: Effective before it was published.
        status: { $ref: "#/components/schemas/RegulatoryChangeStatus" }
        priority: { $ref: "#/components/schemas/RegulatoryChangePriority" }
        disposition: { $ref: "#/components/schemas/RegulatoryChangeDisposition" }
        holdReason: { $ref: "#/components/schemas/RegulatoryChangeHoldReason" }
        resumesTo: { $ref: "#/components/schemas/RegulatoryChangeStatus" }
        version:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
          description: The number of events recorded. An act names it.
        sourceKey: { $ref: "#/components/schemas/Digest" }
        relatedChangeIds:
          type: array
          description: The other changes recorded from the same source edition. Empty in a listing.
          items: { $ref: "#/components/schemas/RegulatoryChangeId" }
        currentAssessmentId: { $ref: "#/components/schemas/ImpactAssessmentId" }
        currentSeverity: { $ref: "#/components/schemas/ImpactSeverity" }
        recommendationCount:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 0
        acceptedRecommendationCount:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 0
          description: Recommendations accepted on the current assessment.
        history:
          type: array
          items: { $ref: "#/components/schemas/RegulatoryChangeEvent" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        createdBy: { $ref: "#/components/schemas/EvidenceActor" }

    RegulatoryChangeList:
      type: object
      title: RegulatoryChangeList
      additionalProperties: false
      required: [changes]
      properties:
        changes:
          type: array
          items: { $ref: "#/components/schemas/RegulatoryChange" }

    RegulatoryChangeRequest:
      type: object
      title: RegulatoryChangeRequest
      additionalProperties: false
      required: [jurisdiction, kind, title, source, publishedOn, effectiveFrom, detectedBy]
      properties:
        jurisdiction: { $ref: "#/components/schemas/EvidenceJurisdiction" }
        kind: { $ref: "#/components/schemas/RegulatoryChangeKind" }
        title: { $ref: "#/components/schemas/RegulatoryChangeTitle" }
        summary: { $ref: "#/components/schemas/RegulatoryChangeSummary" }
        source: { $ref: "#/components/schemas/RegulatoryChangeSource" }
        publishedOn: { $ref: "#/components/schemas/CivilDate" }
        effectiveFrom: { $ref: "#/components/schemas/CivilDate" }
        discoveredAt: { $ref: "#/components/schemas/Timestamp" }
        detectedBy: { $ref: "#/components/schemas/RegulatoryChangeDetector" }
        monitorRef: { $ref: "#/components/schemas/RegulatoryChangeSourceText" }
        serviceFamilies:
          type: array
          maxItems: 24
          items: { $ref: "#/components/schemas/ServiceFamily" }
        taxTypes:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/RegulatoryChangeCode" }

    RegulatoryChangeTransitionRequest:
      type: object
      title: RegulatoryChangeTransitionRequest
      additionalProperties: false
      required: [to, reason, expectedVersion]
      properties:
        to: { $ref: "#/components/schemas/RegulatoryChangeStatus" }
        priority: { $ref: "#/components/schemas/RegulatoryChangePriority" }
        disposition: { $ref: "#/components/schemas/RegulatoryChangeDisposition" }
        holdReason: { $ref: "#/components/schemas/RegulatoryChangeHoldReason" }
        reason: { $ref: "#/components/schemas/EvidenceText" }
        expectedVersion:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
          description: The `version` that was read. Anything recorded since is `VERSION_CONFLICT`.

    ImpactSeverity:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ImpactSeverity
      description: How much an impacted item, or a whole assessment, matters. Advisory triage, never an amount.
      enum: [LOW, MEDIUM, HIGH, CRITICAL]

    ImpactItemKind:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ImpactItemKind
      description: |
        `CONTENT_COMPONENT` is a component of the active content in scope;
        `COVERAGE_GAP` is the jurisdiction with none; `TENANT_REGISTRATION` and
        `TENANT_OBLIGATION` are the tenant's own records in scope.
      enum: [CONTENT_COMPONENT, COVERAGE_GAP, TENANT_REGISTRATION, TENANT_OBLIGATION]

    ImpactText:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ImpactText
      minLength: 1
      maxLength: 2000
      description: A reference, label or basis the assessment generated from content and record identifiers.

    ImpactItem:
      type: object
      title: ImpactItem
      additionalProperties: false
      required: [kind, ref, label, jurisdiction, severity, basis, retrospective]
      properties:
        kind: { $ref: "#/components/schemas/ImpactItemKind" }
        ref: { $ref: "#/components/schemas/ImpactText" }
        label: { $ref: "#/components/schemas/ImpactText" }
        jurisdiction: { $ref: "#/components/schemas/ImpactText" }
        severity: { $ref: "#/components/schemas/ImpactSeverity" }
        basis: { $ref: "#/components/schemas/ImpactText" }
        retrospective:
          x-ztax-privacy: { class: P0 }
          type: boolean
          description: An obligation period a backdated change reaches back into.

    ImpactAssessment:
      type: object
      title: ImpactAssessment
      description: |
        A deterministic impact assessment: the same inputs give the same
        `inputsDigest` and `assessmentDigest`. Advisory; it writes nothing.
      additionalProperties: false
      required: [id, changeId, bundleId, bundleDigest, asOf, severity, retroactive, current, items, inputsDigest, assessmentDigest, componentsRead, registrationsRead, obligationsRead, createdAt, createdBy]
      properties:
        id: { $ref: "#/components/schemas/ImpactAssessmentId" }
        changeId: { $ref: "#/components/schemas/RegulatoryChangeId" }
        bundleId: { $ref: "#/components/schemas/ImpactText" }
        bundleDigest: { $ref: "#/components/schemas/ImpactText" }
        asOf: { $ref: "#/components/schemas/CivilDate" }
        severity: { $ref: "#/components/schemas/ImpactSeverity" }
        retroactive:
          x-ztax-privacy: { class: P0 }
          type: boolean
        current:
          x-ztax-privacy: { class: P0 }
          type: boolean
          description: This is the change's newest assessment.
        items:
          type: array
          items: { $ref: "#/components/schemas/ImpactItem" }
        inputsDigest: { $ref: "#/components/schemas/Digest" }
        assessmentDigest: { $ref: "#/components/schemas/Digest" }
        componentsRead:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 0
        registrationsRead:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 0
        obligationsRead:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 0
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        createdBy: { $ref: "#/components/schemas/EvidenceActor" }

    ImpactAssessmentList:
      type: object
      title: ImpactAssessmentList
      additionalProperties: false
      required: [assessments]
      properties:
        assessments:
          type: array
          items: { $ref: "#/components/schemas/ImpactAssessment" }

    ReviewRecommendationStatus:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ReviewRecommendationStatus
      description: |
        `ACCEPTED` is an independent reviewer's acceptance and yields a
        hand-off reference only; it is not a rule approval or a release.
      enum: [DRAFT, RECOMMENDED, CHANGES_REQUESTED, ACCEPTED, REJECTED, WITHDRAWN]

    ReviewRecommendationOrigin:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ReviewRecommendationOrigin
      enum: [HUMAN, AI_ASSISTED]

    ReviewRecommendationAction:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ReviewRecommendationAction
      enum: [UPDATE_RULE, ADD_RULE, RETIRE_RULE, NOTIFY_CUSTOMERS, RETROSPECTIVE_REASSESSMENT, MONITOR, NO_ACTION]

    ReviewRecommendationEventKind:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ReviewRecommendationEventKind
      enum: [DRAFTED, REVISED, RECOMMENDED, CHANGES_REQUESTED, ACCEPTED, REJECTED, WITHDRAWN]

    ReviewDecision:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ReviewDecision
      enum: [ACCEPT, REJECT, REQUEST_CHANGES]

    RecommendationAuthorityOutcome:
      x-ztax-privacy: { class: P0 }
      type: string
      title: RecommendationAuthorityOutcome
      description: The AI authority outcome of the draft. Only A1 (propose) is accepted (ZTAX-AIGOV-001 §4).
      enum: [A1]

    HandoffRef:
      x-ztax-privacy: { class: P0 }
      type: string
      title: HandoffRef
      minLength: 1
      maxLength: 200
      description: The opaque reference an accepted recommendation hands a later workflow.
      example: "ztx-rcr:01920e30-1a2b-7c3d-8e4f-5a6b7c8d9e01:6b86b273ff34fce1"

    RecommendationAiDraft:
      x-ztax-privacy: { class: P2, purposes: [PURP-LEGAL, PURP-EVID], retention: RET-EVIDENCE, redaction: REDACT, aiAllowed: NONE }
      type: string
      title: RecommendationAiDraft
      minLength: 1
      maxLength: 4000
      description: The model's original text, kept unchanged as evidence.

    RecommendationTarget:
      type: object
      title: RecommendationTarget
      additionalProperties: false
      required: [kind, ref]
      properties:
        kind: { $ref: "#/components/schemas/ImpactItemKind" }
        ref: { $ref: "#/components/schemas/ImpactText" }

    RecommendationAiProvenance:
      type: object
      title: RecommendationAiProvenance
      description: What ZTAX-AIGOV-001 §14 requires recorded of an AI-assisted draft.
      additionalProperties: false
      required: [useCase, modelProfile, providerProfile, promptProfile, aiTrainVersion, authorityOutcome, draft]
      properties:
        useCase: { $ref: "#/components/schemas/RegulatoryChangeSourceText" }
        modelProfile: { $ref: "#/components/schemas/RegulatoryChangeSourceText" }
        providerProfile: { $ref: "#/components/schemas/RegulatoryChangeSourceText" }
        promptProfile: { $ref: "#/components/schemas/RegulatoryChangeSourceText" }
        aiTrainVersion: { $ref: "#/components/schemas/RegulatoryChangeSourceText" }
        authorityOutcome: { $ref: "#/components/schemas/RecommendationAuthorityOutcome" }
        invocationId: { $ref: "#/components/schemas/RegulatoryChangeSourceText" }
        draft: { $ref: "#/components/schemas/RecommendationAiDraft" }

    ReviewRecommendationEvent:
      type: object
      title: ReviewRecommendationEvent
      additionalProperties: false
      required: [seq, kind, status, recordedAt, recordedBy]
      properties:
        seq:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
        kind: { $ref: "#/components/schemas/ReviewRecommendationEventKind" }
        status: { $ref: "#/components/schemas/ReviewRecommendationStatus" }
        action: { $ref: "#/components/schemas/ReviewRecommendationAction" }
        rationale: { $ref: "#/components/schemas/EvidenceText" }
        targets:
          type: array
          items: { $ref: "#/components/schemas/RecommendationTarget" }
        reason: { $ref: "#/components/schemas/EvidenceText" }
        handoffRef: { $ref: "#/components/schemas/HandoffRef" }
        recordedAt: { $ref: "#/components/schemas/Timestamp" }
        recordedBy: { $ref: "#/components/schemas/EvidenceActor" }

    ReviewRecommendation:
      type: object
      title: ReviewRecommendation
      description: |
        A recommendation derived from one assessment, bound to its digest.
        Advisory: acceptance yields `handoffRef` and publishes or changes
        nothing.
      additionalProperties: false
      required: [id, changeId, assessmentId, assessmentDigest, stale, origin, status, version, action, rationale, targets, history, createdAt, createdBy]
      properties:
        id: { $ref: "#/components/schemas/ReviewRecommendationId" }
        changeId: { $ref: "#/components/schemas/RegulatoryChangeId" }
        assessmentId: { $ref: "#/components/schemas/ImpactAssessmentId" }
        assessmentDigest: { $ref: "#/components/schemas/Digest" }
        currentAssessmentId: { $ref: "#/components/schemas/ImpactAssessmentId" }
        stale:
          x-ztax-privacy: { class: P0 }
          type: boolean
          description: Open, and the change has been reassessed since.
        origin: { $ref: "#/components/schemas/ReviewRecommendationOrigin" }
        ai: { $ref: "#/components/schemas/RecommendationAiProvenance" }
        status: { $ref: "#/components/schemas/ReviewRecommendationStatus" }
        version:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
        action: { $ref: "#/components/schemas/ReviewRecommendationAction" }
        rationale: { $ref: "#/components/schemas/EvidenceText" }
        targets:
          type: array
          items: { $ref: "#/components/schemas/RecommendationTarget" }
        recommendedBy: { $ref: "#/components/schemas/EvidenceActor" }
        reviewedBy: { $ref: "#/components/schemas/EvidenceActor" }
        handoffRef: { $ref: "#/components/schemas/HandoffRef" }
        history:
          type: array
          items: { $ref: "#/components/schemas/ReviewRecommendationEvent" }
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        createdBy: { $ref: "#/components/schemas/EvidenceActor" }

    ReviewRecommendationList:
      type: object
      title: ReviewRecommendationList
      additionalProperties: false
      required: [recommendations]
      properties:
        recommendations:
          type: array
          items: { $ref: "#/components/schemas/ReviewRecommendation" }

    ReviewRecommendationRequest:
      type: object
      title: ReviewRecommendationRequest
      additionalProperties: false
      required: [assessmentId, origin, action, rationale, targets]
      properties:
        assessmentId: { $ref: "#/components/schemas/ImpactAssessmentId" }
        origin: { $ref: "#/components/schemas/ReviewRecommendationOrigin" }
        action: { $ref: "#/components/schemas/ReviewRecommendationAction" }
        rationale: { $ref: "#/components/schemas/EvidenceText" }
        targets:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/RecommendationTarget" }
        ai: { $ref: "#/components/schemas/RecommendationAiProvenance" }

    ReviewRecommendationRevisionRequest:
      type: object
      title: ReviewRecommendationRevisionRequest
      additionalProperties: false
      required: [action, rationale, targets, expectedVersion]
      properties:
        action: { $ref: "#/components/schemas/ReviewRecommendationAction" }
        rationale: { $ref: "#/components/schemas/EvidenceText" }
        targets:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/RecommendationTarget" }
        expectedVersion:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1

    ReviewRecommendationActRequest:
      type: object
      title: ReviewRecommendationActRequest
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        reason: { $ref: "#/components/schemas/EvidenceText" }
        expectedVersion:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1

    ReviewRecommendationReviewRequest:
      type: object
      title: ReviewRecommendationReviewRequest
      additionalProperties: false
      required: [decision, reason, expectedVersion]
      properties:
        decision: { $ref: "#/components/schemas/ReviewDecision" }
        reason: { $ref: "#/components/schemas/EvidenceText" }
        expectedVersion:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
