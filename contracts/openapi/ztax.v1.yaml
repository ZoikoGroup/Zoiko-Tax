  /v1/support/cases/{caseId}/actions:
    post:
      operationId: actOnSupportCase
      tags: [support]
      summary: Take one action on a support case
      description: |
        `ADMIN`, `OPERATOR` or `ANALYST`, signed in as themselves.

        Every action appends one event to the case's single audited history;
        nothing is edited. `VERIFY` moves `NEW` to `VERIFIED`. `TRIAGE`
        classifies the case and moves it to `TRIAGED`, or to
        `TRIAGE_INCOMPLETE` with the facts requested when the contract, the
        impacted period or the seller is missing (SUP-02). `START_REVIEW` and
        `ESCALATE` move it to `IN_REVIEW`; `RESPOND` records the customer
        response, `RESOLVE` follows it, and `CLOSE` ends the case.
        `REOPEN` takes a resolved or closed case back to `IN_REVIEW`, linked to
        the event it reverses (SUP-07). `ASSIGN`, `REQUEST_EVIDENCE`,
        `ADD_EVIDENCE`, `SIGN_OFF`, `NOTE` and `REQUEST_LEGAL_HOLD` change no
        status; a legal hold request is recorded for an administrator, and
        places no hold.

        `CLOSE` needs a customer response since the last reopening, or
        `409 STATE_TRANSITION_INVALID` (SUP-14). A case that is, or was ever,
        `LEGAL` or `TAX_SPECIALIST` also needs a sign-off since the last
        reopening by someone other than its opener, or `409 SIGN_OFF_REQUIRED`;
        the opener's own sign-off is `403 SEGREGATION_OF_DUTIES` (T18-18).

        Neither clock is reset: a raised severity can bring the SLA due time
        earlier, measured from opening, and a statutory deadline once recorded
        is never changed by support (SUP-07). An action the status does not
        allow is `409 STATE_TRANSITION_INVALID`.
      parameters:
        - $ref: "#/components/parameters/SupportCaseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportCaseActionRequest"
            examples:
              verify:
                summary: Verify the requester
                value:
                  action: VERIFY
                  note: Caller confirmed as the customer's named tax contact
              escalate:
                summary: Escalate to counsel
                value:
                  action: ESCALATE
                  escalateTo: LEGAL
                  note: The customer asks how to answer the authority; counsel to review before we respond.
      responses:
        "200":
          description: The case as it stands now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportCase"
              examples:
                default:
                  summary: Example
                  value:
                    id: 01920c10-1a2b-7c3d-8e4f-5a6b7c8d9e01
                    type: LEGAL
                    openedType: LEGAL
                    severity: S2
                    subject: Letter from the tax authority about September VAT
                    description: The customer received a letter questioning the reduced rate on invoice INV-1 and asks how to answer it.
                    product: Telecom VAT
                    references:
                      decisionId: 01920a4b-7c3e-7d21-9f40-3c1a2b4d5e6f
                    evidence: ["sha256:9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08"]
                    status: VERIFIED
                    missingFacts: []
                    clocks:
                      slaDueAt: "2026-10-02T09:00:00.000000Z"
                      sla: ON_TRACK
                      statutory: NONE
                      statutoryPrecedes: false
                      dueAt: "2026-10-02T09:00:00.000000Z"
                    actions: [TRIAGE, ASSIGN, REQUEST_EVIDENCE, ADD_EVIDENCE, NOTE, REQUEST_LEGAL_HOLD]
                    signOffRequired: true
                    signedOff: false
                    responded: false
                    openedAt: "2026-10-01T09:00:00.000000Z"
                    openedBy: 01920a4c-0000-7000-8000-0000000000a1
                    history:
                      - { seq: 1, action: OPENED, status: NEW, recordedAt: "2026-10-01T09:00:00.000000Z", recordedBy: 01920a4c-0000-7000-8000-0000000000a1 }
                      - { seq: 2, action: VERIFY, status: VERIFIED, note: Caller confirmed as the customer's named tax contact, recordedAt: "2026-10-01T09:05:00.000000Z", recordedBy: 01920a4c-0000-7000-8000-0000000000a2 }
