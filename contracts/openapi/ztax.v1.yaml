        TRIAGE_INCOMPLETE is a case lacking its contract, period or seller
        facts (SUP-02). A resolved or closed case may be reopened to IN_REVIEW
        (SUP-07).
      enum: [NEW, VERIFIED, TRIAGE_INCOMPLETE, TRIAGED, IN_REVIEW, RESPONDED, RESOLVED, CLOSED]

    SupportCaseAction:
      x-ztax-privacy: { class: P0 }
      type: string
      title: SupportCaseAction
      description: An act on a case. `OPENED` is recorded by opening the case and is never requested.
      enum: [OPENED, VERIFY, TRIAGE, ASSIGN, REQUEST_EVIDENCE, ADD_EVIDENCE, START_REVIEW, ESCALATE, RESPOND, RESOLVE, SIGN_OFF, CLOSE, REOPEN, NOTE, REQUEST_LEGAL_HOLD]

    SupportEscalationTarget:
      x-ztax-privacy: { class: P0 }
      type: string
      title: SupportEscalationTarget
