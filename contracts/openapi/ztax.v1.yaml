          type: string
        checkedAt: { $ref: "#/components/schemas/Timestamp" }

    Dashboard:
      type: object
      title: Dashboard
      description: The Tax Command Center for one legal period of the tenant's default legal entity.
      additionalProperties: false
      required: [asOf, period, legalEntityId, determinations, liability, accrued, adjustments, liabilityMix, obligations, compliance, calendar, documents, reconciliation, evidence, jurisdictions, actions, trend, coverage]
      properties:
        asOf: { $ref: "#/components/schemas/Timestamp" }
        period: { $ref: "#/components/schemas/LegalPeriod" }
        legalEntityId: { $ref: "#/components/schemas/LegalEntityId" }
        determinations: { $ref: "#/components/schemas/DashboardDeterminations" }
        liability:
          type: array
          description: |
            `TAX_COLLECTED_LIABILITY` for the period, per currency, credits
            and debits apart. Empty when nothing posted.
          items: { $ref: "#/components/schemas/ControlBalance" }
        accrued:
          type: array
          description: |
            `TAX_ACCRUED_LIABILITY` for the period, per currency, credits and
            debits apart: tax the provider owes on its own account rather than
            collects from a customer. Never folded into `liability`.
          items: { $ref: "#/components/schemas/ControlBalance" }
        adjustments:
          type: array
          description: `TAX_ADJUSTMENT_CONTROL` for the period, per currency, credits and debits apart.
          items: { $ref: "#/components/schemas/ControlBalance" }
        liabilityMix:
          type: array
          description: |
            The period's credits to collected liability, accrued liability and
            adjustment control, one entry per currency, ordered by currency.
          items: { $ref: "#/components/schemas/DashboardLiabilityMix" }
        obligations: { $ref: "#/components/schemas/DashboardObligations" }
        compliance: { $ref: "#/components/schemas/DashboardCompliance" }
        calendar:
          type: array
          description: |
            The obligation window's unfiled obligations, overdue ones
            included, earliest due first. At most 10.
          items: { $ref: "#/components/schemas/DashboardDeadline" }
        documents: { $ref: "#/components/schemas/DashboardDocuments" }
        coverage: { $ref: "#/components/schemas/DashboardCoverage" }
        reconciliation: { $ref: "#/components/schemas/DashboardReconciliation" }
        evidence: { $ref: "#/components/schemas/DashboardEvidence" }
        jurisdictions: { $ref: "#/components/schemas/DashboardJurisdictions" }
        actions:
          type: array
          description: What needs a person, most urgent first. At most 25.
          items: { $ref: "#/components/schemas/DashboardAction" }
        trend: { $ref: "#/components/schemas/DashboardTrend" }

    DashboardDeterminations:
      type: object
      title: DashboardDeterminations
      description: |
        Decisions recorded in the period and the one before it, and the tax
        their journals credited to `TAX_COLLECTED_LIABILITY`, per currency.
      additionalProperties: false
      required: [decisions, tax, previousPeriod, previousDecisions, previousTax, reviewRequired]
      properties:
        decisions:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 0
        tax:
          type: array
          items: { $ref: "#/components/schemas/MoneyValue" }
        previousPeriod: { $ref: "#/components/schemas/LegalPeriod" }
        previousDecisions:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 0
        previousTax:
          type: array
          items: { $ref: "#/components/schemas/MoneyValue" }
        reviewRequired:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 0
          description: Decisions in the period whose outcome needs a person — REVIEW_REQUIRED, AMBIGUOUS, CONFLICTED or UNSUPPORTED.

    DashboardObligations:
      type: object
      title: DashboardObligations
      description: |
        Current obligations not yet filed whose due date falls within
        `windowDays` of today in their own legal calendar, overdue ones
        included, and the assessed amounts of all of them per currency.
      additionalProperties: false
      required: [windowDays, due, overdue, amounts]
      properties:
        windowDays:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
        due:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 0
        overdue:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 0
        amounts:
          type: array
          items: { $ref: "#/components/schemas/MoneyValue" }

    DashboardLiabilityMix:
      type: object
      title: DashboardLiabilityMix
      description: |
        One currency's credits in the period to `TAX_COLLECTED_LIABILITY`
        (`collected`), `TAX_ACCRUED_LIABILITY` (`accrued`, owed by the
        provider on its own account) and `TAX_ADJUSTMENT_CONTROL`
        (`adjustments`). The shares are whole percentages for drawing,
        allocated by largest remainder so they sum to 100, and all zero when
        nothing was credited. They are not amounts.
      additionalProperties: false
      required: [currency, collected, accrued, adjustments, collectedShare, accruedShare, adjustmentsShare]
      properties:
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        collected: { $ref: "#/components/schemas/MoneyValue" }
        accrued: { $ref: "#/components/schemas/MoneyValue" }
        adjustments: { $ref: "#/components/schemas/MoneyValue" }
        collectedShare:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        accruedShare:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        adjustmentsShare:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 0
          maximum: 100

    DashboardCompliance:
      type: object
      title: DashboardCompliance
      description: |
        Obligations whose legal due date falls in the period, and those
