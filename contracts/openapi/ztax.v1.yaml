        - $ref: "#/components/parameters/NoticeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoticeDeadlineRequest"
            examples:
              default:
                summary: An extension granted by letter
                value:
                  kind: EXTENSION
                  dueDate: "2026-11-30"
                  timezone: Europe/Berlin
                  source: AUTHORITY_CONFIRMATION
                  verified: true
                  evidence: Extension letter of 20 October.
                  authorityReference: EXT-2026-77
