                    accrued:
                      - { account: TAX_ACCRUED_LIABILITY, currency: EUR, debits: "0.00", credits: "64.00" }
                    adjustments: []
                    liabilityMix:
                      - currency: EUR
                        collected: { amount: "882.00", currency: EUR }
                        accrued: { amount: "64.00", currency: EUR }
                        adjustments: { amount: "0.00", currency: EUR }
                        collectedShare: 93
