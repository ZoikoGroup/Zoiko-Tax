                      - { seq: 2, state: REOPENED, reason: A supplier credit dated in September arrived after close., recordedAt: "2026-10-05T11:00:00.000000Z", requestId: 01920aa0-1a2b-7c3d-8e4f-5a6b7c8d9e0f }
