                    bridgeId: 01920c20-0000-7000-8000-0000000000b1
                    snapshotId: 01920c20-1a2b-7c3d-8e4f-5a6b7c8d9e30
                    snapshotDigest: "zt1:1c3e5b7d9f2a4c6e8b0d1f3a5c7e9b2d4f6a8c0e1b3d5f7a9c2e4b6d8f0a1c3e"
                    legalEntityId: 01920a4c-0000-7000-8000-00000000e001
                    period: "2026-09"
                    currency: USD
                    mappingVersion: 1
                    outcome: HELD
                    holds:
                      - { reason: REJECTED_CORRECTION_OPEN, journals: 1 }
                    journalCount: 2
                    postedJournalCount: 1
                    populationDigest: "zt1:7b9d2f4a6c8e0b1d3f5a7c9e1b3d5f7a9c2e4b6d8f0a1c3e5b7d9f2a4c6e8b0d"
                    exceptionCount: 2
                    ranAt: "2026-10-05T18:15:00.000000Z"
                    ranBy: 01920a4c-0000-7000-8000-0000000000a1
                    items:
                      - { matchKey: "gl:1990-00", glAccount: "1990-00", tcslAccounts: [CUSTOMER_GL_BRIDGE], expected: { amount: "17.50", currency: USD }, observed: { amount: "10.00", currency: USD }, variance: { amount: "-7.50", currency: USD }, status: PARTIAL }
                      - { matchKey: "gl:2310-00", glAccount: "2310-00", tcslAccounts: [TAX_COLLECTED_LIABILITY], expected: { amount: "-17.50", currency: USD }, observed: { amount: "-10.00", currency: USD }, variance: { amount: "7.50", currency: USD }, status: PARTIAL }
