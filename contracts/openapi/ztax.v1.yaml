                        mappingVersion: 1
                        outcome: RECONCILED
                        holds: []
                        journalCount: 1
                        postedJournalCount: 1
                        populationDigest: "zt1:7b9d2f4a6c8e0b1d3f5a7c9e1b3d5f7a9c2e4b6d8f0a1c3e5b7d9f2a4c6e8b0d"
                        exceptionCount: 0
                        ranAt: "2026-10-05T18:15:00.000000Z"
                        ranBy: 01920a4c-0000-7000-8000-0000000000a1
                        items:
                          - { matchKey: "gl:1990-00", glAccount: "1990-00", tcslAccounts: [CUSTOMER_GL_BRIDGE], expected: { amount: "10.00", currency: USD }, observed: { amount: "10.00", currency: USD }, variance: { amount: "0.00", currency: USD }, status: MATCHED }
                          - { matchKey: "gl:2310-00", glAccount: "2310-00", tcslAccounts: [TAX_COLLECTED_LIABILITY], expected: { amount: "-10.00", currency: USD }, observed: { amount: "-10.00", currency: USD }, variance: { amount: "0.00", currency: USD }, status: MATCHED }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: runGLReconciliation
      tags: [erp]
      summary: Reconcile the subledger with an ERP's GL balances
      description: |
        `OPERATOR`.

        Compares one GL snapshot, account by account, with what the subledger's
        journals of the bridge's legal entity, the snapshot's period and
        currency put on the TCSL accounts the bridge's current mapping maps to
        each GL account. Every item keeps its exact variance (observed −
        expected, net debit) whatever it is; there is no tolerance. A GL account
        the ERP reported and nothing maps to, a mapped account the ERP did not
        report, and a TCSL account with no mapping are each items of their own.

        `HELD` while any of the period's journals is not in a batch the ERP has
        posted — unexported, awaiting dispatch or posting, of unknown outcome,
        or rejected with its correction open — and never reported reconciled
        while it is. A variance is cleared by fixing the source and running a
        new reconciliation over a new snapshot, not by a note.
      parameters:
        - $ref: "#/components/parameters/ERPBridgeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GLReconciliationRequest"
            examples:
              default:
                summary: Example
                value:
                  snapshotId: 01920c20-1a2b-7c3d-8e4f-5a6b7c8d9e30
      responses:
        "201":
          description: The reconciliation, recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GLReconciliation"
