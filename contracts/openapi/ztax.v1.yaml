# ZoikoTax v1 — the authoritative contract.
#
# ADR-0010 §2.1: this file is the source of truth, not a description of the Go
# code. It is reviewed and approved by people who do not read Go, and it drives
# code generation in other languages, so it is the input rather than the output.
#
# ADR-0010 §2.2: this document is OpenAPI 3.2.0 and stays that way. The
# toolchain runs from a mechanically derived 3.1.0 export in export/, which is
# generated, hash-checked and never edited by hand. When a 3.2-capable
# toolchain is certified, one build step is deleted and nothing here changes.
#
# Three rules the lint in ../tools/lint.mjs enforces mechanically, because a
# rule nobody checks is a rule that decays:
#
#   1. No `type: number` anywhere a fiscal amount can appear (§2.9). JSON
#      numbers cannot carry decimal precision, and we do not control the
#      client's parser at all.
#   2. Every error response references the shared Problem schema (§2.8). An
#      endpoint declaring an ad-hoc error shape fails lint.
#   3. Every operation carries an operationId, a summary and at least one
#      example.
#
# Not in this contract, deliberately: GET /healthz and GET /readyz. They exist
# and they are not a customer surface — they are for an orchestrator, they carry
# no session, and their bodies are plain text on purpose. Putting them here
# would generate SDK methods nobody should call and would make a liveness probe
# a compatibility commitment governed by §2.6.

openapi: 3.2.0

info:
  title: ZoikoTax
  version: "1.0.0"
  summary: Discovery, identity, administration and determination surface of a ZoikoTax regional cell.
  description: |
    This is the `/v1` surface a ZoikoTax regional cell serves today: discovery,
    authentication, tenant administration, and the first part of the
    determination surface named in `ZTAX-INT-001` — quotes, transaction commit,
    decisions and replay. Adjust, refund, classifications, obligations, batches
    and jobs are added by addition under the same major version (ADR-0010 §2.6).

    **No authoritative fiscal output is permitted before A4.** A client
    discovers whether this deployment may produce one from
    `GET /v1/capabilities`, which reports `authoritative`, never from a release
    note. A deployment reporting `authoritative: false` produces advisory
    figures that must not be filed.

    ## Errors

    Every error is an RFC 9457 Problem Details document with
    `Content-Type: application/problem+json` (ADR-0016). Two fields matter more
    than the status code:

    - `ztx_reason_code` is from a closed, registered vocabulary. It means the
      same thing in an error, in a decision and in evidence, and it is what a
      client branches on. Never match on `title` or `detail`; both may be
      reworded.
    - `ztx_retryable` states whether retrying the request unchanged could
      succeed. It is a property of the error rather than something to infer from
      the status, so a client does not have to guess.

    The full reason-code vocabulary this deployment can emit is reported by
    `GET /v1/capabilities`.

    ## Fiscal amounts

    Every fiscal amount in this API is a JSON **string** in canonical decimal
    form, such as `"12.50"` — never a JSON number (ADR-0010 §2.9). Trailing
    zeros are significant: `"1.50"` and `"1.5"` are different assertions about
    precision. Do not parse one into a binary float; `JSON.parse` in a browser
    does exactly that and is the reason this rule exists.

    The same holds for rates and quantities, and for every value a
    determination emits. The `Decimal` schema is the one definition of the form.
  contact:
    name: ZoikoTax integration
    url: https://developers.zoikotax.com
  license:
    name: Proprietary
    identifier: LicenseRef-ZoikoTax-Proprietary

servers:
  - url: https://{cell}.zoikotax.com
    description: A regional execution cell. Data never leaves its region.
    variables:
      cell:
        default: eu-west-1
        description: The cell serving the tenant's residency region.
  - url: http://localhost:8080
    description: Local development stack (`docker compose up`).

tags:
  - name: discovery
    description: What this deployment can actually do, right now.
  - name: authentication
    description: Sessions. Opaque, server-side, cookie-borne (ADR-0020).
  - name: administration
    description: Tenant, users, sessions and the audit trail.
  - name: determination
    description: Quotes, commits, decisions and replay. Advisory until A4.
  - name: subledger
    description: The Tax Control Subledger — control journals and balances, not the customer GL.
  - name: classification
    description: Advisory classification assistance through the Governed Model Gateway.
  - name: obligations
    description: Periodic returns assessed from committed decisions, and their lifecycle.
  - name: refunds
    description: Refunds of tax a committed decision charged. Their own lifecycle; never a decision, never a credit.
  - name: webhooks
    description: Delivery of the cell's events to endpoints a tenant names. Signed, retried, dead-lettered and replayable; egress-guarded.
  - name: batches
    description: Many commits queued as one asynchronous job, each item on the single-commit path.
  - name: evidence
    description: Period seals, their verification, and the inclusion proof that ties one decision to a signed root.
  - name: documents
    description: Fiscal documents that present committed decisions, and the voids, credits and rebills that correct them. Never edited.
  - name: reconciliation
    description: R1 to R7 over a legal period, every item recorded with its exact variance, every resolution with its evidence.
  - name: retention
    description: Versioned retention policies, legal holds, and the disposition verdict that weighs them. Nothing here deletes or rewrites a record.
  - name: legal
    description: The LegalAuthorization matrix, customer authorizations and powers of attorney, and the gate that resolves whether an action may execute. Fails closed.
  - name: compliance
    description: Compliance packages that turn an obligation into a filing — preparation, independent review, exact-version approval, submission and the authority's answer. TRANSMITTING is not FILED.
  - name: notices
    description: Regulatory notices, assessments, audits, appeals and information requests — registered with the statutory deadline the authority set, its source and verification, worked through authenticity and legal review to a four-eye approved response, the authority receipt and outcome. Notices reference fiscal records and never change them.
  - name: remittance
    description: Payee master data and payment instructions for accepted returns. ZoikoTax instructs the customer's own provider and never holds funds; submitted is not settled.
  - name: support
    description: Customer support cases — triage, routing and response under two separate clocks, the support SLA and any statutory deadline. No tax-rule or financial authority; fiscal records are referenced, never changed.
  - name: contributions
    description: Provider contributions — the operator's own contributions to USF, CRTC NCF and similar funds, assessed on its eligible revenue. Never the recovery charged to customers. Source events recorded once, reversed by new events, quarantined without deletion, and totalled exactly per period.
  - name: workpapers
    description: Regulatory workpapers — a legal filer's tax or regulatory base for one duty and period, assembled deterministically from the provider contribution ledger and the subledger, reconciled to control totals, with evidence-linked adjustments and resolutions, a frozen source snapshot and a two-person approval.
  - name: registrations
    description: Legal-entity registrations and exemption certificates held as evidence (Engineering Doc 17). Records, authority checks a person attests, four-eyed activation and approval on an exact version, and expiry. Evidence only — neither changes a tax result.
  - name: regulatory-changes
    description: Regulatory change intelligence (Engineering Doc 03 WF-05, WF-09; Sidebar WF-02) — the change feed with triage and disposition, deterministic tax impact assessment against the active content and the tenant's own records, and review recommendations a specialist recommends and a different person independently reviews. Advisory only — nothing here publishes content or changes a tax result.
  - name: erp
    description: The ERP journal bridge — sealed export batches of posted subledger journals, mapped onto the customer's chart of accounts, dispatched through the transactional outbox, with transport receipt kept apart from GL posting — and the subledger-to-GL reconciliation (R6). ZoikoTax is not the customer's general ledger and connects to no real ERP here; the ERP's answers and balances are recorded with their evidence.
  - name: shadow
    description: Shadow assurance — another engine's results compared with ZoikoTax's decisions, component by component. Non-impact; matching a comparator is not verified correctness.
  - name: migration
    description: Migration programs — immutable source snapshots, versioned code mappings, AS_KNOWN conversion with crosswalk and reconciliation, governed exceptions and a cutover state machine.
  - name: contact
    description: The public contact form. Delivered to the cell's inbox by email; nothing is stored.
  - name: dashboard
    description: The Tax Command Center — read-only aggregates over the record the other surfaces write. Never a second source of any figure.

security:
  - sessionCookie: []

paths:
  /v1/capabilities:
    get:
      operationId: getCapabilities
      tags: [discovery]
      summary: Report this deployment's effective capability
      description: |
        Effective capability, not entitlement: the intersection of content
        state, security, QA and commercial entitlement (ADR-0010 §2.6).

        Unauthenticated, because a client needs to know whether a cell can serve
        it before it has a session, and because an integration diagnosing a
        problem should not need a credential to report which cell and which
        content bundle it reached.

        `content` is absent in a cell with no bundle loaded, which is a
        legitimate deployment before A4. Absent rather than null: "no content"
        and "content with no identity" are different facts (ADR-0011 P3).
      security: []
      responses:
        "200":
          description: The deployment's effective capability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
              examples:
                preAuthorization:
                  summary: A cell before A4, with a worked pack loaded
                  value:
                    cell: eu-west-1
                    region: eu-west
                    environment: development
                    trains:
                      app: 0.4.0
                      content: 0.0.0-dev
                      ai: 0.1.0
                      adapter: 0.2.0
                      infra: 0.3.0
                      schema: 0.1.0
                      migration: "6"
                    canonProfile: canon/v1
                    authoritative: false
                    reasonCodes: [AMBIGUOUS, CURRENCY_MISMATCH, FORBIDDEN, NOT_AUTHORITATIVE, NO_CONTENT_BUNDLE]
                    eventTypes: [com.zoikotax.decision.committed, com.zoikotax.decision.corrected, com.zoikotax.obligation.status-changed]
                    content:
                      bundleId: eu-vat-worked-2026.09
                      digest: "zt1:be8651b55057f0f11f2a39820495b373417e5aa81b122f61b9fcb79faaf86c7b"
                      irVersion: 1
                      nodeCount: 22
                noContent:
                  summary: A cell deployed with no content bundle
                  value:
                    cell: eu-west-1
                    region: eu-west
                    environment: production
                    trains:
                      app: 0.4.0
                      content: none
                      ai: 0.1.0
                      adapter: 0.2.0
                      infra: 0.3.0
                      schema: 0.1.0
                      migration: "6"
                    canonProfile: canon/v1
                    authoritative: false
                    reasonCodes: [NO_CONTENT_BUNDLE, NOT_AUTHORITATIVE]
                    eventTypes: [com.zoikotax.decision.committed, com.zoikotax.decision.corrected, com.zoikotax.obligation.status-changed]
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/auth/sign-in:
    post:
      operationId: signIn
      tags: [authentication]
      summary: Open a session
      description: |
        Exchanges a tenant slug, an email address and a password for an opaque
        session cookie.

        The response carries **no token**. The session identifier is in a
        `__Host-`-prefixed, `HttpOnly`, `SameSite=Strict` cookie that JavaScript
        cannot read, which is why the browser client has nothing to store and
        nothing to leak (ADR-0019 C8, ADR-0020).

        A failure does not distinguish an unknown subject from a wrong password.
        The difference is an account-enumeration oracle and a caller can do
        nothing with it, so both are `INVALID_CREDENTIALS`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
            examples:
              default:
                summary: An administrator signing in
                value:
                  tenant: acme
                  email: admin@acme.example
                  password: "correct horse battery staple"
      responses:
        "200":
          description: The session, and the subject it belongs to.
          headers:
            Set-Cookie:
              description: |
                The opaque session cookie. `__Host-ztax_session` where the
                deployment is served over TLS; `ztax_session` on plain HTTP in
                local development only, because a browser silently drops a
                `__Host-` cookie that is not `Secure`.
              schema: { type: string }
              example: "__Host-ztax_session=…; Path=/; Secure; HttpOnly; SameSite=Strict"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              examples:
                default:
                  summary: A signed-in administrator
                  value:
                    tenant:
                      id: ztn_01JBQ0S9C3X8Q1H6M2KX5R7F4A
                      slug: acme
                      displayName: Acme Telecom
                      residencyRegion: eu-west
                      status: ACTIVE
                    user:
                      id: ztu_01JBQ0S9C3X8Q1H6M2KX5R7F4B
                      email: admin@acme.example
                      displayName: Ada Lovelace
                      status: ACTIVE
                      roles: [ADMIN]
                      createdAt: "2026-09-01T09:14:22.104000Z"
                    expiresAt: "2026-09-24T09:14:22.104000Z"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/auth/sign-out:
    post:
      operationId: signOut
      tags: [authentication]
      summary: End the current session
      description: |
        Revokes this session server-side and clears the cookie. The session is
        revoked rather than forgotten, so it appears in
        `GET /v1/admin/sessions` with `revoked: true` — a session that vanished
        would leave nothing for an audit to look at.
      responses:
        "204":
          description: The session is revoked and the cookie is cleared.
          headers:
            Set-Cookie:
              description: The cleared session cookie.
              schema: { type: string }
              example: "__Host-ztax_session=; Path=/; Max-Age=0; Secure; HttpOnly; SameSite=Strict"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/auth/session:
    get:
      operationId: getSession
      tags: [authentication]
      summary: Who am I, and until when
      description: |
        The only way a client learns its own identity. Nothing about the session
        is readable in the browser, so a client calls this on load rather than
        decoding a token (ADR-0019 C8).
      responses:
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              examples:
                default:
                  summary: An analyst's session
                  value:
                    tenant:
                      id: ztn_01JBQ0S9C3X8Q1H6M2KX5R7F4A
                      slug: acme
                      displayName: Acme Telecom
                      residencyRegion: eu-west
                      status: ACTIVE
                    user:
                      id: ztu_01JBQ0S9C3X8Q1H6M2KX5R7F4C
                      email: analyst@acme.example
                      displayName: Grace Hopper
                      status: ACTIVE
                      roles: [ANALYST]
                      createdAt: "2026-09-02T11:02:00.000000Z"
                    expiresAt: "2026-09-24T09:14:22.104000Z"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/auth/password:
    post:
      operationId: changePassword
      tags: [authentication]
      summary: Change the current subject's password
      description: |
        Verifies the current password and replaces it.

        **Every session for this subject is revoked, including this one.** A
        password change is the action taken when a credential is believed
        compromised, and leaving other sessions alive would defeat it. The
        client is signed out and must sign in again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
            examples:
              default:
                summary: Rotating a password
                value:
                  currentPassword: "correct horse battery staple"
                  newPassword: "a considerably longer passphrase than that one"
      responses:
        "204":
          description: The password is changed and every session is revoked.
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags: [authentication]
      summary: Email a password-reset link
      description: |
        Emails a one-time link that sets a new password to the account at this
        tenant and address, if there is one. An invited user who never set a
        password is sent a fresh invitation instead; a disabled account is sent
        nothing.

        **The answer is always 202**, whether or not the account exists: which
        accounts exist is not the caller's to learn. The message is sent off the
        request path for the same reason, so its round trip to the mail server
        does not time the answer. A reset link expires after an hour and works
        once, and issuing one spends every earlier one.

        Answers 503 when the cell sends no mail, and 429 when one client or one
        address asks too often.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
            examples:
              default:
                summary: A user who has forgotten their password
                value:
                  tenant: acme
                  email: analyst@acme.example
      responses:
        "202":
          description: Accepted. If the account exists, a link is on its way.
        "400": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/auth/password-link:
    post:
      operationId: setPasswordWithLink
      tags: [authentication]
      summary: Set a password from an emailed link
      description: |
        Redeems an invitation or reset link: sets the password, activates an
        invited account, spends the link and **revokes every session the user
        holds**. It opens no session; the caller signs in with the new password,
        and the response names the tenant and address to sign in with.

        An unknown, expired, superseded or already-used link is one answer,
        `CREDENTIAL_LINK_INVALID`: the holder can do nothing different about any
        of them but ask for a new one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordWithLinkRequest"
            examples:
              default:
                summary: Accepting an invitation
                value:
                  token: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                  password: "a considerably longer passphrase than that one"
      responses:
        "200":
          description: The password is set. Sign in with it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordSet"
              examples:
                default:
                  summary: An invitation accepted
                  value:
                    tenant: acme
                    email: analyst@acme.example
        "400": { $ref: "#/components/responses/Validation" }
        "403":
          description: |
            The link cannot set a password — `CREDENTIAL_LINK_INVALID` — or the
            account or its tenant has been disabled since it was sent.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
              examples:
                linkInvalid:
                  summary: An expired link
                  value:
                    type: https://errors.zoikotax.com/v1/credential-link-invalid
                    title: Credential link invalid
                    status: 403
                    detail: The link is not valid, has expired or has already been used. Ask for a new one.
                    instance: /v1/auth/password-link
                    ztx_reason_code: CREDENTIAL_LINK_INVALID
                    ztx_request_id: 01JBQ0S9C3X8Q1H6M2KX5R7F4Q
                    ztx_retryable: false
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/contact:
    post:
      operationId: submitContact
      tags: [contact]
      summary: Send a message to ZoikoTax
      description: |
        The public contact form. The message is emailed to the cell's inbox with
        `Reply-To` set to the sender, and **nothing is stored**: the cell keeps no
        copy of an enquiry it has no other use for.

        Answers 503 when the cell has no inbox configured or the mail server
        refused the message, and 429 when one client sends too often.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
            examples:
              default:
                summary: A sales enquiry
                value:
                  name: Grace Hopper
                  email: grace@example.com
                  company: Example Telecom
                  message: We operate in twelve EU markets and would like a demonstration.
      responses:
        "202":
          description: The message is sent.
        "400": { $ref: "#/components/responses/Validation" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/admin/tenant:
    get:
      operationId: getTenant
      tags: [administration]
      summary: The authenticated subject's tenant
      description: |
        Requires a session but no particular role: every member of a tenant may
        see which tenant they are in, its residency region and whether it is
        suspended.
      responses:
        "200":
          description: The tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
              examples:
                default:
                  summary: An active tenant
                  value:
                    id: ztn_01JBQ0S9C3X8Q1H6M2KX5R7F4A
                    slug: acme
                    displayName: Acme Telecom
                    residencyRegion: eu-west
                    status: ACTIVE
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/admin/users:
    get:
      operationId: listUsers
      tags: [administration]
      summary: List the tenant's users
      description: Readable by `ADMIN`, `ANALYST` and `AUDITOR`.
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The tenant's users.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
              examples:
                default:
                  summary: Two users
                  value:
                    users:
                      - id: ztu_01JBQ0S9C3X8Q1H6M2KX5R7F4B
                        email: admin@acme.example
                        displayName: Ada Lovelace
                        status: ACTIVE
                        roles: [ADMIN]
                        createdAt: "2026-09-01T09:14:22.104000Z"
                      - id: ztu_01JBQ0S9C3X8Q1H6M2KX5R7F4C
                        email: analyst@acme.example
                        displayName: Grace Hopper
                        status: INVITED
                        roles: [ANALYST]
                        createdAt: "2026-09-02T11:02:00.000000Z"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

    post:
      operationId: createUser
      tags: [administration]
      summary: Create a user
      description: |
        `ADMIN` only. A user created without a password is `INVITED` and cannot
        sign in until one is set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            examples:
              invited:
                summary: An invited auditor with no password yet
                value:
                  email: auditor@acme.example
                  displayName: Katherine Johnson
                  roles: [AUDITOR]
      responses:
        "201":
          description: The created user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                default:
                  summary: The invited auditor
                  value:
                    id: ztu_01JBQ0S9C3X8Q1H6M2KX5R7F4D
                    email: auditor@acme.example
                    displayName: Katherine Johnson
                    status: INVITED
                    roles: [AUDITOR]
                    createdAt: "2026-09-23T12:00:00.000000Z"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/admin/users/{userId}/status:
    post:
      operationId: setUserStatus
      tags: [administration]
      summary: Enable or disable a user
      description: |
        `ADMIN` only. Disabling a user revokes their sessions: an account whose
        access has been withdrawn and whose session still works is an account
        whose access has not been withdrawn.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserStatusRequest"
            examples:
              disable:
                summary: Withdrawing access
                value:
                  status: DISABLED
      responses:
        "204":
          description: The status is set.
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
