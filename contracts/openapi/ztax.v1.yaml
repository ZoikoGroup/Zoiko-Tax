                  value:
                    noticeId: 01920c10-1a2b-7c3d-8e4f-5a6b7c8d9e01
                    original: { kind: ORIGINAL, dueDate: "2026-10-31", dueAt: "2026-10-31T22:59:59.999999Z", timezone: Europe/Berlin, source: STATED_ON_NOTICE, verified: true }
                    current: { kind: EXTENSION, dueDate: "2026-11-30", dueAt: "2026-11-30T22:59:59.999999Z", timezone: Europe/Berlin, source: AUTHORITY_CONFIRMATION, verified: true }
                    overdue: false
                    entries:
                      - { seq: 1, kind: ORIGINAL, dueDate: "2026-10-31", dueAt: "2026-10-31T22:59:59.999999Z", timezone: Europe/Berlin, source: STATED_ON_NOTICE, verified: true, evidence: Stated on page 1 of the notice., recordedAt: "2026-10-01T09:00:00.000000Z", recordedBy: 01920a4c-0000-7000-8000-0000000000a1 }
                      - { seq: 6, kind: EXTENSION, dueDate: "2026-11-30", dueAt: "2026-11-30T22:59:59.999999Z", timezone: Europe/Berlin, source: AUTHORITY_CONFIRMATION, verified: true, evidence: Extension letter of 20 October., authorityReference: EXT-2026-77, recordedAt: "2026-10-21T10:00:00.000000Z", recordedBy: 01920a4c-0000-7000-8000-0000000000a1 }
