      responses:
        "200":
          description: The reconciliations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GLReconciliationList"
              examples:
                default:
                  summary: Example
                  value:
                    reconciliations:
                      - id: 01920c20-1a2b-7c3d-8e4f-5a6b7c8d9e40
                        bridgeId: 01920c20-0000-7000-8000-0000000000b1
                        snapshotId: 01920c20-1a2b-7c3d-8e4f-5a6b7c8d9e30
