  /v1/reconciliations:
    get:
      operationId: listReconciliations
      tags: [reconciliation]
      summary: The tenant's reconciliation runs, latest first
      description: |
        `OPERATOR`, `ANALYST` or `AUDITOR`. Each run without its items — a
        period may compare thousands; `GET /v1/reconciliations/{runId}`
        returns them. `exceptionCount` is the items not `MATCHED` or
        `TOLERANCE_MATCH`, and `resolvedCount` those with a recorded
        resolution, so a run with open breaks is visible without opening it.
        The page is capped at 100 whatever `limit` asks for.
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationRunList"
              examples:
                default:
                  summary: September, one break open
                  value:
                    runs:
                      - id: 01920ab0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                        period: "2026-09"
                        legalEntityId: 01920a4c-0000-7000-8000-00000000e001
                        ranAt: "2026-10-03T09:00:00.000000Z"
                        firstBreak: R1_CALCULATED_TO_DOCUMENT
                        unavailable: [R2_DOCUMENT_TO_COLLECTION, R4_SUBLEDGER_TO_RETURN, R5_RETURN_TO_REMITTANCE, R6_SUBLEDGER_TO_GL]
                        itemCount: 3
                        exceptionCount: 1
                        resolvedCount: 0
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: runReconciliation
      tags: [reconciliation]
      summary: Reconcile a legal period stage by stage
      description: |
        `OPERATOR`. Compares the period (ZTAX-FIN-001 §17–§20) and records
        every item, matched or not, with its exact variance:

        - **R1**, calculated to document: each current decision whose event
          fell in the period, its decided tax against the tax every document
          presents for it, voids and credits included. `MISSING` is a
          decision no document presents.
        - **R3**, decision to subledger: the decided tax against what the
          decision's posting put on `TAX_COLLECTED_LIABILITY`, and each
          completed refund against its `REFUND` journal.

        R2, R4, R5 and R6 compare records this cell does not hold yet and are
        listed in `unavailable` — never silently left out
        (ZTAX-FIN-REQ-0077). `firstBreak` is R7: the first stage, in order,
        with an exception, so a clean later stage cannot hide an earlier
        break. No tolerance applies; none is configured and none is assumed
        (ZTAX-FIN-REQ-0080).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconciliationRequest"
            examples:
              default:
                summary: September
                value:
                  period: "2026-09"
      responses:
        "201":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationRun"
              examples:
                default:
                  summary: One decision never documented
                  value:
                    id: 01920ab0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                    period: "2026-09"
                    legalEntityId: 01920a4c-0000-7000-8000-00000000e001
                    ranAt: "2026-10-03T09:00:00.000000Z"
                    firstBreak: R1_CALCULATED_TO_DOCUMENT
                    unavailable: [R2_DOCUMENT_TO_COLLECTION, R4_SUBLEDGER_TO_RETURN, R5_RETURN_TO_REMITTANCE, R6_SUBLEDGER_TO_GL]
                    items:
                      - id: 01920ab0-2b3c-7d4e-8f50-6a7b8c9d0e1f
                        stage: R1_CALCULATED_TO_DOCUMENT
                        matchKey: "decision:01920a4b-7c3e-7d21-9f40-3c1a2b4d5e6f"
                        expected: { amount: "21.11", currency: EUR }
                        status: MISSING
                        detail: expected and not observed
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

