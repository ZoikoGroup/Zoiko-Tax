                ztx_retryable: false

    Forbidden:
      description: The subject is known and does not hold a role permitting this action.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            forbidden:
              summary: An analyst calling an administrative endpoint
              value:
                type: https://errors.zoikotax.com/v1/forbidden
                title: Forbidden
                status: 403
                detail: The authenticated subject does not hold a role permitting this action.
