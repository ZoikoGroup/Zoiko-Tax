        `OPERATOR` or `ANALYST`. Sends the item to the Governed Model Gateway
        under the `classification-review` use case (ADR-0006) and returns
        what it proposes. The proposal is **advisory and never
        authoritative** (ZTAX-CLS-REQ-0082): it names an existing ontology
        node for a person to confirm, and nothing in this response can become
        a classification decision without that confirmation
        (ADR-0006 §2.6).

        When the AI plane cannot help, the item still goes to a person: a
        Gateway with no approved provider, a Gateway that is down or slow, a
        reply without its provenance, or a proposed code that is not an
        `ontology:` node all answer `200` with `disposition: REVIEW_REQUIRED`
        and the reason in `reviewReason`, and no proposal. Deterministic
        processing is unaffected by any of them. A cell with no classification
        service wired at all answers `503`. A governance refusal — kill switch,
        residency, authority — is a `403` with the Gateway's reason code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassificationProposalRequest"
            examples:
              sku:
                summary: A catalog item to map
                value:
                  subjectRef: sku:PLAN-UNL-5G
                  description: Unlimited 5G mobile plan with 20 GB hotspot
      responses:
        "200":
          description: The advisory proposal with the provenance that produced it, or `REVIEW_REQUIRED` when the AI plane could not help.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationProposal"
              examples:
                default:
                  summary: A proposal for review
                  value:
                    id: 01920a4d-5a6b-7c8d-9e0f-1a2b3c4d5e6f
                    subjectRef: sku:PLAN-UNL-5G
                    disposition: PROPOSED
                    proposedCode: ontology:telecom/voice/mobile
                    confidence: "0.97"
                    authoritative: false
                    provenance:
                      useCase: classification-review
                      modelProfile: model:cls-2027.03
                      providerProfile: provider:approved-a
                      promptProfile: prompt:classification-review-v1
                      aiTrainVersion: ai-2027.03.1
                aiUnavailable:
                  summary: The AI plane could not help; a person classifies the item
                  value:
                    subjectRef: sku:PLAN-UNL-5G
                    disposition: REVIEW_REQUIRED
                    reviewReason: AI_GATEWAY_UNAVAILABLE
                    authoritative: false
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/classifications/decisions:
    post:
      operationId: recordClassificationDecision
      tags: [classification]
      summary: Record what a reviewer decided about an AI classification proposal
      description: |
        `OPERATOR` or `ANALYST`, signed in as themselves. Saves the reviewer's
        decision on one proposal: `ACCEPT`, `REJECT`, `MODIFY` or `ESCALATE`,
        with a reason. The proposal itself is advisory and is not stored, so the
        body carries what the record needs of it: the proposal id, the subject
        reference, the proposed code and, when the proposal had one, its
        `evidenceId`. The proposal id, subject reference, proposed code and evidence id are stated by the caller; the service does not store or verify the proposal they refer to.

        The reviewer and the tenant are taken from the session, never from the
        body; a body that names either is refused. The decision is append-only:
        one per proposal per tenant, and a second decision for the same proposal
        is `409 ALREADY_EXISTS` with nothing changed. `MODIFY` needs a
        `modifiedCode` in ontology format, and no other action may carry one.
        `reason` and `note` are free text: they are never logged and never
        appear in an error. How long a decision is kept is set by the evidence
        retention decision, which is not yet made.

        A cell with no decision service wired answers `503`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassificationDecisionRequest"
            examples:
              modify:
                summary: A reviewer changes the proposed code
                value:
                  proposalId: 01920a4d-5a6b-7c8d-9e0f-1a2b3c4d5e6f
                  subjectRef: sku:PLAN-UNL-5G
                  proposedCode: ontology:telecom/voice/mobile
                  action: MODIFY
                  reason: The plan is data only
                  modifiedCode: ontology:telecom/data/mobile
                  evidenceId: call-id-1
      responses:
        "201":
          description: The saved decision, with the reviewer and tenant from the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationDecision"
              examples:
                default:
                  summary: Example
                  value:
                    proposalId: 01920a4d-5a6b-7c8d-9e0f-1a2b3c4d5e6f
                    subjectRef: sku:PLAN-UNL-5G
                    proposedCode: ontology:telecom/voice/mobile
                    action: MODIFY
                    reason: The plan is data only
                    modifiedCode: ontology:telecom/data/mobile
                    evidenceId: call-id-1
                    tenantId: 01920a4c-0000-7000-8000-0000000000a0
                    reviewerUserId: 01920a4c-0000-7000-8000-0000000000a1
                    decidedAt: "2026-10-01T09:00:00.000000Z"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

