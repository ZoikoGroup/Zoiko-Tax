        email:
          x-ztax-privacy: { class: P1, purposes: [PURP-SUPPORT], retention: RET-TRANSIENT, redaction: REDACT, aiAllowed: NONE }
          type: string
          format: email
          example: grace@example.com
        company:
          x-ztax-privacy: { class: P1, purposes: [PURP-SUPPORT], retention: RET-TRANSIENT, redaction: REDACT, aiAllowed: NONE }
          type: string
          maxLength: 200
          example: Example Telecom
        message:
          x-ztax-privacy: { class: P1, purposes: [PURP-SUPPORT], retention: RET-TRANSIENT, redaction: REDACT, aiAllowed: NONE }
