      properties:
        tenant:
          x-ztax-privacy: { class: P0 }
          type: string
          description: The tenant slug to sign in to.
          example: acme
        email:
          x-ztax-privacy: { class: P1, purposes: [PURP-SEC, PURP-SUPPORT], retention: RET-TRANSIENT, redaction: REDACT, aiAllowed: NONE }
          type: string
          format: email
          example: analyst@acme.example

    ContactRequest:
      type: object
      title: ContactRequest
      additionalProperties: false
      required: [name, email, message]
      properties:
        name:
