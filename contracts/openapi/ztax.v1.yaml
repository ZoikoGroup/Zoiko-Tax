        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/notices:
    get:
      operationId: listNotices
      tags: [notices]
      summary: The regulatory notice register
      description: |
        `ADMIN`, `OPERATOR`, `ANALYST` or `AUDITOR`. Every notice, assessment,
        audit, appeal and information request registered, in working order:
        unknown statutory deadlines first, then the soonest deadline in force;
        closed notices only when asked for. Each carries the flags that need
        attention now — an unknown or unverified deadline, unresolved
        authenticity or recipient (an urgent legal review: W17, SUP-05,
        SUP-08), a deadline soon or passed, a breached internal SLA.
      parameters:
        - { name: type, in: query, required: false, description: Only notices of this type., schema: { $ref: "#/components/schemas/NoticeType" }, example: ASSESSMENT }
        - { name: status, in: query, required: false, description: Only notices in this status., schema: { $ref: "#/components/schemas/NoticeStatus" }, example: LEGAL_REVIEW }
        - { name: authority, in: query, required: false, description: Only notices from this authority (case-insensitive)., schema: { $ref: "#/components/schemas/AuthorityCode" }, example: DE-BZST }
        - { name: legalEntityId, in: query, required: false, description: Only notices addressed to this legal entity, as resolved., schema: { $ref: "#/components/schemas/LegalEntityId" }, example: 01920a4c-0000-7000-8000-00000000e001 }
        - { name: authorityReference, in: query, required: false, description: Only notices whose authority reference contains this text., schema: { $ref: "#/components/schemas/AuthorityReference" }, example: ST-2026 }
        - { name: receivedFrom, in: query, required: false, description: Only notices received at or after this instant., schema: { $ref: "#/components/schemas/Timestamp" }, example: "2026-10-01T00:00:00.000000Z" }
        - { name: receivedTo, in: query, required: false, description: Only notices received at or before this instant., schema: { $ref: "#/components/schemas/Timestamp" }, example: "2026-10-31T23:59:59.999999Z" }
        - { name: period, in: query, required: false, description: Only notices whose period contains this date., schema: { $ref: "#/components/schemas/CivilDate" }, example: "2026-08-15" }
        - { name: amountMin, in: query, required: false, description: Only notices stating at least this amount, in `currency`. Compared exactly on the server., schema: { $ref: "#/components/schemas/Decimal" }, example: "1000.00" }
        - { name: amountMax, in: query, required: false, description: Only notices stating at most this amount, in `currency`., schema: { $ref: "#/components/schemas/Decimal" }, example: "50000.00" }
        - { name: currency, in: query, required: false, description: The currency `amountMin` and `amountMax` are in. Required with either., schema: { $ref: "#/components/schemas/CurrencyCode" }, example: EUR }
        - { name: attachmentSha256, in: query, required: false, description: Only notices with a document of this SHA-256 recorded., schema: { $ref: "#/components/schemas/Sha256Hex" }, example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08 }
        - { name: authenticity, in: query, required: false, description: Only notices whose authenticity is this., schema: { $ref: "#/components/schemas/NoticeAuthenticity" }, example: UNKNOWN }
        - { name: urgent, in: query, required: false, description: Only notices flagged for urgent legal review., schema: { $ref: "#/components/schemas/NoticeQueryFlag" }, example: true }
        - { name: includeClosed, in: query, required: false, description: Include closed notices when no status is asked for., schema: { $ref: "#/components/schemas/NoticeQueryFlag" }, example: false }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The notices, in working order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticeList"
              examples:
                default:
                  summary: One assessment in legal review
                  value:
                    notices:
                      - id: 01920c10-1a2b-7c3d-8e4f-5a6b7c8d9e01
                        type: ASSESSMENT
                        authority: DE-BZST
                        jurisdiction: DE
                        legalEntityId: 01920a4c-0000-7000-8000-00000000e001
                        entityAmbiguous: false
                        entityResolved: true
                        authorityReference: ST-2026-0042
                        receivedAt: "2026-10-01T09:00:00.000000Z"
                        periodStart: "2026-07-01"
                        periodEnd: "2026-09-30"
                        amount: { amount: "1250.00", currency: EUR }
                        links: [{ kind: RETURN, reference: 01920a4d-1b2c-7d3e-8f40-5a6b7c8d9e01 }]
                        status: LEGAL_REVIEW
                        authenticity: VERIFIED
                        escalated: false
                        flags: [DEADLINE_SOON]
                        urgentLegalReview: false
                        statutoryDeadline:
                          original: { kind: ORIGINAL, dueDate: "2026-10-31", dueAt: "2026-10-31T22:59:59.999999Z", timezone: Europe/Berlin, source: STATED_ON_NOTICE, verified: true }
                          current: { kind: ORIGINAL, dueDate: "2026-10-31", dueAt: "2026-10-31T22:59:59.999999Z", timezone: Europe/Berlin, source: STATED_ON_NOTICE, verified: true }
                        sla: { ownerId: 01920a4c-0000-7000-8000-0000000000a2, dueAt: "2026-10-24T17:00:00.000000Z", breached: false }
                        deadlines:
                          - { seq: 1, kind: ORIGINAL, dueDate: "2026-10-31", dueAt: "2026-10-31T22:59:59.999999Z", timezone: Europe/Berlin, source: STATED_ON_NOTICE, verified: true, evidence: Stated on page 1 of the notice., recordedAt: "2026-10-01T09:00:00.000000Z", recordedBy: 01920a4c-0000-7000-8000-0000000000a1 }
                        attachments: []
                        allowedActions: [PREPARE_RESPONSE, RECORD_AUTHENTICITY, RESOLVE_ENTITY, RECORD_DEADLINE, ESCALATE, ASSIGN_OWNER, RECORD_ATTACHMENT, CLOSE]
                        asOf: "2026-10-27T09:00:00.000000Z"
                        createdAt: "2026-10-01T09:00:00.000000Z"
                        createdBy: 01920a4c-0000-7000-8000-0000000000a1
                        history:
                          - { seq: 1, kind: RECEIVED, status: RECEIVED, recordedAt: "2026-10-01T09:00:00.000000Z", recordedBy: 01920a4c-0000-7000-8000-0000000000a1 }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: createNotice
      tags: [notices]
      summary: Register a notice as received
      description: |
        `OPERATOR` or `ANALYST`, signed in as themselves.

        Registers a notice, assessment, audit, appeal or information request
        with its authority, recipient, the authority's reference and the
        statutory deadline as received — its date in the authority's calendar,
        timezone, source and whether anyone verified it. Not a support due
        date. An unknown or unverified deadline is flagged for urgent legal
        review (W17). A notice with no legal entity, or one marked ambiguous,
        goes straight to `LEGAL_REVIEW` and nothing answers it automatically
        (SUP-08). Links are references only; registering a notice changes no
        return, ledger or rule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoticeRequest"
            examples:
              default:
                summary: An assessment with a stated deadline, recipient to be resolved
                value:
                  type: ASSESSMENT
                  authority: DE-BZST
                  jurisdiction: DE
                  authorityReference: ST-2026-0042
                  receivedAt: "2026-10-01T09:00:00.000000Z"
                  periodStart: "2026-07-01"
                  periodEnd: "2026-09-30"
