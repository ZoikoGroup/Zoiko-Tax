                  matter: "Claim 2026/114"
                  reason: litigation notice received
                  scope: { businessKeys: ["INV-0001/1"] }
      responses:
        "201":
          description: The hold.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalHold"
              examples:
                default:
                  summary: Placed
                  value:
                    id: 01920ac0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                    matter: "Claim 2026/114"
                    status: ACTIVE
                    scope: { businessKeys: ["INV-0001/1"] }
                    history:
