  /v1/documents/{documentId}/corrections:
    post:
      operationId: correctDocument
      tags: [documents]
      summary: Void, credit or rebill a committed document
      description: |
        `OPERATOR` only. Commits a correcting document as a successor of this
        one, sharing its root (ZTAX-FIN-REQ-0003, -0004). The original is
        never edited; it gains a status naming the correction.

        - `VOID` cancels every line, exactly: nets and taxes negated, nothing
          recomputed. The original becomes `VOIDED`. Refused once any line
          has been credited — credit the rest instead.
        - `CREDIT_NOTE` cancels the lines in `cancelLines`, or every line not
          already cancelled. The original becomes `PARTIALLY_CREDITED` or
          `FULLY_CREDITED`. A line is cancelled once.
        - `REBILL` charges again, with `lines` like an invoice's — each naming
          the original line it replaces — once the original is voided or
          fully credited.

        `reason` is a registered `CORRECTION_*` code (ZTAX-FIN-REQ-0008).
        `PARTIAL_CREDIT`, `AMENDMENT` and `RESTATEMENT` are refused as
        `UNSUPPORTED`. `Idempotency-Key` is required.
      parameters:
        - $ref: "#/components/parameters/DocumentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CorrectionRequest"
            examples:
              default:
                summary: Void an invoice the customer cancelled
                value:
                  type: VOID
                  reason: CORRECTION_CUSTOMER_CANCELLATION
                  number: VOID-2026-0001
                  issueDate: "2026-09-26"
                  taxPoint: "2026-09-24T18:00:00.000000Z"
      responses:
        "201":
          description: The correcting document.
          headers:
            Idempotent-Replay:
              description: Present, and `true`, when this is the stored response to an earlier request with the same key.
              schema: { type: boolean }
              example: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiscalDocument"
              examples:
                default:
                  summary: A void
                  value:
                    id: 01920a91-3c4d-7e5f-8061-7b8c9d0e1f2a
                    type: VOID
                    number: VOID-2026-0001
                    rootId: 01920a90-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                    predecessors: [01920a90-1a2b-7c3d-8e4f-5a6b7c8d9e0f]
                    reasonCode: CORRECTION_CUSTOMER_CANCELLATION
                    legalEntityId: 01920a4c-0000-7000-8000-00000000e001
                    issueDate: "2026-09-26"
                    taxPoint: "2026-09-24T18:00:00.000000Z"
                    currency: EUR
                    decisionIds: [01920a4b-7c3e-7d21-9f40-3c1a2b4d5e6f]
                    lines:
                      - id: 01920a91-4d5e-7f60-8172-8c9d0e1f2a3b
                        net: "-100.00"
                        predecessorLineId: 01920a90-2b3c-7d4e-8f50-6a7b8c9d0e1f
                        taxes:
                          - { decisionId: 01920a4b-7c3e-7d21-9f40-3c1a2b4d5e6f, component: TAX_VAT, amount: "-21.00" }
                    netTotal: "-100.00"
                    taxTotal: "-21.00"
                    grossTotal: "-121.00"
                    status: COMMITTED
                    history:
                      - { seq: 1, status: COMMITTED, recordedAt: "2026-09-26T09:00:00.000000Z" }
                    recordedAt: "2026-09-26T09:00:00.000000Z"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

