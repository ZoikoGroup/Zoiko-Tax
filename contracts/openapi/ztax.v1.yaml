    GLReconciliationItem:
      type: object
      title: GLReconciliationItem
      description: |
        One compared GL account (an R6 item). Amounts are net debit — debits
        less credits. `variance` is observed minus expected, exact, whatever the
        status; absent when one side is.
      additionalProperties: false
      required: [matchKey, tcslAccounts, status]
      properties:
        matchKey:
          x-ztax-privacy: { class: P0 }
          type: string
          description: "`gl:<account>`, or `tcsl:<account>` for a TCSL account with no mapping."
        glAccount: { $ref: "#/components/schemas/GLAccountCode" }
        tcslAccounts:
          type: array
          items: { $ref: "#/components/schemas/ControlAccount" }
        expected: { $ref: "#/components/schemas/MoneyValue" }
        observed: { $ref: "#/components/schemas/MoneyValue" }
        variance: { $ref: "#/components/schemas/MoneyValue" }
        status:
          x-ztax-privacy: { class: P0 }
          type: string
          enum: [MATCHED, TOLERANCE_MATCH, UNMATCHED, PARTIAL, DUPLICATE, MISSING, CONFLICTED, PENDING, EXPLAINED, RESOLVED]
        detail:
          x-ztax-privacy: { class: P0 }
          type: string

    GLReconciliation:
      type: object
      title: GLReconciliation
      description: One subledger-to-GL reconciliation of a period and currency, against one snapshot, under one mapping version. A record; a re-run is a new one.
      additionalProperties: false
      required: [id, bridgeId, snapshotId, snapshotDigest, legalEntityId, period, currency, mappingVersion, outcome, holds, journalCount, postedJournalCount, populationDigest, exceptionCount, items, ranAt]
      properties:
        id: { $ref: "#/components/schemas/GLReconciliationId" }
        bridgeId: { $ref: "#/components/schemas/ERPBridgeId" }
        snapshotId: { $ref: "#/components/schemas/GLSnapshotId" }
        snapshotDigest: { $ref: "#/components/schemas/Digest" }
        legalEntityId: { $ref: "#/components/schemas/LegalEntityId" }
        period: { $ref: "#/components/schemas/LegalPeriod" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        mappingVersion:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
        outcome: { $ref: "#/components/schemas/GLReconOutcome" }
        holds:
          type: array
          items: { $ref: "#/components/schemas/GLHold" }
        journalCount:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 0
        postedJournalCount:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 0
        populationDigest: { $ref: "#/components/schemas/Digest" }
        exceptionCount:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 0
        items:
          type: array
          items: { $ref: "#/components/schemas/GLReconciliationItem" }
        ranAt: { $ref: "#/components/schemas/Timestamp" }
        ranBy:
          x-ztax-privacy: { class: P1, purposes: [PURP-SEC, PURP-EVID], retention: RET-EVIDENCE, redaction: NONE }
          type: string
          format: uuid

    GLReconciliationList:
      type: object
      title: GLReconciliationList
      additionalProperties: false
      required: [reconciliations]
      properties:
        reconciliations:
          type: array
          items: { $ref: "#/components/schemas/GLReconciliation" }

    ProviderContribution:
      type: object
      title: ProviderContribution
      description: |
        One ContributionEvent: the contribution base a source event carries, with
        its eligibility and its immutable hash. The provider's own obligation on
        its eligible revenue — never the recovery charged to customers.
      additionalProperties: false
      required: [id, sourceEventId, sourceVersion, sourceType, regime, period, legalEntityId, classificationRef, situsRef, sourceRef, ruleVersion, currency, eligibleBase, excludedBase, amendment, immutableHash, status, recordedAt, recordedBy, history]
      properties:
        id: { $ref: "#/components/schemas/ContributionId" }
        sourceEventId: { $ref: "#/components/schemas/ContributionRef" }
        sourceVersion:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
        sourceType: { $ref: "#/components/schemas/ContributionSourceType" }
        sourceChecksum:
          x-ztax-privacy: { class: P0 }
          type: string
          description: The checksum of the import file the event came in.
        regime: { $ref: "#/components/schemas/ContributionRegime" }
        period: { $ref: "#/components/schemas/LegalPeriod" }
        legalEntityId: { $ref: "#/components/schemas/LegalEntityId" }
        obligationId: { $ref: "#/components/schemas/ObligationId" }
        classificationRef: { $ref: "#/components/schemas/ContributionRef" }
        situsRef: { $ref: "#/components/schemas/ContributionRef" }
        sourceRef: { $ref: "#/components/schemas/ContributionRef" }
        componentRef: { $ref: "#/components/schemas/ContributionRef" }
        ruleVersion: { $ref: "#/components/schemas/ContributionRef" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        eligibleBase: { $ref: "#/components/schemas/ContributionAmount" }
        excludedBase: { $ref: "#/components/schemas/ContributionAmount" }
        exclusionReason:
          x-ztax-privacy: { class: P0 }
          type: string
          description: Why revenue is excluded from the base, by rule. Present whenever excludedBase is not zero.
        quantity: { $ref: "#/components/schemas/ContributionAmount" }
        quantityUnit:
          x-ztax-privacy: { class: P0 }
          type: string
        reverses: { $ref: "#/components/schemas/ContributionSourceKey" }
        amendment:
          x-ztax-privacy: { class: P0 }
          type: boolean
          description: Recorded after its period had ended — a late event, counted in its own period.
        immutableHash: { $ref: "#/components/schemas/Digest" }
        status: { $ref: "#/components/schemas/ContributionStatus" }
        recordedAt: { $ref: "#/components/schemas/Timestamp" }
        recordedBy:
          x-ztax-privacy: { class: P1, purposes: [PURP-SEC, PURP-EVID], retention: RET-EVIDENCE, redaction: NONE }
          type: string
          format: uuid
        history:
          type: array
          items: { $ref: "#/components/schemas/ContributionStatusEvent" }

    ProviderContributionList:
      type: object
      title: ProviderContributionList
      additionalProperties: false
      required: [contributions]
      properties:
        contributions:
          type: array
          items: { $ref: "#/components/schemas/ProviderContribution" }

    ContributionRequest:
      type: object
      title: ContributionRequest
      additionalProperties: false
      required: [sourceEventId, sourceVersion, sourceType, regime, period, classificationRef, situsRef, sourceRef, ruleVersion, currency, eligibleBase]
      properties:
        sourceEventId: { $ref: "#/components/schemas/ContributionRef" }
        sourceVersion:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
        sourceType: { $ref: "#/components/schemas/ContributionSourceType" }
        sourceChecksum:
          x-ztax-privacy: { class: P0 }
          type: string
          maxLength: 200
          description: The checksum of the import file the event came in, when it came in one.
        regime: { $ref: "#/components/schemas/ContributionRegime" }
        period: { $ref: "#/components/schemas/LegalPeriod" }
        legalEntityId: { $ref: "#/components/schemas/LegalEntityId" }
        obligationId: { $ref: "#/components/schemas/ObligationId" }
        classificationRef: { $ref: "#/components/schemas/ContributionRef" }
        situsRef: { $ref: "#/components/schemas/ContributionRef" }
        sourceRef: { $ref: "#/components/schemas/ContributionRef" }
        componentRef: { $ref: "#/components/schemas/ContributionRef" }
        ruleVersion: { $ref: "#/components/schemas/ContributionRef" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        eligibleBase: { $ref: "#/components/schemas/ContributionAmount" }
        excludedBase: { $ref: "#/components/schemas/ContributionAmount" }
        exclusionReason:
          x-ztax-privacy: { class: P0 }
          type: string
          maxLength: 2000
          description: Why revenue is excluded from the base. Required when excludedBase is not zero.
        quantity: { $ref: "#/components/schemas/ContributionAmount" }
        quantityUnit:
          x-ztax-privacy: { class: P0 }
          type: string
          maxLength: 32
        reverses: { $ref: "#/components/schemas/ContributionSourceKey" }

    ContributionTransitionRequest:
      type: object
      title: ContributionTransitionRequest
      additionalProperties: false
      required: [reason]
      properties:
        reason: { $ref: "#/components/schemas/ContributionReason" }

    ContributionTrace:
      type: object
      title: ContributionTrace
      additionalProperties: false
      required: [contribution, originalMissing]
      properties:
        contribution: { $ref: "#/components/schemas/ProviderContribution" }
        original: { $ref: "#/components/schemas/ProviderContribution" }
        reversal: { $ref: "#/components/schemas/ProviderContribution" }
        originalMissing:
          x-ztax-privacy: { class: P0 }
          type: boolean
          description: The contribution is a reversal and the ledger does not hold its original.

    ContributionPeriodTotals:
      type: object
      title: ContributionPeriodTotals
      description: One member entity's control totals for one regime and currency. Currencies are never added together.
      additionalProperties: false
      required: [legalEntityId, regime, currency, status, incompleteReasons, acceptedCount, quarantinedCount, reversalCount, amendmentCount, eligibleTotal, excludedTotal, reversedTotal, periodDigest, sourceChecksums]
      properties:
        legalEntityId: { $ref: "#/components/schemas/LegalEntityId" }
        regime: { $ref: "#/components/schemas/ContributionRegime" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        status:
          x-ztax-privacy: { class: P0 }
          type: string
          enum: [COMPLETE, DATA_INCOMPLETE]
        incompleteReasons:
          type: array
          items: { $ref: "#/components/schemas/ContributionIncompleteReason" }
        acceptedCount:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 0
        quarantinedCount:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 0
        reversalCount:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 0
        amendmentCount:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 0
        eligibleTotal: { $ref: "#/components/schemas/ContributionAmount" }
        excludedTotal: { $ref: "#/components/schemas/ContributionAmount" }
        reversedTotal: { $ref: "#/components/schemas/ContributionAmount" }
        periodDigest: { $ref: "#/components/schemas/Digest" }
        sourceChecksums:
          x-ztax-privacy: { class: P0 }
          type: array
          items:
            type: string

    ContributionSummary:
      type: object
      title: ContributionSummary
      additionalProperties: false
      required: [period, dataIncomplete, groups]
      properties:
        period: { $ref: "#/components/schemas/LegalPeriod" }
        dataIncomplete:
          x-ztax-privacy: { class: P0 }
          type: boolean
          description: Some group is DATA_INCOMPLETE.
        groups:
          type: array
          items: { $ref: "#/components/schemas/ContributionPeriodTotals" }

    NoticeId:
      x-ztax-privacy: { class: P0 }
      type: string
      title: NoticeId
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      example: 01920c10-1a2b-7c3d-8e4f-5a6b7c8d9e01

    NoticeType:
      x-ztax-privacy: { class: P0 }
      type: string
      title: NoticeType
      description: What the authority sent.
      enum: [NOTICE, ASSESSMENT, AUDIT, APPEAL, INFORMATION_REQUEST]

    NoticeStatus:
      x-ztax-privacy: { class: P0 }
      type: string
      title: NoticeStatus
      description: |
        Where the matter stands. RECEIVED → AUTHENTICITY_REVIEW → LEGAL_REVIEW →
        RESPONSE_APPROVED → SUBMITTED → OUTCOME_RECORDED, with APPEAL as the
        branch after an outcome. CLOSED is terminal; nothing reopens it.
      enum: [RECEIVED, AUTHENTICITY_REVIEW, LEGAL_REVIEW, RESPONSE_APPROVED, SUBMITTED, OUTCOME_RECORDED, APPEAL, CLOSED]

    NoticeAuthenticity:
      x-ztax-privacy: { class: P0 }
      type: string
      title: NoticeAuthenticity
      description: What has been established about whether the authority sent the notice. Only VERIFIED admits an approved answer (SUP-05).
      enum: [UNKNOWN, VERIFIED, UNVERIFIABLE, NOT_AUTHENTIC]

    NoticeDeadlineSource:
      x-ztax-privacy: { class: P0 }
      type: string
      title: NoticeDeadlineSource
      description: Where a statutory deadline came from. ESTIMATED and UNKNOWN are never verified.
      enum: [STATED_ON_NOTICE, STATUTE, AUTHORITY_CONFIRMATION, AUTHORITY_PORTAL, ESTIMATED, UNKNOWN]

    NoticeDeadlineKind:
      x-ztax-privacy: { class: P0 }
      type: string
      title: NoticeDeadlineKind
      description: |
        What a deadline ledger entry records. ORIGINAL is the intake's and is
        never rewritten; CONFIRMATION verifies or establishes the date without
        moving it; EXTENSION moves it later on the authority's evidence;
        APPEAL is the next deadline an appeal opens.
      enum: [ORIGINAL, CONFIRMATION, EXTENSION, APPEAL]

    NoticeOutcome:
      x-ztax-privacy: { class: P0 }
      type: string
      title: NoticeOutcome
      description: What the authority decided.
      enum: [ACCEPTED, ADJUSTED, REJECTED, WITHDRAWN]

    NoticeSettlement:
      x-ztax-privacy: { class: P0 }
      type: string
      title: NoticeSettlement
      description: The evidence a claim of settlement rests on. A pending payment instruction is never settlement (T18-20).
      enum: [AUTHORITY_CONFIRMED, PAYMENT_SETTLED, PAYMENT_INSTRUCTION_PENDING]

    NoticeEscalationReason:
      x-ztax-privacy: { class: P0 }
      type: string
      title: NoticeEscalationReason
      description: Why a notice went to legal.
      enum: [DEADLINE_UNVERIFIED, AUTHENTICITY_UNRESOLVED, ENTITY_UNRESOLVED, LEGAL_JUDGEMENT]

    NoticeLinkKind:
      x-ztax-privacy: { class: P0 }
      type: string
      title: NoticeLinkKind
      description: The kind of record a link references. Every link is a read-only reference.
      enum: [RETURN, SUBMISSION_RECEIPT, PAYMENT, LEDGER_ENTRY, RULE_VERSION, CORRESPONDENCE, OBLIGATION, DECISION]

    NoticeEventKind:
      x-ztax-privacy: { class: P0 }
      type: string
      title: NoticeEventKind
      description: What an event records.
      enum: [RECEIVED, TRANSITIONED, AUTHENTICITY_RECORDED, LEGAL_ESCALATED, ENTITY_RESOLVED, OWNER_ASSIGNED, ATTACHMENT_RECORDED, DEADLINE_RECORDED, RESPONSE_PREPARED, RESPONSE_APPROVED, SUBMITTED, OUTCOME_RECORDED, APPEAL_LODGED, CLOSED]

    NoticeFlag:
      x-ztax-privacy: { class: P0 }
      type: string
      title: NoticeFlag
      description: |
        Something about a notice that needs attention now. URGENT_LEGAL_REVIEW
        accompanies an unknown or unverified deadline (W17), unresolved or
        disputed authenticity (SUP-05) and an unresolved recipient (SUP-08).
        STATUTORY_OVERDUE and SLA_BREACHED are separate facts.
      enum: [DEADLINE_UNKNOWN, DEADLINE_UNVERIFIED, AUTHENTICITY_UNVERIFIED, AUTHENTICITY_DISPUTED, ENTITY_UNRESOLVED, DEADLINE_SOON, STATUTORY_OVERDUE, SLA_BREACHED, LEGAL_ESCALATED, URGENT_LEGAL_REVIEW, HEARING_SCHEDULED]

    NoticeAction:
      x-ztax-privacy: { class: P0 }
      type: string
      title: NoticeAction
      description: An action the notice's status admits. Each still applies its own guards when taken.
      enum: [START_AUTHENTICITY_REVIEW, MOVE_TO_LEGAL_REVIEW, RECORD_AUTHENTICITY, ESCALATE, RESOLVE_ENTITY, ASSIGN_OWNER, RECORD_ATTACHMENT, RECORD_DEADLINE, PREPARE_RESPONSE, APPROVE_RESPONSE, RECORD_SUBMISSION, RECORD_OUTCOME, LODGE_APPEAL, CLOSE]

    NoticeJurisdiction:
      x-ztax-privacy: { class: P0 }
      type: string
      title: NoticeJurisdiction
      description: An ISO 3166-1 country or ISO 3166-2 subdivision code.
      pattern: "^[A-Z]{2}(-[A-Z0-9]{1,3})?$"
      example: DE

    NoticeText:
      x-ztax-privacy: { class: P2, purposes: [PURP-LEGAL, PURP-EVID], retention: RET-EVIDENCE, redaction: REDACT, aiAllowed: NONE }
      type: string
      title: NoticeText
      minLength: 1
      maxLength: 2000
      description: Free text from the person recording an act on a notice.

    NoticeEvidence:
      x-ztax-privacy: { class: P2, purposes: [PURP-LEGAL, PURP-EVID], retention: RET-EVIDENCE, redaction: REDACT, aiAllowed: NONE }
      type: string
      title: NoticeEvidence
      minLength: 1
      maxLength: 20000
      description: How a deadline, authenticity, recipient or outcome was established, or the authority's response as received.

    NoticeTimezone:
      x-ztax-privacy: { class: P0 }
      type: string
      title: NoticeTimezone
      minLength: 1
      maxLength: 64
      description: The authority's IANA timezone, in which a due date ends.
      example: Europe/Berlin

    Sha256Hex:
      x-ztax-privacy: { class: P0 }
      type: string
      title: Sha256Hex
      description: A document's SHA-256, lowercase hex. The document itself is not stored.
      pattern: "^[0-9a-f]{64}$"
      example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08

    NoticeFilename:
      x-ztax-privacy: { class: P2, purposes: [PURP-LEGAL, PURP-EVID], retention: RET-EVIDENCE, redaction: REDACT, aiAllowed: NONE }
      type: string
      title: NoticeFilename
      minLength: 1
      maxLength: 255
      description: A recorded document's file name, as given. It may name a person.

    NoticeMediaType:
      x-ztax-privacy: { class: P0 }
      type: string
      title: NoticeMediaType
      description: A recorded document's media type.
      pattern: "^[a-z0-9][a-z0-9!#$&^_.+-]{0,63}/[a-z0-9][a-z0-9!#$&^_.+-]{0,126}$"
      example: application/pdf

    NoticeQueryFlag:
      x-ztax-privacy: { class: P0 }
      type: boolean
      title: NoticeQueryFlag
      description: A yes-or-no filter.

    NoticeLink:
      type: object
      title: NoticeLink
      description: A reference to a record elsewhere, by its identifier. Read-only.
      additionalProperties: false
      required: [kind, reference]
      properties:
        kind: { $ref: "#/components/schemas/NoticeLinkKind" }
        reference:
          x-ztax-privacy: { class: P0 }
          type: string
          minLength: 1
          maxLength: 200

    NoticeDeadline:
      type: object
      title: NoticeDeadline
      description: |
        A statutory deadline: a civil date in the authority's calendar, the
        last instant of that day there, its source and whether it was
        verified. No `dueDate` is a deadline nobody knows yet.
      additionalProperties: false
      required: [kind, timezone, source, verified]
      properties:
        kind: { $ref: "#/components/schemas/NoticeDeadlineKind" }
        dueDate: { $ref: "#/components/schemas/CivilDate" }
        dueAt: { $ref: "#/components/schemas/Timestamp" }
        timezone: { $ref: "#/components/schemas/NoticeTimezone" }
        source: { $ref: "#/components/schemas/NoticeDeadlineSource" }
        verified:
          x-ztax-privacy: { class: P0 }
          type: boolean

    NoticeDeadlineInput:
      type: object
      title: NoticeDeadlineInput
      description: A deadline as stated. Without `dueDate` the source is UNKNOWN and it is unverified.
      additionalProperties: false
      required: [timezone, source, verified]
      properties:
        dueDate: { $ref: "#/components/schemas/CivilDate" }
        timezone: { $ref: "#/components/schemas/NoticeTimezone" }
        source: { $ref: "#/components/schemas/NoticeDeadlineSource" }
        verified:
          x-ztax-privacy: { class: P0 }
          type: boolean

    NoticeDeadlineEntry:
      type: object
      title: NoticeDeadlineEntry
      description: One row of the deadline ledger, with who recorded it and on what evidence.
      additionalProperties: false
      required: [seq, kind, timezone, source, verified, recordedAt, recordedBy]
      properties:
        seq:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
        kind: { $ref: "#/components/schemas/NoticeDeadlineKind" }
        dueDate: { $ref: "#/components/schemas/CivilDate" }
        dueAt: { $ref: "#/components/schemas/Timestamp" }
        timezone: { $ref: "#/components/schemas/NoticeTimezone" }
        source: { $ref: "#/components/schemas/NoticeDeadlineSource" }
        verified:
          x-ztax-privacy: { class: P0 }
          type: boolean
        evidence: { $ref: "#/components/schemas/NoticeEvidence" }
        authorityReference: { $ref: "#/components/schemas/AuthorityReference" }
        attachmentSha256: { $ref: "#/components/schemas/Sha256Hex" }
        recordedAt: { $ref: "#/components/schemas/Timestamp" }
        recordedBy:
          x-ztax-privacy: { class: P1, purposes: [PURP-SEC, PURP-EVID], retention: RET-EVIDENCE, redaction: NONE }
          type: string
          format: uuid

    NoticeDeadlineLedger:
      type: object
      title: NoticeDeadlineLedger
      additionalProperties: false
      required: [noticeId, original, current, overdue, entries]
      properties:
        noticeId: { $ref: "#/components/schemas/NoticeId" }
        original: { $ref: "#/components/schemas/NoticeDeadline" }
        current: { $ref: "#/components/schemas/NoticeDeadline" }
        overdue:
          x-ztax-privacy: { class: P0 }
          type: boolean
          description: The deadline in force has passed with the response not yet submitted.
        entries:
          type: array
          items: { $ref: "#/components/schemas/NoticeDeadlineEntry" }

    NoticeAttachment:
      type: object
      title: NoticeAttachment
      description: A document recorded as evidence, by digest. Nothing is uploaded.
      additionalProperties: false
      required: [sha256, filename, mediaType]
      properties:
        sha256: { $ref: "#/components/schemas/Sha256Hex" }
        filename: { $ref: "#/components/schemas/NoticeFilename" }
        mediaType: { $ref: "#/components/schemas/NoticeMediaType" }
        note: { $ref: "#/components/schemas/NoticeText" }
        recordedAt: { $ref: "#/components/schemas/Timestamp" }
        recordedBy:
          x-ztax-privacy: { class: P1, purposes: [PURP-SEC, PURP-EVID], retention: RET-EVIDENCE, redaction: NONE }
          type: string
          format: uuid

    NoticeEvent:
      type: object
      title: NoticeEvent
      additionalProperties: false
      required: [seq, kind, status, recordedAt, recordedBy]
      properties:
        seq:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
        kind: { $ref: "#/components/schemas/NoticeEventKind" }
        status: { $ref: "#/components/schemas/NoticeStatus" }
        note: { $ref: "#/components/schemas/NoticeText" }
        evidence: { $ref: "#/components/schemas/NoticeEvidence" }
        authorityReference: { $ref: "#/components/schemas/AuthorityReference" }
        deadline: { $ref: "#/components/schemas/NoticeDeadline" }
        authenticity: { $ref: "#/components/schemas/NoticeAuthenticity" }
        escalationReason: { $ref: "#/components/schemas/NoticeEscalationReason" }
        legalEntityId: { $ref: "#/components/schemas/LegalEntityId" }
        ownerId:
          x-ztax-privacy: { class: P1, purposes: [PURP-SEC, PURP-EVID], retention: RET-EVIDENCE, redaction: NONE }
          type: string
          format: uuid
        slaDue: { $ref: "#/components/schemas/Timestamp" }
        attachment: { $ref: "#/components/schemas/NoticeAttachment" }
        responseVersion:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
        responseSha256: { $ref: "#/components/schemas/Sha256Hex" }
        outcome: { $ref: "#/components/schemas/NoticeOutcome" }
        outcomeAmount: { $ref: "#/components/schemas/MoneyValue" }
        settled:
          x-ztax-privacy: { class: P0 }
          type: boolean
        settlement: { $ref: "#/components/schemas/NoticeSettlement" }
        hearingDate: { $ref: "#/components/schemas/CivilDate" }
        recordedAt: { $ref: "#/components/schemas/Timestamp" }
        recordedBy:
          x-ztax-privacy: { class: P1, purposes: [PURP-SEC, PURP-EVID], retention: RET-EVIDENCE, redaction: NONE }
          type: string
          format: uuid

    Notice:
      type: object
      title: Notice
      description: |
        A regulatory notice as of `asOf`: the header as received, its
        statutory deadline ledger beside the separate internal SLA clock, the
        recorded documents, its history, and what needs attention.
      additionalProperties: false
