      summary: The tenant's legal holds
      description: |
        `ADMIN` or `AUDITOR`, newest first, each with its full history. The
        search is recorded in the administrative audit trail as privileged
        evidence access (ZTAX-EVID-REQ-0115). A hold names what is kept; it
        returns no evidence and opens nothing to anyone
        (ZTAX-EVID-REQ-0024).
      responses:
        "200":
          description: The holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalHoldList"
              examples:
                default:
                  summary: One active hold
                  value:
                    holds:
                      - id: 01920ac0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                        matter: "Claim 2026/114"
                        status: ACTIVE
                        scope: { businessKeys: ["INV-0001/1"] }
                        history:
                          - { seq: 1, kind: PLACED, scope: { businessKeys: ["INV-0001/1"] }, reason: litigation notice received, recordedAt: "2026-10-01T09:00:00.000000Z", recordedBy: 01920a4c-0000-7000-8000-0000000000a1 }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: placeLegalHold
      tags: [retention]
      summary: Place a legal hold
      description: |
        `ADMIN`, signed in as themselves. A hold serves a named claim,
        investigation or regulator request (ZTAX-LEG-REQ-0091) and blocks
        disposition of what it scopes, past any retention period
        (ZTAX-EVID-REQ-0023, ZTAX-PRIV-REQ-0050). The scope is specific —
        named decisions or business keys, or a bounded window of event times
        of at most ten years, optionally narrowed to one legal entity — never
        a tenant at large, so a hold is never a reason to keep unrelated
        personal data (ZTAX-PRIV-REQ-0051).
