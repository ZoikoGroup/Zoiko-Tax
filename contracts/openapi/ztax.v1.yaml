        One action. `note` is required for RESPOND, SIGN_OFF, REOPEN, ESCALATE,
        REQUEST_EVIDENCE, NOTE and REQUEST_LEGAL_HOLD; `assignee` for ASSIGN;
        `escalateTo` for ESCALATE; `evidence` for ADD_EVIDENCE. The
        classification fields are read by TRIAGE only, and only what is
        supplied changes.
      additionalProperties: false
      required: [action]
      properties:
        action: { $ref: "#/components/schemas/SupportCaseAction" }
        note: { $ref: "#/components/schemas/SupportNote" }
        type: { $ref: "#/components/schemas/SupportCaseType" }
        severity: { $ref: "#/components/schemas/SupportSeverity" }
        legalEntityId: { $ref: "#/components/schemas/LegalEntityId" }
        fiscalPeriod: { $ref: "#/components/schemas/LegalPeriod" }
        contractRef: { $ref: "#/components/schemas/SupportReference" }
        sellerRef: { $ref: "#/components/schemas/SupportReference" }
        statutoryDueAt: { $ref: "#/components/schemas/Timestamp" }
        assignee: { $ref: "#/components/schemas/SupportUserId" }
        escalateTo: { $ref: "#/components/schemas/SupportEscalationTarget" }
        evidence:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/SupportEvidenceReference" }

    ContributionId:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ContributionId
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      example: 01920b80-1a2b-7c3d-8e4f-5a6b7c8d9e01

    ContributionRegime:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ContributionRegime
      description: The fund a provider contribution is owed to — the US Universal Service Fund through USAC, Canada's CRTC National Contribution Fund, or another.
      enum: [US_USF, CA_CRTC_NCF, OTHER]

    ContributionSourceType:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ContributionSourceType
      description: The kind of record a source event is (OBL-06).
      enum: [BSS_INVOICE, RATED_USAGE, REVENUE_RECOGNITION_ADJUSTMENT, LICENCE_ACTIVITY, MANUAL_CERTIFIED_SCHEDULE]

    ContributionStatus:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ContributionStatus
      description: Where a contribution stands. Only ACCEPTED counts in the control totals; QUARANTINED is held, never deleted.
      enum: [ACCEPTED, QUARANTINED]

    ContributionEventKind:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ContributionEventKind
      description: What happened to a contribution. Every one is appended; none edits.
      enum: [RECORDED, QUARANTINED, RELEASED]

    ContributionIncompleteReason:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ContributionIncompleteReason
      description: Why a group's control totals are DATA_INCOMPLETE — a held import, or a reversal of an original the ledger does not hold.
      enum: [QUARANTINED_EVENTS, UNRESOLVED_REVERSAL]

    ContributionAmount:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ContributionAmount
      description: |
        A provider's contribution base, or a quantity, in canonical decimal string
        form — never a JSON number, and never computed by a client
        (UAT-OBL-034). Scale is significant. An operator's own revenue
        aggregate, not a consumer amount, so it carries no personal data
        (UAT-OBL-025).
      pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]+)?$"
      maxLength: 64
      example: "1250.00"

    ContributionRef:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ContributionRef
      description: A reference into the provider's own systems or rules — a source event, invoice, usage or GL reference, classification, situs, component or rule version. Never a customer identity.
      minLength: 1
      maxLength: 200
      example: INV-2026-000123

    ContributionReason:
      x-ztax-privacy: { class: P2, purposes: [PURP-FILE, PURP-EVID], retention: RET-EVIDENCE, redaction: REDACT, aiAllowed: NONE }
      type: string
      title: ContributionReason
      description: Why a contribution was quarantined or released, in the words of the person who did it.
      minLength: 1
      maxLength: 2000
      example: The September billing extract was imported twice under new file ids

    ContributionSourceKey:
      type: object
      title: ContributionSourceKey
      description: A source event and its version — the natural key a contribution is recorded under.
      additionalProperties: false
      required: [sourceEventId, sourceVersion]
      properties:
        sourceEventId: { $ref: "#/components/schemas/ContributionRef" }
        sourceVersion:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1

    ContributionStatusEvent:
      type: object
      title: ContributionStatusEvent
      additionalProperties: false
      required: [seq, kind, status, recordedAt, recordedBy]
      properties:
        seq:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
        kind: { $ref: "#/components/schemas/ContributionEventKind" }
        status: { $ref: "#/components/schemas/ContributionStatus" }
        reason: { $ref: "#/components/schemas/ContributionReason" }
        recordedAt: { $ref: "#/components/schemas/Timestamp" }
        recordedBy:
          x-ztax-privacy: { class: P1, purposes: [PURP-SEC, PURP-EVID], retention: RET-EVIDENCE, redaction: NONE }
          type: string
          format: uuid

    ERPBridgeId:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ERPBridgeId
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      example: 01920c20-0000-7000-8000-0000000000b1

    ERPExportId:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ERPExportId
      description: An export batch. Also the external reference every attempt of the batch carries to the ERP.
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      example: 01920c20-1a2b-7c3d-8e4f-5a6b7c8d9e10

    ERPAttemptId:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ERPAttemptId
      description: One dispatch attempt of an export batch.
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      example: 01920c20-1a2b-7c3d-8e4f-5a6b7c8d9e20

    GLSnapshotId:
      x-ztax-privacy: { class: P0 }
      type: string
      title: GLSnapshotId
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      example: 01920c20-1a2b-7c3d-8e4f-5a6b7c8d9e30

    GLReconciliationId:
      x-ztax-privacy: { class: P0 }
      type: string
      title: GLReconciliationId
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      example: 01920c20-1a2b-7c3d-8e4f-5a6b7c8d9e40

    ERPVendor:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ERPVendor
      description: The ERP family a bridge targets. A label for the connector that consumes a dispatch; each real target still needs its own contract verification (LED-23).
      enum: [SAP, ORACLE, NETSUITE, DYNAMICS, OTHER]
      example: SAP

    ERPRef:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ERPRef
      description: A reference into the customer's ERP or its reports — a message, receipt, query, posted journal or report reference, or a checksum. Never a person.
      minLength: 1
      maxLength: 200
      example: SAP-MSG-000918

    ERPDetail:
      x-ztax-privacy: { class: P2, purposes: [PURP-FILE, PURP-EVID], retention: RET-EVIDENCE, redaction: REDACT, aiAllowed: NONE }
      type: string
      title: ERPDetail
      description: Why — an ERP's rejection text, why an outcome is unknown, or why a batch was withdrawn — in the words of the person who recorded it.
      minLength: 1
      maxLength: 2000
      example: "F5 702: GL account 2310-00 is blocked for posting in company code AC01"

    GLAccountCode:
      x-ztax-privacy: { class: P0 }
      type: string
      title: GLAccountCode
      description: An account code in the customer's general ledger. Never a TCSL control account.
      pattern: "^[A-Za-z0-9._:/-]{1,60}$"
      example: "2310-00"

    LedgerAmount:
      x-ztax-privacy: { class: P0 }
      type: string
      title: LedgerAmount
      description: |
        A ledger figure in canonical decimal string form — never a JSON number,
        never computed by a client. Scale is significant. A control total or GL
        aggregate of the provider's own books, not a consumer amount.
      pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]+)?$"
      maxLength: 64
      example: "10.00"

    ERPBridgeRequest:
      type: object
      title: ERPBridgeRequest
      additionalProperties: false
      required: [name, vendor, companyCode]
      properties:
        name:
          x-ztax-privacy: { class: P0 }
          type: string
          minLength: 1
          maxLength: 200
          description: A label for the connection.
        vendor: { $ref: "#/components/schemas/ERPVendor" }
        companyCode:
          x-ztax-privacy: { class: P0 }
          type: string
          pattern: "^[A-Za-z0-9._-]{1,40}$"
          description: The legal entity's company code in the ERP.
        legalEntityId: { $ref: "#/components/schemas/LegalEntityId" }

    ERPAccountMap:
      type: object
      title: ERPAccountMap
      description: One TCSL control account, onto one customer GL account.
      additionalProperties: false
      required: [account, glAccount]
      properties:
        account: { $ref: "#/components/schemas/ControlAccount" }
        glAccount: { $ref: "#/components/schemas/GLAccountCode" }

    ERPMapping:
      type: object
      title: ERPMapping
      description: One version of a bridge's account mapping. Never edited; a change is the next version.
      additionalProperties: false
      required: [version, chartVersion, accounts, digest, recordedAt, recordedBy]
      properties:
        version:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
        chartVersion: { $ref: "#/components/schemas/ERPRef" }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/ERPAccountMap" }
        digest: { $ref: "#/components/schemas/Digest" }
        recordedAt: { $ref: "#/components/schemas/Timestamp" }
        recordedBy:
          x-ztax-privacy: { class: P1, purposes: [PURP-SEC, PURP-EVID], retention: RET-EVIDENCE, redaction: NONE }
          type: string
          format: uuid

    ERPMappingRequest:
      type: object
      title: ERPMappingRequest
      additionalProperties: false
      required: [chartVersion, accounts]
      properties:
        chartVersion: { $ref: "#/components/schemas/ERPRef" }
        accounts:
          type: array
          minItems: 1
          maxItems: 12
          items: { $ref: "#/components/schemas/ERPAccountMap" }

    ERPBridge:
      type: object
      title: ERPBridge
      description: A member legal entity's subledger connected to one customer general ledger, with its mapping versions oldest first.
      additionalProperties: false
      required: [id, legalEntityId, name, vendor, companyCode, createdAt, createdBy, mappings]
      properties:
        id: { $ref: "#/components/schemas/ERPBridgeId" }
        legalEntityId: { $ref: "#/components/schemas/LegalEntityId" }
        name:
          x-ztax-privacy: { class: P0 }
          type: string
        vendor: { $ref: "#/components/schemas/ERPVendor" }
        companyCode:
          x-ztax-privacy: { class: P0 }
          type: string
        createdAt: { $ref: "#/components/schemas/Timestamp" }
        createdBy:
          x-ztax-privacy: { class: P1, purposes: [PURP-SEC, PURP-EVID], retention: RET-EVIDENCE, redaction: NONE }
          type: string
          format: uuid
        currentMappingVersion:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
          description: The version a new batch is prepared under. Absent until a mapping is recorded.
        mappings:
          type: array
          items: { $ref: "#/components/schemas/ERPMapping" }

    ERPBridgeList:
      type: object
      title: ERPBridgeList
      additionalProperties: false
      required: [bridges]
      properties:
        bridges:
          type: array
          items: { $ref: "#/components/schemas/ERPBridge" }

    ERPExportStatus:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ERPExportStatus
      description: |
        A batch's transfer state (LED-23). `TRANSMITTED` is committed for
        transmission; `ACKNOWLEDGED` is the ERP's transport receipt; only
        `ERP_POSTED` says the general ledger holds it. `WITHDRAWN` is a batch
        released before it was ever sent.
      enum: [PREPARED, TRANSMITTED, ACKNOWLEDGED, ERP_POSTED, REJECTED, OUTCOME_UNKNOWN, WITHDRAWN]
      example: ERP_POSTED

    ERPExportEventKind:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ERPExportEventKind
      enum: [PREPARED, DISPATCHED, ACKNOWLEDGED, POSTED, REJECTED, OUTCOME_UNKNOWN, STATUS_NOT_FOUND, WITHDRAWN]
      example: DISPATCHED

    ERPResponseKind:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ERPResponseKind
      description: An ERP answer a person records.
      enum: [ACKNOWLEDGED, POSTED, REJECTED, OUTCOME_UNKNOWN, STATUS_NOT_FOUND]
      example: POSTED

    ERPExportEvent:
      type: object
      title: ERPExportEvent
      description: One appended act on a batch — its delivery evidence, attempt by attempt.
      additionalProperties: false
      required: [seq, kind, status, recordedAt, recordedBy]
      properties:
        seq:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
        kind: { $ref: "#/components/schemas/ERPExportEventKind" }
        status: { $ref: "#/components/schemas/ERPExportStatus" }
        attemptId: { $ref: "#/components/schemas/ERPAttemptId" }
        remoteCorrelation: { $ref: "#/components/schemas/ERPRef" }
        erpReference: { $ref: "#/components/schemas/ERPRef" }
        responseDigest: { $ref: "#/components/schemas/ERPRef" }
        detail: { $ref: "#/components/schemas/ERPDetail" }
        recordedAt: { $ref: "#/components/schemas/Timestamp" }
        recordedBy:
          x-ztax-privacy: { class: P1, purposes: [PURP-SEC, PURP-EVID], retention: RET-EVIDENCE, redaction: NONE }
          type: string
          format: uuid

    ERPExportLine:
      type: object
      title: ERPExportLine
      description: One exported line, traced to the TCSL journal line it carries (ZTAX-FIN-REQ-0053).
      additionalProperties: false
      required: [journalId, journalLine, account, glAccount, side, amount]
      properties:
        journalId:
          x-ztax-privacy: { class: P0 }
          type: string
          format: uuid
        journalLine:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
        account: { $ref: "#/components/schemas/ControlAccount" }
        glAccount: { $ref: "#/components/schemas/GLAccountCode" }
        side:
          x-ztax-privacy: { class: P0 }
          type: string
          enum: [DEBIT, CREDIT]
        amount: { $ref: "#/components/schemas/LedgerAmount" }
        authority:
          x-ztax-privacy: { class: P0 }
          type: string
        jurisdiction:
          x-ztax-privacy: { class: P0 }
          type: string

    ERPCorrectionTask:
      type: object
      title: ERPCorrectionTask
      description: |
        The task an ERP rejection opens: the rejected batch's journals that no
        posted batch has carried into the GL since. Open while any is
        outstanding, and the period's GL reconciliation is held until then.
      additionalProperties: false
      required: [open, openedAt, outstandingJournalIds, postedBy]
      properties:
        open:
          x-ztax-privacy: { class: P0 }
          type: boolean
        openedAt: { $ref: "#/components/schemas/Timestamp" }
        reason: { $ref: "#/components/schemas/ERPDetail" }
        outstandingJournalIds:
          x-ztax-privacy: { class: P0 }
          type: array
          items:
            type: string
            format: uuid
        postedBy:
          type: array
          description: The posted batches that carried the rejected journals.
          items: { $ref: "#/components/schemas/ERPExportId" }

    ERPExport:
      type: object
      title: ERPExport
      description: |
        A sealed export batch: the export mapping (company code, mapping and
        chart version, currency, posting date), the exact journal ID set, the
        totals and the batch digest, with its transfer state and every attempt
        and ERP answer recorded against it.
      additionalProperties: false
      required: [id, bridgeId, legalEntityId, period, currency, postingDate, companyCode, mappingVersion, chartVersion, mappingDigest, externalRef, journalIds, lineCount, totalDebits, totalCredits, batchDigest, preparedAt, preparedBy, status, history]
      properties:
        id: { $ref: "#/components/schemas/ERPExportId" }
        bridgeId: { $ref: "#/components/schemas/ERPBridgeId" }
        legalEntityId: { $ref: "#/components/schemas/LegalEntityId" }
        period: { $ref: "#/components/schemas/LegalPeriod" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        postingDate: { $ref: "#/components/schemas/CivilDate" }
        companyCode:
          x-ztax-privacy: { class: P0 }
          type: string
        mappingVersion:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
        chartVersion: { $ref: "#/components/schemas/ERPRef" }
        mappingDigest: { $ref: "#/components/schemas/Digest" }
        externalRef:
          x-ztax-privacy: { class: P0 }
          type: string
          description: The reference every attempt carries to the ERP, and that the ERP deduplicates on.
        journalIds:
          x-ztax-privacy: { class: P0 }
          type: array
          items:
            type: string
            format: uuid
        lineCount:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          minimum: 1
        totalDebits: { $ref: "#/components/schemas/LedgerAmount" }
        totalCredits: { $ref: "#/components/schemas/LedgerAmount" }
        batchDigest: { $ref: "#/components/schemas/Digest" }
        preparedAt: { $ref: "#/components/schemas/Timestamp" }
        preparedBy:
          x-ztax-privacy: { class: P1, purposes: [PURP-SEC, PURP-EVID], retention: RET-EVIDENCE, redaction: NONE }
          type: string
          format: uuid
        status: { $ref: "#/components/schemas/ERPExportStatus" }
        history:
          type: array
          items: { $ref: "#/components/schemas/ERPExportEvent" }
        correction: { $ref: "#/components/schemas/ERPCorrectionTask" }
        lines:
          type: array
          description: Present when one batch is read.
          items: { $ref: "#/components/schemas/ERPExportLine" }

    ERPExportList:
      type: object
      title: ERPExportList
      additionalProperties: false
      required: [exports]
      properties:
        exports:
          type: array
          items: { $ref: "#/components/schemas/ERPExport" }

    ERPExportRequest:
      type: object
      title: ERPExportRequest
      additionalProperties: false
