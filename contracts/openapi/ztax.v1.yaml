  /v1/notices/{noticeId}/deadlines:
    get:
      operationId: getNoticeDeadlines
      tags: [notices]
      summary: The statutory deadline ledger
      description: |
        `ADMIN`, `OPERATOR`, `ANALYST` or `AUDITOR`. The original deadline as
        received, then every confirmation, extension and appeal deadline in
        order, each with its evidence. The original is never rewritten
        (T18-17).
      parameters:
        - $ref: "#/components/parameters/NoticeId"
      responses:
