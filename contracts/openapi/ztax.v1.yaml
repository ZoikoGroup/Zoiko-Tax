                  value: { id: de-decisions, version: 1, recordClass: DECISION, country: DE, years: 10, trigger: EVENT_YEAR_END, effectiveFrom: "2020-01-01T00:00:00.000000Z", citation: "AO §147(3)", recordedAt: "2026-10-01T09:00:00.000000Z", recordedBy: 01920a4c-0000-7000-8000-0000000000a1 }
