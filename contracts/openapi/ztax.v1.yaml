                    ranAt: "2026-10-03T09:00:00.000000Z"
                    unavailable: [R2_DOCUMENT_TO_COLLECTION, R4_SUBLEDGER_TO_RETURN, R5_RETURN_TO_REMITTANCE, R6_SUBLEDGER_TO_GL]
