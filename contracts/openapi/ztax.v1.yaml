    ResponsibilityStatus:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ResponsibilityStatus
      description: |
        A role's or a decision's outcome. `NOT_APPLICABLE` is a role the law
        gives to nobody and is a role status only; a decision is the worst
        of its roles, with `NOT_APPLICABLE` counting as `RESOLVED`.
      enum: [RESOLVED, NOT_APPLICABLE, AMBIGUOUS, CONFLICTED, UNSUPPORTED]
      example: RESOLVED

    RoleAssignment:
      type: object
      title: RoleAssignment
      additionalProperties: false
      required: [role, status]
      properties:
        role:
          x-ztax-privacy: { class: P0 }
          type: string
          enum: [INCIDENCE, COLLECTION, REPORTING, REMITTANCE, ECONOMIC_BEARER]
        status: { $ref: "#/components/schemas/ResponsibilityStatus" }
        statutory:
          $ref: "#/components/schemas/RoleHolder"
          description: The party the law places the role on. Present only when RESOLVED.
        agent:
          $ref: "#/components/schemas/RoleHolder"
          description: A party performing the role for the statutory party, where the law permits delegation.
        detail:
          x-ztax-privacy: { class: P0 }
          type: string
          description: Why the role did not resolve, or why it has no holder.

    RoleHolder:
      type: object
      title: RoleHolder
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          x-ztax-privacy: { class: P0 }
          type: string
          enum: [SELLER, BUYER, MARKETPLACE, WHOLESALER, RESELLER, END_USER]
