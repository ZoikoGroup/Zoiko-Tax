        new decision with its own.
      additionalProperties: false
      required: [id, item, component, componentVersion, taxType, jurisdiction, authority, treatment,
        legalEntityId, rule, bundleId, bundleDigest, effectiveFrom, status, roles, recordedAt]
      properties:
