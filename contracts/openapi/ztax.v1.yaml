                  summary: One sealed day
                  value:
                    seals:
                      - id: 01920a80-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                        periodStart: "2026-09-25T00:00:00.000000Z"
                        periodEnd: "2026-09-26T00:00:00.000000Z"
