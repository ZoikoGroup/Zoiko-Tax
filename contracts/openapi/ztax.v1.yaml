      properties:
        legalEntityId: { $ref: "#/components/schemas/LegalEntityId" }
        balances:
          type: array
          items: { $ref: "#/components/schemas/ControlBalance" }

    ObligationId:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ObligationId
      description: One row of an obligation's history. A UUID in lowercase canonical form.
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      example: 01920a4d-1b2c-7d3e-8f40-5a6b7c8d9e01

    CivilDate:
      x-ztax-privacy: { class: P0 }
      type: string
      title: CivilDate
      description: |
        A calendar date, `YYYY-MM-DD`, in a legal calendar the enclosing
        object names. Not an instant: a due date is a day in the authority's
        calendar, and converting it to UTC would move it.
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      example: "2026-10-20"

    ObligationStatus:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ObligationStatus
      description: A stored obligation status (ZTAX-OBL-REQ-0084).
      enum: [OPEN, DATA_REQUIRED, READY, FILED, ACCEPTED, REJECTED, UNCERTAIN, PAYMENT_DUE, PAID, AMENDMENT_REQUIRED, SUSPENDED, CLOSED]
      example: OPEN

    EffectiveObligationStatus:
      x-ztax-privacy: { class: P0 }
      type: string
      title: EffectiveObligationStatus
      description: A stored status, or `OVERDUE` derived as of today for an unfiled obligation past its due date.
      enum: [OPEN, DATA_REQUIRED, READY, FILED, ACCEPTED, REJECTED, UNCERTAIN, PAYMENT_DUE, PAID, AMENDMENT_REQUIRED, SUSPENDED, CLOSED, OVERDUE]
      example: OVERDUE

    Obligation:
      type: object
      title: Obligation
      description: |
        One row of an obligation: a periodic duty owed by a legal entity to an
        authority, under a pinned definition version and signed content. The
        dates are civil dates in `timezone`; `periodEnd` is the period's
        last day, inclusive, and `dueDate` the legal due date.

        `assessedAmount` is the sum of the committed decisions' assessments:
        live on the current row, and as written on a superseded one.
        `supersedes` names the row this one replaced; `supersededBy`, on a
        row that is history, the row that replaced it.
      additionalProperties: false
      required: [id, type, duty, jurisdiction, authority, legalEntityId, definition, content, periodStart, periodEnd, dueDate, timezone, status, effectiveStatus, recordedAt]
      properties:
        id: { $ref: "#/components/schemas/ObligationId" }
        type:
          x-ztax-privacy: { class: P0 }
          type: string
          description: The return or duty, as the content names it.
        duty:
          x-ztax-privacy: { class: P0 }
          type: string
          enum: [TRANSACTION_MONETARY, PERIODIC_CONTRIBUTION, REGISTRATION, INFORMATION_RETURN, RECORDKEEPING, NOTICE_RESPONSE]
        jurisdiction:
          x-ztax-privacy: { class: P0 }
          type: string
        authority:
          x-ztax-privacy: { class: P0 }
          type: string
        legalEntityId: { $ref: "#/components/schemas/LegalEntityId" }
        definition:
          type: object
          additionalProperties: false
          required: [id, version]
          properties:
            id:
              x-ztax-privacy: { class: P0 }
              type: string
            version:
              x-ztax-privacy: { class: P0 }
              type: string
        content:
          type: object
          additionalProperties: false
          required: [bundleId, bundleDigest]
          properties:
            bundleId:
              x-ztax-privacy: { class: P0 }
              type: string
            bundleDigest: { $ref: "#/components/schemas/Digest" }
        periodStart: { $ref: "#/components/schemas/CivilDate" }
        periodEnd: { $ref: "#/components/schemas/CivilDate" }
        dueDate: { $ref: "#/components/schemas/CivilDate" }
        timezone:
          x-ztax-privacy: { class: P0 }
          type: string
          description: The legal calendar's IANA timezone.
        status: { $ref: "#/components/schemas/ObligationStatus" }
        effectiveStatus: { $ref: "#/components/schemas/EffectiveObligationStatus" }
        assessedAmount: { $ref: "#/components/schemas/Decimal" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        supersedes: { $ref: "#/components/schemas/ObligationId" }
        supersededBy: { $ref: "#/components/schemas/ObligationId" }
        recordedAt: { $ref: "#/components/schemas/Timestamp" }
        recordedBy:
          x-ztax-privacy: { class: P1, purposes: [PURP-SEC, PURP-EVID], retention: RET-EVIDENCE, redaction: NONE }
          type: string
          format: uuid
          description: The user whose move wrote this row. Absent when a commit wrote it.

    ObligationList:
      type: object
      title: ObligationList
      additionalProperties: false
      required: [obligations]
      properties:
        obligations:
          type: array
          items: { $ref: "#/components/schemas/Obligation" }

    ObligationTransitionRequest:
      type: object
      title: ObligationTransitionRequest
      additionalProperties: false
      required: [to]
      properties:
        to:
          x-ztax-privacy: { class: P0 }
          type: string
          enum: [OPEN, DATA_REQUIRED, READY, SUSPENDED, CLOSED]

    ClassificationProposalRequest:
      type: object
      title: ClassificationProposalRequest
      additionalProperties: false
