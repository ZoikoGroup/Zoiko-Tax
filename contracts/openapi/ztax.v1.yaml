  /v1/documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: The tenant's fiscal documents, latest committed first
      description: |
        `OPERATOR`, `ANALYST` or `AUDITOR`. Each document exactly as
        `GET /v1/documents/{documentId}` returns it — lines, totals and
        status history — corrections and cancellations included. The page is
        capped at 100 whatever `limit` asks for, because each document is
        read in full.
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The documents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiscalDocumentList"
              examples:
                default:
                  summary: Nothing committed yet
                  value:
                    documents: []
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: issueDocument
      tags: [documents]
      summary: Commit a fiscal document that presents committed decisions
      description: |
        `OPERATOR` only. Commits an `INVOICE`, `DEBIT_NOTE` or `ADJUSTMENT`
        (ZTAX-FIN-001 §3). A document invents no tax: every tax line names
        the committed decision it comes from and the component — the slot the
        decision's content posts, such as `TAX_VAT` — and for each decision
        and component the document must present exactly what was decided
        (ZTAX-FIN-REQ-0010, -0011). A component decided as zero may be left
        out. A document that disagrees is refused with `409 CONFLICTED`
        naming each decision and component that differs, and nothing is
        committed: correct the decision, not the document.

        Each decision must be the current version of its business key, and
        may be billed by only one standing document at a time: a second
        invoice for a decision already billed is refused with
        `409 ALREADY_EXISTS` until the first is voided or fully credited.

        Committed documents are never changed. `Idempotency-Key` is required.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentRequest"
            examples:
              default:
                summary: An invoice for one committed line
                value:
                  type: INVOICE
                  number: INV-2026-0001
                  issueDate: "2026-09-25"
                  taxPoint: "2026-09-24T18:00:00.000000Z"
                  currency: EUR
                  externalRef: { sourceSystem: bss, namespace: invoice, value: "88231" }
                  lines:
                    - sourceLineRef: "bss:order-9/line-1"
                      net: "100.00"
                      taxes:
                        - { decisionId: 01920a4b-7c3e-7d21-9f40-3c1a2b4d5e6f, component: TAX_VAT, amount: "21.00" }
                        - { decisionId: 01920a4b-7c3e-7d21-9f40-3c1a2b4d5e6f, component: TAX_ECO_LEVY, amount: "0.11" }
      responses:
        "201":
          description: |
            The committed document. A replayed response carries
            `Idempotent-Replay: true` and is byte-for-byte the original.
          headers:
            Idempotent-Replay:
              description: Present, and `true`, when this is the stored response to an earlier request with the same key.
              schema: { type: boolean }
              example: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FiscalDocument"
              examples:
                default:
                  summary: A committed invoice
                  value:
                    id: 01920a90-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                    type: INVOICE
                    number: INV-2026-0001
                    rootId: 01920a90-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                    predecessors: []
                    legalEntityId: 01920a4c-0000-7000-8000-00000000e001
                    issueDate: "2026-09-25"
                    taxPoint: "2026-09-24T18:00:00.000000Z"
                    currency: EUR
                    externalRef: { sourceSystem: bss, namespace: invoice, value: "88231" }
                    decisionIds: [01920a4b-7c3e-7d21-9f40-3c1a2b4d5e6f]
                    lines:
                      - id: 01920a90-2b3c-7d4e-8f50-6a7b8c9d0e1f
                        sourceLineRef: "bss:order-9/line-1"
                        net: "100.00"
                        taxes:
                          - { decisionId: 01920a4b-7c3e-7d21-9f40-3c1a2b4d5e6f, component: TAX_VAT, amount: "21.00" }
                          - { decisionId: 01920a4b-7c3e-7d21-9f40-3c1a2b4d5e6f, component: TAX_ECO_LEVY, amount: "0.11" }
                    netTotal: "100.00"
                    taxTotal: "21.11"
                    grossTotal: "121.11"
                    status: COMMITTED
                    history:
                      - { seq: 1, status: COMMITTED, recordedAt: "2026-09-25T09:00:00.000000Z" }
                    recordedAt: "2026-09-25T09:00:00.000000Z"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

