                ztx_request_id: 01JBQ0S9C3X8Q1H6M2KX5R7F4Q
                ztx_retryable: true

    RateLimited:
      description: |
        Too many requests from this client or for this account. The request was
        not applied; `Retry-After` says when to try again.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, format: int32, minimum: 0 }
          example: 600
      content:
        application/problem+json:
