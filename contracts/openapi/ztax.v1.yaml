          example: We operate in twelve EU markets and would like a demonstration.

    CreateUserRequest:
      type: object
      title: CreateUserRequest
      additionalProperties: false
      required: [email, displayName]
      properties:
        email:
          x-ztax-privacy: { class: P1, purposes: [PURP-SEC, PURP-SUPPORT], retention: RET-OPERATIONAL, redaction: REDACT, aiAllowed: NONE }
          type: string
          format: email
          example: auditor@acme.example
        displayName:
          x-ztax-privacy: { class: P1, purposes: [PURP-SEC, PURP-SUPPORT], retention: RET-OPERATIONAL, redaction: REDACT, aiAllowed: NONE }
          type: string
          example: Katherine Johnson
        roles:
          type: array
          description: Roles to grant on creation. A user may be created with none.
          items: { $ref: "#/components/schemas/Role" }
        password:
          x-ztax-privacy: { class: P7, purposes: [PURP-SEC], retention: RET-TRANSIENT, redaction: NO_LOG, aiAllowed: NONE, evidencePolicy: NONE }
          type: string
          format: password
          minLength: 12
          description: |
            Optional. Omitting it creates an `INVITED` user who cannot sign in
            until a password is set.

    SetUserStatusRequest:
      type: object
      title: SetUserStatusRequest
      additionalProperties: false
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/UserStatus" }

    RoleRequest:
      type: object
      title: RoleRequest
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }

    DecisionId:
      x-ztax-privacy: { class: P0 }
      type: string
      title: DecisionId
      description: |
        A decision identifier: a UUIDv7 in lowercase canonical form
        (ADR-0012 §2.1). Sortable by creation, never recycled.
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      example: 01920a4b-7c3e-7d21-9f40-3c1a2b4d5e6f

    Decimal:
      x-ztax-privacy: { class: P5, purposes: [PURP-TAX-CALC, PURP-EVID], retention: RET-FISCAL, redaction: REDACT, aiAllowed: NONE, evidencePolicy: RAW_REQUIRED }
      type: string
      title: Decimal
      description: |
        A decimal in canonical string form (ADR-0010 §2.9): an optional minus,
        digits, and an optional fraction. No exponent, no leading `+`, no
        leading zeros. **Scale is significant**: `"1.50"` and `"1.5"` are
        different assertions and digest differently.

        Classified as fiscal personal data because on a consumer transaction
        it is: logs carry it redacted, and it is kept for the fiscal record
        period as evidence.
      pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]+)?$"
      maxLength: 64
      example: "100.00"

    CurrencyCode:
      x-ztax-privacy: { class: P0 }
      type: string
      title: CurrencyCode
      description: An ISO 4217 alphabetic currency code.
      pattern: "^[A-Z]{3}$"
      example: EUR

    RateBasis:
      x-ztax-privacy: { class: P0 }
      type: string
      title: RateBasis
      description: What a rate applies to (ADR-0002). A rate without a basis is not a rate.
      enum: [NET, GROSS, PER_UNIT, COMPOUND]
      example: NET

    UnitCode:
      x-ztax-privacy: { class: P0 }
      type: string
      title: UnitCode
      description: A unit of measure, as the content pack names it.
      minLength: 1
      maxLength: 32
      example: EA

    ValueType:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ValueType
      description: The type of an emitted value. It says which of a value's other members are present.
      enum: [MONEY, RATE, QUANTITY, BOOL, STRING, REASON_CODE]
      example: MONEY

    Outcome:
      x-ztax-privacy: { class: P0 }
      type: string
      title: Outcome
      description: |
        What a determination concluded (ADR-0016 §2.1). Only `AUTHORITATIVE`
        may be filed, and nothing produces it before A4. The refusals —
        `AMBIGUOUS`, `CONFLICTED`, `UNSUPPORTED`, `REVIEW_REQUIRED` — are
        outcomes with evidence, not errors: "we do not support this" is a fact
        about coverage that is recorded against the transaction.
      enum: [AUTHORITATIVE, ADVISORY, AMBIGUOUS, CONFLICTED, UNSUPPORTED, REVIEW_REQUIRED]
      example: ADVISORY

    ReplayVerdict:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ReplayVerdict
      enum: [MATCH, DIVERGED, BUNDLE_UNAVAILABLE]
      example: MATCH

    BusinessKey:
      x-ztax-privacy: { class: P0 }
      type: string
      title: BusinessKey
      description: |
        The caller's stable reference for what is being determined — a line, a
        transaction. It is the identity across corrections: every version of a
        decision shares it (ADR-0003). Not an identifier this service
        interprets.
      minLength: 1
      maxLength: 255
      example: INV-0001/1

    MoneyValue:
      type: object
      title: MoneyValue
      description: An amount and its currency, never one without the other.
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: { $ref: "#/components/schemas/Decimal" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }

    RateValue:
      type: object
      title: RateValue
      additionalProperties: false
      required: [value, basis]
      properties:
        value: { $ref: "#/components/schemas/Decimal" }
        basis: { $ref: "#/components/schemas/RateBasis" }

    QuantityValue:
      type: object
      title: QuantityValue
      additionalProperties: false
      required: [value, unit]
      properties:
        value: { $ref: "#/components/schemas/Decimal" }
        unit: { $ref: "#/components/schemas/UnitCode" }

    DeterminationInput:
      type: object
      title: DeterminationInput
      description: |
        The named values the active content reads, grouped by type. The names
        are the pack's — `line.netAmount`, not a field this contract defines —
        because which values a transaction carries is decided by content, and
        a transaction shape fixed here would be tax logic in the API
        (ZTAX-DET-001 §0.2). At least one value is required.
      additionalProperties: false
      properties:
        money:
          type: object
          additionalProperties: { $ref: "#/components/schemas/MoneyValue" }
        rates:
          type: object
          additionalProperties: { $ref: "#/components/schemas/RateValue" }
        quantities:
          type: object
          additionalProperties: { $ref: "#/components/schemas/QuantityValue" }
        flags:
          x-ztax-privacy: { class: P0 }
          type: object
          additionalProperties: { type: boolean }
        strings:
          x-ztax-privacy: { class: P4, purposes: [PURP-TAX-CALC, PURP-SITUS, PURP-EVID], retention: RET-FISCAL, redaction: REDACT, aiAllowed: NONE, evidencePolicy: RAW_REQUIRED }
          type: object
          description: |
            Free-text values, such as a situs attribute. Classified as location
            evidence because that is what content most often reads here.
          additionalProperties: { type: string, maxLength: 1024 }

    ReadSet:
      type: object
      title: ReadSet
      description: |
        The accumulator values the evaluation reads — exactly the ones the
        active bundle declares, no more and no fewer. They are supplied by the
        caller until the accumulator store of ADR-0004 lands, and are recorded
        in the decision's envelope either way (ZTAX-DET-REQ-0034).
      additionalProperties: { $ref: "#/components/schemas/MoneyValue" }

    QuoteRequest:
      type: object
      title: QuoteRequest
      description: |
        Exactly one of `input` (named values for a rule-graph pack) and
        `document` (a telecom document for a pack with location-aware
        content) is required. `eventTime` is the tax point.
      additionalProperties: false
      required: [eventTime]
      properties:
        eventTime: { $ref: "#/components/schemas/Timestamp" }
        input: { $ref: "#/components/schemas/DeterminationInput" }
        document: { $ref: "#/components/schemas/TaxDocument" }
        accumulators: { $ref: "#/components/schemas/ReadSet" }

    CommitRequest:
      type: object
      title: CommitRequest
      description: |
        Exactly one of `input` and `document` is required, as for a quote.
        `eventTime` is the tax point: every effective date and legal period is
        resolved at it, in the authority's own calendar.
      additionalProperties: false
      required: [businessKey, eventTime]
      properties:
        businessKey: { $ref: "#/components/schemas/BusinessKey" }
        supersedes: { $ref: "#/components/schemas/DecisionId" }
        eventTime: { $ref: "#/components/schemas/Timestamp" }
        input: { $ref: "#/components/schemas/DeterminationInput" }
        document: { $ref: "#/components/schemas/TaxDocument" }
        accumulators: { $ref: "#/components/schemas/ReadSet" }

    ResultValue:
      type: object
      title: ResultValue
      description: |
        One emitted value. `type` says which other members are present:
        `amount` and `currency` for `MONEY`; `value` and `basis` for `RATE`;
        `value` and `unit` for `QUANTITY`; `flag` for `BOOL`; `text` for
        `STRING`; `reasonCode` for `REASON_CODE`.
      additionalProperties: false
      required: [type]
      properties:
        type: { $ref: "#/components/schemas/ValueType" }
        amount: { $ref: "#/components/schemas/Decimal" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        value: { $ref: "#/components/schemas/Decimal" }
        basis: { $ref: "#/components/schemas/RateBasis" }
        unit: { $ref: "#/components/schemas/UnitCode" }
        flag:
          x-ztax-privacy: { class: P0 }
          type: boolean
        text:
          x-ztax-privacy: { class: P4, purposes: [PURP-TAX-CALC, PURP-EVID], retention: RET-FISCAL, redaction: REDACT, aiAllowed: NONE, evidencePolicy: RAW_REQUIRED }
          type: string
        reasonCode: { $ref: "#/components/schemas/ReasonCode" }

    Emitted:
      type: object
      title: Emitted
      description: What the content emitted, by result slot. The slots are the pack's.
      additionalProperties: { $ref: "#/components/schemas/ResultValue" }

    BundleRef:
      type: object
      title: BundleRef
      description: The content bundle an evaluation ran against.
      additionalProperties: false
      required: [bundleId, digest, irVersion]
      properties:
        bundleId:
          x-ztax-privacy: { class: P0 }
          type: string
          example: eu-vat-worked-2026.09
        digest: { $ref: "#/components/schemas/Digest" }
        irVersion:
          x-ztax-privacy: { class: P0 }
          type: integer
          format: int32
          example: 1

    Quote:
      type: object
      title: Quote
      additionalProperties: false
      required: [authoritative, outcome, reasonCode, quotedAt, bundle, emitted]
      properties:
        authoritative:
          x-ztax-privacy: { class: P0 }
          type: boolean
          description: Always `false`. A quote is an estimate at every authorization level (ADR-0004 §2.7).
        outcome: { $ref: "#/components/schemas/Outcome" }
        reasonCode: { $ref: "#/components/schemas/ReasonCode" }
        quotedAt: { $ref: "#/components/schemas/Timestamp" }
        bundle: { $ref: "#/components/schemas/BundleRef" }
        emitted: { $ref: "#/components/schemas/Emitted" }
        document: { $ref: "#/components/schemas/DocumentDetermination" }

    DecisionDigests:
      type: object
      title: DecisionDigests
      description: |
        The digests a decision names (ADR-0011 §2.8). `envelope` and `result`
        are the evidence objects; `input` is the canonical input inside the
        envelope, which is what a search by input matches.
      additionalProperties: false
      required: [input, envelope, result]
      properties:
        input: { $ref: "#/components/schemas/Digest" }
        envelope: { $ref: "#/components/schemas/Digest" }
        result: { $ref: "#/components/schemas/Digest" }

    Decision:
      type: object
      title: Decision
      description: One recorded decision. Immutable; a correction is a new decision whose `supersedes` names this one.
      additionalProperties: false
      required: [id, businessKey, authoritative, outcome, reasonCode, eventTime, recordedAt, bundle, digests, emitted]
      properties:
        id: { $ref: "#/components/schemas/DecisionId" }
        businessKey: { $ref: "#/components/schemas/BusinessKey" }
        supersedes: { $ref: "#/components/schemas/DecisionId" }
        authoritative:
          x-ztax-privacy: { class: P0 }
          type: boolean
          description: Whether this decision may be filed. `false` for every decision before A4.
        outcome: { $ref: "#/components/schemas/Outcome" }
        reasonCode: { $ref: "#/components/schemas/ReasonCode" }
        eventTime: { $ref: "#/components/schemas/Timestamp" }
        recordedAt: { $ref: "#/components/schemas/Timestamp" }
        bundle: { $ref: "#/components/schemas/BundleRef" }
        digests: { $ref: "#/components/schemas/DecisionDigests" }
        emitted: { $ref: "#/components/schemas/Emitted" }
        document: { $ref: "#/components/schemas/DocumentDetermination" }

    # --- location-aware determination (ZTAX-DET-001 §2, ZTAX-JUR-001) -------

    JurisdictionId:
      x-ztax-privacy: { class: P4, purposes: [PURP-TAX-CALC, PURP-SITUS, PURP-EVID], retention: RET-FISCAL, redaction: REDACT, aiAllowed: NONE, evidencePolicy: RAW_REQUIRED }
      type: string
      title: JurisdictionId
      description: |
        A jurisdiction's content identifier (ADR-0012 §2.4), such as
        `jurisdiction:ca-qc`. Classified as location evidence: on a consumer
        document, the deepest jurisdiction is where the customer is.
      pattern: "^jurisdiction:[a-z0-9/-]+$"
      maxLength: 128
      example: "jurisdiction:ca-qc"

    LocationCode:
      x-ztax-privacy: { class: P4, purposes: [PURP-TAX-CALC, PURP-SITUS, PURP-EVID], retention: RET-FISCAL, redaction: REDACT, aiAllowed: NONE, evidencePolicy: RAW_REQUIRED }
      type: string
      title: LocationCode
      description: An ISO 3166-1 alpha-2 country code (`DE`) or ISO 3166-2 subdivision code (`CA-QC`).
      pattern: "^[A-Z]{2}(-[A-Z0-9]{1,3})?$"
      example: "DE"

    TaxDocumentType:
      x-ztax-privacy: { class: P0 }
      type: string
      title: TaxDocumentType
      description: An `INVOICE` carries non-negative amounts; a `CREDIT_NOTE` carries non-positive ones.
      enum: [INVOICE, CREDIT_NOTE]
      example: INVOICE

    PriceMode:
      x-ztax-privacy: { class: P0 }
      type: string
      title: PriceMode
      description: |
        `EXCLUSIVE`: amounts are net and customer charges are added.
        `INCLUSIVE`: amounts include the customer-charged taxes, which are
        extracted (DET-001 §7) — never computed on the gross and added.
      enum: [EXCLUSIVE, INCLUSIVE]
      example: EXCLUSIVE

    ServiceFamily:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ServiceFamily
      description: |
        A ZTAX-CLS-001 ontology family. A tenant's SKU is mapped to one before
        determination; a line without one is held as `CLASSIFICATION_REQUIRED`
        rather than guessed at.
      enum: [MOBILE_VOICE, FIXED_VOICE, MESSAGING, MOBILE_DATA, FIXED_BROADBAND, VOIP, SIP_TRUNKING, UCAAS, CCAAS, CPAAS,
        IOT_CONNECTIVITY, SUBSCRIPTION_IDENTITY, SATELLITE_CONNECTIVITY, ROAMING_RETAIL, ROAMING_WHOLESALE, INTERCONNECT,
        WHOLESALE_ACCESS, EQUIPMENT_SALE, EQUIPMENT_RENTAL, INSTALLATION_ACTIVATION, PROFESSIONAL_SERVICES, CONTENT_MEDIA,
        SOFTWARE, OTHER_NON_TELECOM]
      example: MOBILE_VOICE

    SitusEvidenceType:
      x-ztax-privacy: { class: P0 }
      type: string
      title: SitusEvidenceType
      description: |
        The JUR-001 §3.2 evidence vocabulary a caller may supply directly.
        Seller and customer establishment and VAT identification arrive on the
        parties instead, so one fact cannot arrive twice and disagree.
      enum: [PRIMARY_PLACE_OF_USE, SERVICE_ADDRESS, BILLING_ADDRESS, FIXED_LINE_LOCATION, NETWORK_LOCATION, SIM_COUNTRY,
        IP_GEOLOCATION, BANK_LOCATION, CUSTOMER_DECLARATION]
      example: SERVICE_ADDRESS

    SitusEvidenceSource:
      x-ztax-privacy: { class: P0 }
      type: string
      title: SitusEvidenceSource
      enum: [CUSTOMER_ASSERTED, SELLER_RECORDED, NETWORK_DERIVED, THIRD_PARTY_VERIFIED, AUTHORITY_VERIFIED]
      example: SELLER_RECORDED

    VatValidation:
      x-ztax-privacy: { class: P0 }
      type: string
      title: VatValidation
      description: |
        `VALIDATED` establishes a business customer where the pack recognises
        it. `UNVALIDATED` and `VALIDATION_UNAVAILABLE` are different facts and
        a pack may treat them differently (JUR-001 §7.3).
      enum: [VALIDATED, UNVALIDATED, VALIDATION_UNAVAILABLE]
      example: VALIDATED

    CertificateVerification:
      x-ztax-privacy: { class: P0 }
      type: string
      title: CertificateVerification
      description: |
        Only `VERIFIED` exempts. `UNAVAILABLE` holds the line for review; a
        verification is never assumed to have succeeded.
      enum: [VERIFIED, UNVERIFIED, UNAVAILABLE]
      example: VERIFIED

    PartyReference:
      x-ztax-privacy: { class: P2, purposes: [PURP-TAX-CALC, PURP-EVID], retention: RET-FISCAL, redaction: REDACT, aiAllowed: NONE }
      type: string
      title: PartyReference
      description: A party's reference in the caller's systems. Not interpreted; a certificate's holder must equal the customer's.
      minLength: 1
      maxLength: 128
      example: C1

    ContentLabel:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ContentLabel
      description: An identifier or label from the active content — a component, regime, authority, tax type, slot or certificate type.
      maxLength: 256
      example: xt.voice-tax

    ContentText:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ContentText
      description: Text from the active content, such as a source citation. Not interpreted.
      maxLength: 4096
      example: "Training rule: 8% of the voice base."

    Place:
      type: object
      title: Place
      description: |
        A location named by its jurisdiction — exactly one of a jurisdiction
        identifier and an ISO code. There is no street address: resolution
        never geocodes (JUR-001 §8.2), so an address is mapped to a
        jurisdiction by the system that records it.
      additionalProperties: false
      properties:
        jurisdiction: { $ref: "#/components/schemas/JurisdictionId" }
        subdivision: { $ref: "#/components/schemas/LocationCode" }
        country: { $ref: "#/components/schemas/LocationCode" }

    VatIdentification:
      type: object
      title: VatIdentification
      description: The customer's VAT registration country and validation status. The number itself is not needed and not retained.
      additionalProperties: false
      required: [country, validation]
      properties:
        country: { $ref: "#/components/schemas/LocationCode" }
        validation: { $ref: "#/components/schemas/VatValidation" }

    TaxParty:
      type: object
      title: TaxParty
      additionalProperties: false
      required: [id]
      properties:
        id: { $ref: "#/components/schemas/PartyReference" }
        establishment: { $ref: "#/components/schemas/Place" }
        vat: { $ref: "#/components/schemas/VatIdentification" }

    TaxIntermediary:
      type: object
      title: TaxIntermediary
      description: A party to the supply besides the seller and the customer.
      additionalProperties: false
      required: [kind, id]
      properties:
        kind:
          x-ztax-privacy: { class: P0 }
          type: string
          enum: [MARKETPLACE, WHOLESALER, RESELLER, END_USER]
        id: { $ref: "#/components/schemas/PartyReference" }

    SitusEvidenceItem:
      type: object
      title: SitusEvidenceItem
      description: One typed, attributed signal about where the supply took place (JUR-001 §3.1).
      additionalProperties: false
      required: [type, source, place]
      properties:
        type: { $ref: "#/components/schemas/SitusEvidenceType" }
        source: { $ref: "#/components/schemas/SitusEvidenceSource" }
        collectedAt: { $ref: "#/components/schemas/Timestamp" }
        place: { $ref: "#/components/schemas/Place" }

    ExemptionCertificate:
      type: object
      title: ExemptionCertificate
      description: |
        A certificate is scoped: by issuing jurisdiction, holder, tax types,
        components and validity. One that does not apply on any of those is
        refused visibly in the trace, never silently ignored.
      additionalProperties: false
      required: [id, type, holder, jurisdiction, validFrom, verification]
      properties:
        id: { $ref: "#/components/schemas/PartyReference" }
        type: { $ref: "#/components/schemas/ContentLabel" }
        holder: { $ref: "#/components/schemas/PartyReference" }
        jurisdiction: { $ref: "#/components/schemas/JurisdictionId" }
        taxTypes:
          type: array
          items: { $ref: "#/components/schemas/ContentLabel" }
        components:
          type: array
          items: { $ref: "#/components/schemas/ContentLabel" }
        validFrom: { $ref: "#/components/schemas/CivilDate" }
        validTo: { $ref: "#/components/schemas/CivilDate" }
        verification: { $ref: "#/components/schemas/CertificateVerification" }

    TaxLinePart:
      type: object
      title: TaxLinePart
      description: One component of an approved bundle decomposition.
      additionalProperties: false
      required: [key, amount]
      properties:
        key: { $ref: "#/components/schemas/ContentLabel" }
        service: { $ref: "#/components/schemas/ServiceFamily" }
        amount: { $ref: "#/components/schemas/Decimal" }
        quantity: { $ref: "#/components/schemas/QuantityValue" }

    TaxLine:
      type: object
      title: TaxLine
      description: |
        One rated line, in the document currency. A bundle line carries
        `parts` instead of its own `service` and `quantity`, and the parts
        must sum to `amount` exactly.
      additionalProperties: false
      required: [key, amount]
      properties:
        key: { $ref: "#/components/schemas/ContentLabel" }
        sku: { $ref: "#/components/schemas/ContentLabel" }
        service: { $ref: "#/components/schemas/ServiceFamily" }
        amount: { $ref: "#/components/schemas/Decimal" }
        quantity: { $ref: "#/components/schemas/QuantityValue" }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/SitusEvidenceItem" }
        parts:
          type: array
          items: { $ref: "#/components/schemas/TaxLinePart" }

    TaxDocument:
      type: object
      title: TaxDocument
      description: |
        A telecom document for location-aware determination: rated commercial
        facts, the parties, and the evidence of where the supply took place.
        It carries no tax; what is owed is the output. The tax point is the
        request's `eventTime`.
      additionalProperties: false
      required: [type, currency, priceMode, seller, customer, lines]
      properties:
        type: { $ref: "#/components/schemas/TaxDocumentType" }
        currency: { $ref: "#/components/schemas/CurrencyCode" }
        priceMode: { $ref: "#/components/schemas/PriceMode" }
        seller: { $ref: "#/components/schemas/TaxParty" }
        customer: { $ref: "#/components/schemas/TaxParty" }
        intermediaries:
          type: array
          description: |
            The other parties to the supply — a marketplace, wholesaler,
            reseller or the end user of a business customer's service — so a
            levy's responsibility can fall on them (ZTAX-OBL-REQ-0020). They
            do not change what is owed, only who holds each role for it. Each
            party is named once.
          maxItems: 8
          items: { $ref: "#/components/schemas/TaxIntermediary" }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/SitusEvidenceItem" }
        certificates:
          type: array
          items: { $ref: "#/components/schemas/ExemptionCertificate" }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/TaxLine" }

    DeterminationState:
      x-ztax-privacy: { class: P0 }
      type: string
      title: DeterminationState
      description: |
        `RESOLVED` is the only state that carries amounts. Every other state
        is recorded with its evidence and reason and is never a zero tax.
      enum: [RESOLVED, REVIEW_REQUIRED, UNSUPPORTED, AMBIGUOUS, CONFLICTED]
      example: RESOLVED

    Treatment:
      x-ztax-privacy: { class: P0 }
      type: string
      title: Treatment
      description: |
        `CUSTOMER_CHARGE` is on the invoice. `PROVIDER_COST` is borne by the
        seller and never on it. `REVERSE_CHARGE` is self-assessed by the
        customer: disclosed, neither charged nor remitted by the seller.
        `EXEMPT` is a customer charge a verified certificate suppressed.
      enum: [CUSTOMER_CHARGE, PROVIDER_COST, REVERSE_CHARGE, EXEMPT]
      example: CUSTOMER_CHARGE

    ResponsibleParty:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ResponsibleParty
      description: |
        Who the content places a role on: `NONE`, one party kind, or several
        separated by `|` in precedence order, the first present on the
        document holding the role. `MARKETPLACE|SELLER` is the marketplace
        when there is one, otherwise the seller. The resolved holder is in
        `GET /v1/decisions/{decisionId}/responsibility`.
      pattern: "^(NONE|(SELLER|BUYER|MARKETPLACE|WHOLESALER|RESELLER|END_USER)([|](SELLER|BUYER|MARKETPLACE|WHOLESALER|RESELLER|END_USER))*)$"
      example: SELLER

    ResponsibilityAssignment:
      type: object
      title: ResponsibilityAssignment
      description: The five roles, each answered separately (ZTAX-OBL-REQ-0002 to -0006).
      additionalProperties: false
      required: [id, incidence, collection, reporting, remittance, economicBearer]
      properties:
        id: { $ref: "#/components/schemas/ContentLabel" }
        incidence: { $ref: "#/components/schemas/ResponsibleParty" }
        collection: { $ref: "#/components/schemas/ResponsibleParty" }
        reporting: { $ref: "#/components/schemas/ResponsibleParty" }
        remittance: { $ref: "#/components/schemas/ResponsibleParty" }
        economicBearer: { $ref: "#/components/schemas/ResponsibleParty" }

    ExemptionApplied:
      type: object
      title: ExemptionApplied
      description: A charge a certificate suppressed, and the assessment it would have been.
      additionalProperties: false
      required: [certificate, type]
      properties:
        certificate: { $ref: "#/components/schemas/PartyReference" }
        type: { $ref: "#/components/schemas/ContentLabel" }
        assessed: { $ref: "#/components/schemas/Decimal" }

    TaxComponentResult:
      type: object
      title: TaxComponentResult
      description: |
        One charge on one line: its legal base, rate version, jurisdiction,
        authority, five roles, recoverability, rounding result and source.
        `charged` is what the customer pays for it.
      additionalProperties: false
      required: [id, version, regime, jurisdiction, authority, taxType, name, treatment, inclusive, rateKind, rate, raw, amount, charged, responsibility, source, citation]
      properties:
        id: { $ref: "#/components/schemas/ContentLabel" }
        version: { $ref: "#/components/schemas/CivilDate" }
        regime: { $ref: "#/components/schemas/ContentLabel" }
        jurisdiction: { $ref: "#/components/schemas/JurisdictionId" }
        authority: { $ref: "#/components/schemas/ContentLabel" }
        taxType: { $ref: "#/components/schemas/ContentLabel" }
        name: { $ref: "#/components/schemas/ContentText" }
        treatment: { $ref: "#/components/schemas/Treatment" }
        inclusive:
          x-ztax-privacy: { class: P0 }
          type: boolean
        rateKind: { $ref: "#/components/schemas/ContentLabel" }
        rate: { $ref: "#/components/schemas/Decimal" }
        unit: { $ref: "#/components/schemas/UnitCode" }
        base: { $ref: "#/components/schemas/Decimal" }
        raw: { $ref: "#/components/schemas/Decimal" }
        amount: { $ref: "#/components/schemas/Decimal" }
        charged: { $ref: "#/components/schemas/Decimal" }
        legalReason: { $ref: "#/components/schemas/ContentLabel" }
        responsibility: { $ref: "#/components/schemas/ResponsibilityAssignment" }
        exemption: { $ref: "#/components/schemas/ExemptionApplied" }
        source: { $ref: "#/components/schemas/ContentLabel" }
        citation: { $ref: "#/components/schemas/ContentText" }

    DeterminationItem:
      type: object
      title: DeterminationItem
      description: |
        One line, or one part of a bundle line (`key` is `<line>/<part>`):
        its state, the situs decision that placed it, and its components.
      additionalProperties: false
      required: [key, line, amount, state]
      properties:
        key: { $ref: "#/components/schemas/ContentLabel" }
        line: { $ref: "#/components/schemas/ContentLabel" }
        part: { $ref: "#/components/schemas/ContentLabel" }
        sku: { $ref: "#/components/schemas/ContentLabel" }
        service: { $ref: "#/components/schemas/ServiceFamily" }
        amount: { $ref: "#/components/schemas/Decimal" }
        state: { $ref: "#/components/schemas/DeterminationState" }
        reasonCode: { $ref: "#/components/schemas/ReasonCode" }
        situsOutcome: { $ref: "#/components/schemas/ContentLabel" }
        situsRule: { $ref: "#/components/schemas/ContentLabel" }
        applicable:
          type: array
          items: { $ref: "#/components/schemas/JurisdictionId" }
        placeOfSupply: { $ref: "#/components/schemas/JurisdictionId" }
        customerRole: { $ref: "#/components/schemas/ContentLabel" }
        supply: { $ref: "#/components/schemas/ContentLabel" }
        regime: { $ref: "#/components/schemas/ContentLabel" }
        neededEvidence:
          type: array
          items: { $ref: "#/components/schemas/ContentLabel" }
        net: { $ref: "#/components/schemas/Decimal" }
        components:
          type: array
          items: { $ref: "#/components/schemas/TaxComponentResult" }

    DocumentTotals:
      type: object
      title: DocumentTotals
      description: |
        The figures that must stay apart (playbook §7): what the customer is
        charged, what the provider bears, and what the customer self-assesses.
      additionalProperties: false
      required: [net, customerTax, customerTotal, providerAccrual, reverseCharge]
      properties:
        net: { $ref: "#/components/schemas/Decimal" }
        customerTax: { $ref: "#/components/schemas/Decimal" }
        customerTotal: { $ref: "#/components/schemas/Decimal" }
        providerAccrual: { $ref: "#/components/schemas/Decimal" }
        reverseCharge: { $ref: "#/components/schemas/Decimal" }

    DeterminationStep:
      type: object
      title: DeterminationStep
      description: One step of the deterministic trace — selection, situs, exemption and DET-001 evaluation steps.
      additionalProperties: false
      required: [step, detail]
      properties:
        item: { $ref: "#/components/schemas/ContentLabel" }
        component: { $ref: "#/components/schemas/ContentLabel" }
        step: { $ref: "#/components/schemas/ContentLabel" }
        detail:
