      enum: [TAX_SPECIALIST, LEGAL, SECURITY, FINANCE_OPERATIONS, ENGINEERING]

    SupportFact:
      x-ztax-privacy: { class: P0 }
      type: string
      title: SupportFact
      description: A fact triage needs before a case can be worked (SUP-02). `SELLER` is met by a legal entity or a seller reference.
      enum: [CONTRACT, FISCAL_PERIOD, SELLER]

    SupportClockState:
      x-ztax-privacy: { class: P0 }
      type: string
      title: SupportClockState
      description: |
        Where one clock stands now. The support SLA is ON_TRACK, AT_RISK (a
        quarter of its window or less left), BREACHED, or MET (answered in
        time). A statutory deadline is NONE, ON_TRACK, AT_RISK (72 hours or
        less left) or PASSED.
      enum: [NONE, ON_TRACK, AT_RISK, BREACHED, MET, PASSED]

    SupportNote:
      x-ztax-privacy: { class: P2, purposes: [PURP-SUPPORT], retention: RET-OPERATIONAL, redaction: REDACT, aiAllowed: NONE }
      type: string
      title: SupportNote
      minLength: 1
      maxLength: 2000
      description: Free text from the person acting — a response to the customer, a request, a sign-off or a note.

    SupportReference:
