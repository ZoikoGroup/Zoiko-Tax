      operationId: requestPeriodReopen
      tags: [subledger]
      summary: Ask to reopen a hard-closed period
      description: |
        `OPERATOR`. Records a request, with its reason, to reopen a
        hard-closed period. Nothing moves until someone else approves it
        (ZTAX-FIN-REQ-0091). A sealed period cannot be reopened.
      parameters:
