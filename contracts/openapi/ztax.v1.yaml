      properties:
        token:
          x-ztax-privacy: { class: P7, purposes: [PURP-SEC], retention: RET-TRANSIENT, redaction: NO_LOG, aiAllowed: NONE, evidencePolicy: NONE }
          type: string
          description: The secret from the emailed link, as it appears after `#set-password=`.
          example: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
        password:
          x-ztax-privacy: { class: P7, purposes: [PURP-SEC], retention: RET-TRANSIENT, redaction: NO_LOG, aiAllowed: NONE, evidencePolicy: NONE }
          type: string
          format: password
          minLength: 12
          example: "a considerably longer passphrase than that one"

    PasswordSet:
      type: object
      title: PasswordSet
      additionalProperties: false
