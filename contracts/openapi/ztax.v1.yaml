                ztx_retryable: false

    NotFound:
      description: |
        The resource does not exist, or is outside the caller's tenant. The two
        are one answer on purpose: distinguishing them would tell a caller what
        exists in a tenant they cannot see.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            notFound:
              summary: A user in another tenant
              value:
                type: https://errors.zoikotax.com/v1/not-found
                title: Not found
                status: 404
                detail: The referenced resource does not exist, or is outside the caller's tenant.
                instance: /v1/admin/users/ztu_01JBQ0S9C3X8Q1H6M2KX5R7F4Z/roles
                ztx_reason_code: NOT_FOUND
                ztx_request_id: 01JBQ0S9C3X8Q1H6M2KX5R7F4M
                ztx_retryable: false

    Conflict:
      description: A uniqueness violation, an optimistic conflict or a state-machine violation.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            lastAdmin:
              summary: Revoking the last administrator
              value:
                type: https://errors.zoikotax.com/v1/state-transition-invalid
                title: Invalid state transition
                status: 409
                detail: The requested transition is not permitted from the resource's current state.
                instance: /v1/admin/users/ztu_01JBQ0S9C3X8Q1H6M2KX5R7F4B/roles/ADMIN
                ztx_reason_code: STATE_TRANSITION_INVALID
                ztx_request_id: 01JBQ0S9C3X8Q1H6M2KX5R7F4N
                ztx_retryable: false

    Internal:
      description: |
        A defect. The cause is recorded and alerted; it is deliberately not in
        the response, because an error string from a driver carries table names,
        query fragments and values (ADR-0016 §2.6).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            internal:
              summary: An unclassified failure
              value:
                type: https://errors.zoikotax.com/v1/internal-error
                title: Internal error
                status: 500
                detail: An unexpected condition prevented the request from completing.
                instance: /v1/admin/users
                ztx_reason_code: INTERNAL_ERROR
                ztx_request_id: 01JBQ0S9C3X8Q1H6M2KX5R7F4P
                ztx_retryable: false

    Unavailable:
      description: |
        A transient failure. The request was not applied and may be retried
        unchanged — `ztx_retryable` is `true`, and `Retry-After` says when.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer, format: int32, minimum: 0 }
          example: 2
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          examples:
            databaseUnavailable:
              summary: The cell store was unreachable
              value:
