        - $ref: "#/components/parameters/NoticeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoticeAuthenticityRequest"
            examples:
              default:
                summary: Verified with the authority
                value:
                  authenticity: VERIFIED
                  evidence: Confirmed by phone on the authority's published number.
      responses:
        "200":
          $ref: "#/components/responses/NoticeResult"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

