  /v1/quotes:
    post:
      operationId: createQuote
      tags: [determination]
      summary: Quote a transaction without recording it
      description: |
        `OPERATOR` or `ANALYST`. Evaluates the input against the cell's active
        content bundle by exactly the path a commit takes, then discards it:
        no decision, no evidence, no idempotency record.

        **A quote is an estimate; only a commit is a decision** (ADR-0004
        §2.7). Every quote is `authoritative: false`, whatever the
        deployment's authorization level, and must not be filed or invoiced
        from.

        The input is named the way content reads it. Which values a line
        carries, and what they are called, is decided by the active pack, not
        by this contract — the worked pack reads `line.netAmount`,
        `line.quantity` and two flags, and a read set holding
        `threshold.ecoLevyYtd`. A value the pack reads and the request omits is
        a `400`; so is an accumulator the pack does not read.

        **Location-aware determination.** Against a pack with a taxation
        profile, send `document` instead of `input`. The cell resolves where
        each line was supplied from the evidence (JUR-001), selects the
        components in force there at `eventTime` for the line's service,
        customer role and supply, and evaluates them (DET-001). Every line ends
        in an explicit state: a missing location, an uncovered country, an
        unmapped SKU or an unverifiable certificate is a recorded
        `REVIEW_REQUIRED` or `UNSUPPORTED`, never a zero tax. Coverage is
        reported by `GET /v1/coverage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
            examples:
              standardLine:
                summary: One standard-rated line against the worked pack
                value:
                  eventTime: "2026-09-24T18:00:00.000000Z"
                  input:
                    money:
                      line.netAmount: { amount: "100.00", currency: EUR }
                    quantities:
                      line.quantity: { value: "3", unit: EA }
                    flags:
                      line.reducedRateApplies: false
                      line.exemptCertificateHeld: false
                  accumulators:
                    threshold.ecoLevyYtd: { amount: "9999.99", currency: EUR }
              mixedBundle:
                summary: Playbook §7's mixed bundle against the training pack
                value:
                  eventTime: "2026-10-15T12:00:00.000000Z"
                  document:
                    type: INVOICE
                    currency: USD
                    priceMode: EXCLUSIVE
                    seller: { id: TELCO-A, establishment: { country: XT } }
                    customer: { id: C1 }
                    evidence:
                      - { type: SERVICE_ADDRESS, source: SELLER_RECORDED, place: { country: XT } }
                    lines:
                      - key: L1
                        sku: BUNDLE-1
                        amount: "100.00"
                        parts:
                          - { key: voice, service: MOBILE_VOICE, amount: "40.00", quantity: { value: "1", unit: LINE } }
                          - { key: data, service: MOBILE_DATA, amount: "50.00" }
                          - { key: device, service: EQUIPMENT_SALE, amount: "10.00" }
      responses:
        "200":
          description: The estimate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
              examples:
                default:
                  summary: VAT and the eco levy, advisory
                  value:
                    authoritative: false
                    outcome: ADVISORY
                    reasonCode: NOT_AUTHORITATIVE
                    quotedAt: "2026-09-25T09:00:00.000000Z"
                    bundle:
                      bundleId: eu-vat-worked-2026.09
                      digest: "zt1:be8651b55057f0f11f2a39820495b373417e5aa81b122f61b9fcb79faaf86c7b"
                      irVersion: 1
                    emitted:
                      TAX_VAT: { type: MONEY, amount: "21.00", currency: EUR }
                      TAX_ECO_LEVY: { type: MONEY, amount: "0.11", currency: EUR }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/transactions:commit:
    post:
      operationId: commitTransaction
      tags: [determination]
      summary: Commit a transaction and record its decision
      description: |
        `OPERATOR` only. Evaluates the input against the active content bundle
        and records the result as an immutable decision, with the two evidence
        objects that let it replay exactly (ADR-0011 §2.8).

        **`Idempotency-Key` is mandatory** (ADR-0013 §2.1). A retry with the
        same key and the same body returns the original response verbatim,
        with `Idempotent-Replay: true`, and records nothing new. The same key
        with a different body is `409 IDEMPOTENCY_KEY_REUSE`; a key whose first
        request is still running is `409 REQUEST_IN_PROGRESS` with
        `Retry-After`. Neither executes. Bodies are compared in canonical form,
        so member order and whitespace do not matter and a decimal's scale
        does — `"45.00"` and `"45.0"` are different requests.

        A validation failure is recorded against the key and replayed on
        retry, because the same request fails the same way. A transient
        failure (`503`) is not: the key is released and a retry is a genuine
        new attempt.

        `supersedes` corrects an earlier decision for the same `businessKey`.
        It must name the current version; a decision is never edited, and a
        correction is a new decision linked to the old (ADR-0003).

        When the active content binds its accumulators to the cell (a
        bundle fiscal profile), the cell reads them under lock before
        evaluating, records this decision's contribution, and posts the
        decision to the Tax Control Subledger, all in this request's
        transaction. A request that supplies a value for a bound accumulator
        is refused with `400 INVALID_VALUE`: the store is the source
        (ZTAX-DET-REQ-0002). `accumulators` remains for content that reads a
        value the cell does not hold.

        Before A4 every decision is `ADVISORY` and `authoritative: false`.

        A `document` commit records the document, every line's situs decision
        and components, and the totals in the envelope and result, so a replay
        reproduces it exactly under the content that made it. A decision whose
        document is not `RESOLVED` is recorded and emits nothing: it posts no
        journal and assesses no obligation.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitRequest"
            examples:
              standardLine:
                summary: One standard-rated line against the worked pack
                value:
                  businessKey: INV-0001/1
                  eventTime: "2026-09-24T18:00:00.000000Z"
                  input:
                    money:
                      line.netAmount: { amount: "100.00", currency: EUR }
                    quantities:
                      line.quantity: { value: "3", unit: EA }
                    flags:
                      line.reducedRateApplies: false
                      line.exemptCertificateHeld: false
              crossBorderBusiness:
                summary: A business customer established abroad, against a pack with location-aware content
                value:
                  businessKey: INV-0002/1
                  eventTime: "2026-10-15T12:00:00.000000Z"
                  document:
                    type: INVOICE
                    currency: EUR
                    priceMode: EXCLUSIVE
                    seller: { id: TELCO-DE, establishment: { country: DE } }
                    customer:
                      id: ACME-FR
                      establishment: { country: FR }
                      vat: { country: FR, validation: VALIDATED }
                    lines:
                      - { key: L1, sku: SIP-100, service: SIP_TRUNKING, amount: "250.00" }
      responses:
        "201":
          description: |
            The recorded decision. A replayed response carries
            `Idempotent-Replay: true` and is byte-for-byte the original.
          headers:
            Idempotent-Replay:
              description: Present, and `true`, when this is the stored response to an earlier request with the same key.
              schema: { type: boolean }
              example: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
              examples:
                default:
                  summary: An advisory decision
                  value:
                    id: 01920a4b-7c3e-7d21-9f40-3c1a2b4d5e6f
                    businessKey: INV-0001/1
                    authoritative: false
                    outcome: ADVISORY
                    reasonCode: NOT_AUTHORITATIVE
                    eventTime: "2026-09-24T18:00:00.000000Z"
                    recordedAt: "2026-09-25T09:00:00.000000Z"
                    bundle:
                      bundleId: eu-vat-worked-2026.09
                      digest: "zt1:be8651b55057f0f11f2a39820495b373417e5aa81b122f61b9fcb79faaf86c7b"
                      irVersion: 1
                    digests:
                      input: "zt1:4b2d1e0f9a8c7b6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d"
                      envelope: "zt1:9c8d7e6f5a4b3c2d1e0f4b2d1e0f9a8c7b6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f"
                      result: "zt1:1a0b9c8d7e6f5a4b3c2d4b2d1e0f9a8c7b6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f"
                    emitted:
                      TAX_VAT: { type: MONEY, amount: "21.00", currency: EUR }
                      TAX_ECO_LEVY: { type: MONEY, amount: "0.11", currency: EUR }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/transactions:adjust:
    post:
      operationId: adjustTransaction
      tags: [determination]
      summary: Correct a recorded decision under the content that made it
      description: |
        `OPERATOR` only. Records a CORRECTION of an earlier decision
        (ZTAX-DET-001 §10.4) as a new decision superseding it. `supersedes` is
        required and must name the current version for the `businessKey`.

        The correction is evaluated against the content bundle that made the
        decision it supersedes — the bundle its replay envelope names — and
        never against the active one (ZTAX-DET-REQ-0030). A credit issued
        today against an invoice from an earlier content release corrects tax
        charged under that release's rates and rules. If that bundle is not
        loaded in the cell, the request is refused with
        `503 NO_CONTENT_BUNDLE` and nothing is recorded; it is never quietly
        re-evaluated under current content.

        Idempotency works as on `:commit`, with its own key scope: the same
        `Idempotency-Key` value on `:commit` and `:adjust` names two different
        keys (ADR-0013 §2.2).

        Before A4 every decision is `ADVISORY` and `authoritative: false`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitRequest"
            examples:
              correction:
                summary: Correct line 1's net amount
                value:
                  businessKey: INV-0001/1
                  supersedes: 01920a4b-7c3e-7d21-9f40-3c1a2b4d5e6f
                  eventTime: "2026-09-24T18:00:00.000000Z"
                  input:
                    money:
                      line.netAmount: { amount: "50.00", currency: EUR }
                    quantities:
                      line.quantity: { value: "3", unit: EA }
                    flags:
                      line.reducedRateApplies: false
                      line.exemptCertificateHeld: false
      responses:
        "201":
          description: |
            The recorded correction. A replayed response carries
            `Idempotent-Replay: true` and is byte-for-byte the original.
          headers:
            Idempotent-Replay:
              description: Present, and `true`, when this is the stored response to an earlier request with the same key.
              schema: { type: boolean }
              example: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
              examples:
                default:
                  summary: An advisory correction, made under the original bundle
                  value:
                    id: 01920a4c-1d2e-7f30-8a41-5b6c7d8e9f01
                    businessKey: INV-0001/1
                    supersedes: 01920a4b-7c3e-7d21-9f40-3c1a2b4d5e6f
                    authoritative: false
                    outcome: ADVISORY
                    reasonCode: NOT_AUTHORITATIVE
                    eventTime: "2026-09-24T18:00:00.000000Z"
                    recordedAt: "2026-10-03T09:00:00.000000Z"
                    bundle:
                      bundleId: eu-vat-worked-2026.09
                      digest: "zt1:be8651b55057f0f11f2a39820495b373417e5aa81b122f61b9fcb79faaf86c7b"
                      irVersion: 1
                    digests:
                      input: "zt1:5c3e2f1a0b9c8d7e6f4b2d1e0f9a8c7b6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a"
                      envelope: "zt1:0d9e8f7a6b5c4d3e2f1a5c3e2f1a0b9c8d7e6f4b2d1e0f9a8c7b6d5e4f3a2b1c"
                      result: "zt1:2b1c0d9e8f7a6b5c4d3e5c3e2f1a0b9c8d7e6f4b2d1e0f9a8c7b6d5e4f3a2b1c"
                    emitted:
                      TAX_VAT: { type: MONEY, amount: "10.50", currency: EUR }
                      TAX_ECO_LEVY: { type: MONEY, amount: "0.11", currency: EUR }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/transactions:refund:
    post:
      operationId: refundTransaction
      tags: [refunds]
      summary: Refund tax a committed decision charged
      description: |
        `OPERATOR` only. Records a refund of tax charged by a committed
        decision. A refund is **not** a decision and not a credit
        (ZTAX-FIN-REQ-0015): nothing is re-determined, the decision is never
        rewritten, and the refund has a lifecycle of its own
        (ZTAX-FIN-REQ-0059). ZoikoTax moves no money; this records that a
        payment provider has been, or will be, asked to return it.

        The decision must be the current version of its business key, and the
        amount at most the tax that decision posted to
        `TAX_COLLECTED_LIABILITY` in that currency, less every earlier refund
        of it that has not `FAILED`. An `UNCERTAIN` refund still counts: it
        may have paid. A request beyond what is refundable is refused with
        `400 INVALID_VALUE`, and the response says how much is left.

        The refund is created `REQUESTED` and posts nothing. Only a provider
        report of `SUCCEEDED` (see `POST /v1/refunds/{refundId}/reports`)
        posts the `REFUND` journal.

        `Idempotency-Key` is required, scoped apart from `:commit` and
        `:adjust` (ADR-0013 §2.2).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundRequest"
            examples:
              default:
                summary: Refund the VAT on one line
                value:
                  decisionId: 01920a4b-7c3e-7d21-9f40-3c1a2b4d5e6f
                  amount: { amount: "10.50", currency: EUR }
                  paymentReference: "psp:ch_3Nf0a1"
                  reason: Customer cancelled within the cooling-off period.
      responses:
        "201":
          description: |
            The refund, `REQUESTED`. A replayed response carries
            `Idempotent-Replay: true` and is byte-for-byte the original.
          headers:
            Idempotent-Replay:
              description: Present, and `true`, when this is the stored response to an earlier request with the same key.
              schema: { type: boolean }
              example: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
              examples:
                default:
                  summary: A requested refund
                  value:
                    id: 01920a50-2a3b-7c4d-8e5f-6a7b8c9d0e1f
                    decisionId: 01920a4b-7c3e-7d21-9f40-3c1a2b4d5e6f
                    legalEntityId: 01920a4c-0000-7000-8000-00000000e001
                    amount: { amount: "10.50", currency: EUR }
                    paymentReference: "psp:ch_3Nf0a1"
                    reason: Customer cancelled within the cooling-off period.
                    status: REQUESTED
                    requestedAt: "2026-10-07T10:00:00.000000Z"
                    requestedBy: 01920a40-aaaa-7bbb-8ccc-000000000d01
                    history:
                      - seq: 1
                        status: REQUESTED
                        recordedAt: "2026-10-07T10:00:00.000000Z"
                        recordedBy: 01920a40-aaaa-7bbb-8ccc-000000000d01
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

