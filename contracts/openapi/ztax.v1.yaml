      summary: Record the completeness checklist
      description: |
        `ANALYST`, signed in as themselves.

        Records the completeness checklist against the current evidence version
        of a `SUBMITTED` certificate (EER-10). `DOCUMENT_COMPLETE` needs every
        criterion to pass or not apply, and is refused for a document already
        past its expiry (T15-13A); it and `NEEDS_LEGAL_DECISION` move the
        certificate to `REVIEW_REQUIRED`. `INCOMPLETE` and `INCONSISTENT` name a
        failed criterion and say what is wrong; the certificate waits in
        `SCREENING` for a corrected document. Complete is not approved.
      parameters:
        - $ref: "#/components/parameters/ExemptionEvidenceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExemptionScreeningRequest"
            examples:
              default:
                summary: Unsigned
                value:
                  screening: { sellerMatches: PASS, buyerMatches: PASS, jurisdictionMatches: PASS, formAccepted: PASS, signaturePresent: FAIL, datesValid: PASS, numberPresent: PASS, result: INCOMPLETE }
                  note: The buyer did not sign section 4
      responses:
        "200":
          $ref: "#/components/responses/ExemptionEvidenceResult"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/exemptions/{certificateId}/recommendation:
    post:
      operationId: recommendExemptionCertificate
      tags: [registrations]
      summary: Recommend approval or rejection (the maker)
      description: |
        `ANALYST`, signed in as themselves.

        The maker's half of a decision on a `REVIEW_REQUIRED` certificate, with
        its rationale: approve or reject the current evidence version. An
        approval states the period the certificate is evidence for, from no
        earlier than its issue date and ending no later than its expiry; an
        already-expired certificate is not recommended for approval. Nothing is
        decided until a different person confirms it.
      parameters:
        - $ref: "#/components/parameters/ExemptionEvidenceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExemptionRecommendationRequest"
            examples:
              default:
                summary: Approve for the certificate's own dates
                value:
                  recommendation: APPROVE
                  effectiveFrom: "2026-09-15"
                  effectiveTo: "2027-09-14"
                  rationale: ST-120 complete; buyer and seller match
      responses:
        "200":
          $ref: "#/components/responses/ExemptionEvidenceResult"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/exemptions/{certificateId}/decision:
    post:
      operationId: decideExemptionCertificate
      tags: [registrations]
      summary: Confirm or return the recommendation (the checker)
      description: |
        `ANALYST`, signed in as themselves.

        The checker's half: `CONFIRM` publishes the pending recommendation —
        `APPROVED` or `REJECTED` — and `RETURN` sends it back with a reason. The
        checker names the evidence version they reviewed; any other is
        `409 VERSION_CONFLICT` and nothing is published (ER-042, XC-08). The
        checker is neither the recommender nor the person who recorded the
        current document (`403 MAKER_CHECKER`; ER-041). Confirming a renewal's
        approval supersedes the certificate it renews.

        `APPROVED` is evidence for one buyer, seller entity, jurisdiction and
        period. It is not a tax exemption: the determination engine decides
        applicability from its own approved rules, and nothing committed is
        rewritten (T15-13C; ER-033).
      parameters:
        - $ref: "#/components/parameters/ExemptionEvidenceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExemptionDecisionRequest"
            examples:
              default:
                summary: Confirm on version 1
                value:
                  decision: CONFIRM
                  expectedEvidenceVersion: 1
                  note: Checked against the original
      responses:
        "200":
          $ref: "#/components/responses/ExemptionEvidenceResult"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/exemptions/{certificateId}/transitions:
    post:
      operationId: transitionExemptionCertificate
      tags: [registrations]
      summary: Suspend, reinstate, expire or revoke an approved certificate
      description: |
        `ANALYST`, signed in as themselves.

        `SUSPENDED` from `APPROVED`; `APPROVED` from `SUSPENDED` (reinstatement,
        by someone other than the suspender, while the evidence period lasts);
        `EXPIRED` from either once the evidence period has ended; `REVOKED` from
        either. Every move but `EXPIRED` gives its reason. Expiry and revocation
        block future use only: history stays as recorded, and an expired or
        revoked certificate is never resumed — a renewal is a new certificate
        reviewed afresh (ER-038, ER-039).
      parameters:
        - $ref: "#/components/parameters/ExemptionEvidenceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExemptionTransitionRequest"
            examples:
              default:
                summary: Suspend pending a name-change check
                value:
                  to: SUSPENDED
                  reason: Buyer reported a change of legal name
      responses:
        "200":
          $ref: "#/components/responses/ExemptionEvidenceResult"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/regulatory-changes:
    get:
      operationId: listRegulatoryChanges
      tags: [regulatory-changes]
      summary: The regulatory change feed
      description: |
        `OPERATOR`, `ANALYST` or `AUDITOR`.

        Recorded regulatory changes, newest first, in any status: a change that
        was closed or found not to apply stays listed with its disposition and
        rationale (Doc 03 Z03-AT-09). A listing carries no related changes or
        assessment summary; the detail read does.
      parameters:
        - name: status
          in: query
          required: false
          description: Only changes in this status.
          schema: { $ref: "#/components/schemas/RegulatoryChangeStatus" }
          example: TRIAGED
        - name: kind
          in: query
          required: false
          description: Only changes of this kind.
          schema: { $ref: "#/components/schemas/RegulatoryChangeKind" }
          example: RATE_CHANGE
        - name: jurisdiction
          in: query
          required: false
          description: Only changes in this jurisdiction; a country matches its subdivisions.
          schema: { $ref: "#/components/schemas/EvidenceJurisdiction" }
          example: US
        - name: priority
          in: query
          required: false
          description: Only changes triaged at this priority.
          schema: { $ref: "#/components/schemas/RegulatoryChangePriority" }
          example: URGENT
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegulatoryChangeList"
              examples:
                default:
                  summary: One triaged rate change
                  value:
                    changes:
                      - id: 01920e10-1a2b-7c3d-8e4f-5a6b7c8d9e01
                        jurisdiction: US-NY
                        kind: RATE_CHANGE
                        title: New York excise on mobile voice rises
                        source: { authority: New York State Department of Taxation and Finance, citation: N.Y. Tax Law §186-e, edition: TB-ST-2026-11, documentSha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08 }
                        publishedOn: "2026-11-01"
                        effectiveFrom: "2027-01-01"
                        discoveredAt: "2026-11-02T08:00:00.000000Z"
                        detectedBy: HUMAN
                        serviceFamilies: [MOBILE_VOICE]
                        taxTypes: [SALES_TAX]
                        retroactive: false
                        status: TRIAGED
                        priority: MATERIAL
                        version: 2
                        sourceKey: zt1:5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8
                        relatedChangeIds: []
                        recommendationCount: 0
                        acceptedRecommendationCount: 0
                        history:
                          - { seq: 1, kind: RECORDED, status: NEW, recordedAt: "2026-11-02T08:05:00.000000Z", recordedBy: 01920a4c-0000-7000-8000-0000000000a1 }
                          - { seq: 2, kind: TRIAGED, status: TRIAGED, priority: MATERIAL, reason: Rate rise on a covered levy, recordedAt: "2026-11-02T09:00:00.000000Z", recordedBy: 01920a4c-0000-7000-8000-0000000000a2 }
                        createdAt: "2026-11-02T08:05:00.000000Z"
                        createdBy: 01920a4c-0000-7000-8000-0000000000a1
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: recordRegulatoryChange
      tags: [regulatory-changes]
      summary: Record a regulatory change from a source edition
      description: |
        `OPERATOR` or `ANALYST`, signed in as themselves.

        Records a reported change as `NEW`: the authority, jurisdiction,
        citation, edition and the SHA-256 of the captured source document
        (hashed in the browser; nothing is uploaded), its kind (Doc 03 §06), and
        three separate clocks — published, effective and discovered — never
        assumed equal (Z03-AT-10). A `MONITOR` change names the watcher alert it
        was recorded from; no watcher is connected to this cell, so a person
        records it. A `BACKDATED_RULE` takes effect before it was published. A
        missing source digest or effective date is `400` before anything is
        recorded.

        A change is one legal effect of one source edition. A source with two
        effects is recorded as two changes of different kinds, linked by
        `sourceKey`. The same source edition's change of the same kind reported
        again returns the change already recorded with `200`; with different
        particulars it is `409 CHANGE_DEDUPE_CONFLICT`.

        **Idempotent on the `Idempotency-Key`**: the same key and request return
        the change with `200`; the same key with a different request is
        `409 IDEMPOTENCY_KEY_REUSE`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegulatoryChangeRequest"
            examples:
              default:
                summary: A New York rate change from a technical bulletin
                value:
                  jurisdiction: US-NY
                  kind: RATE_CHANGE
                  title: New York excise on mobile voice rises
                  summary: The excise rate on mobile voice rises from 2.5% to 2.9% from 1 January 2027.
                  source: { authority: New York State Department of Taxation and Finance, citation: N.Y. Tax Law §186-e, url: "https://www.tax.ny.gov/pubs_and_bulls/tg_bulletins/", edition: TB-ST-2026-11, documentSha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08 }
                  publishedOn: "2026-11-01"
                  effectiveFrom: "2027-01-01"
                  detectedBy: HUMAN
                  serviceFamilies: [MOBILE_VOICE]
                  taxTypes: [SALES_TAX]
      responses:
        "201":
          $ref: "#/components/responses/RegulatoryChangeResult"
        "200":
          $ref: "#/components/responses/RegulatoryChangeResult"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/regulatory-changes/{changeId}:
    get:
      operationId: getRegulatoryChange
      tags: [regulatory-changes]
      summary: One regulatory change with its history
      description: |
        `OPERATOR`, `ANALYST` or `AUDITOR`.

        The change with every triage, hold and disposition, the other changes
        recorded from the same source edition, its current assessment's
        severity and how many recommendations on that assessment were
        accepted.
      parameters:
        - $ref: "#/components/parameters/RegulatoryChangeId"
      responses:
        "200":
          $ref: "#/components/responses/RegulatoryChangeResult"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/regulatory-changes/{changeId}/transitions:
    post:
      operationId: transitionRegulatoryChange
      tags: [regulatory-changes]
      summary: Triage, hold, resume or decide a regulatory change
      description: |
        `ANALYST`, signed in as themselves. Every act gives its rationale and
        names the `version` read; anything recorded since is
        `409 VERSION_CONFLICT`.

        `TRIAGED` from `NEW`, with a `priority`. `ON_HOLD` from any open status,
        with a `holdReason`; a held change resumes to the status it was held
        from before anything else is decided. `NO_IMPACT` (disposition
        `NOT_APPLICABLE`) from `NEW`, `TRIAGED` or `IN_IMPACT_ASSESSMENT`.
        `CLOSED` from `IN_IMPACT_ASSESSMENT` with disposition `MONITOR`, or
        `CHANGE_NEEDED` once a recommendation on the current assessment has been
        independently accepted. `IN_IMPACT_ASSESSMENT` is never named: running
        an assessment makes it.

        Closing a change publishes, approves and changes nothing: a change that
        needs a rule change is handed off by its accepted recommendation.
      parameters:
        - $ref: "#/components/parameters/RegulatoryChangeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegulatoryChangeTransitionRequest"
            examples:
              default:
                summary: Triage a change as material
                value:
                  to: TRIAGED
                  priority: MATERIAL
                  reason: Rate rise on a covered levy; specialist triage within one business day
                  expectedVersion: 1
      responses:
        "200":
          $ref: "#/components/responses/RegulatoryChangeResult"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/regulatory-changes/{changeId}/assessments:
    post:
      operationId: assessRegulatoryChange
      tags: [regulatory-changes]
      summary: Run the deterministic impact assessment of a triaged change
      description: |
        `ANALYST`, signed in as themselves.

        Assesses the change against the active content bundle's coverage at the
        change's effective date and the tenant's own registrations and
        obligations: every content component in scope, or the coverage gap when
        none is; every open registration in the jurisdiction; every open
        obligation whose period ends on or after the effective date, marked
        retrospective where a backdated change reaches into it. Each item has a
        severity and its exact basis. The `inputsDigest` covers everything read
        and the `assessmentDigest` what was found, so the same inputs give the
        same assessment: assessing again on unchanged inputs records nothing and
        returns the current assessment with `200`. On changed inputs a new
        current assessment is recorded with `201`, and recommendations on the
        old one can no longer be recommended or reviewed.

        The first assessment moves a `TRIAGED` change to `IN_IMPACT_ASSESSMENT`.
        An assessment is a read: it writes no tax decision, ledger posting or
        filing (Z03-AT-17). A cell with no active content is
        `503 NO_CONTENT_BUNDLE`.
      parameters:
        - $ref: "#/components/parameters/RegulatoryChangeId"
      responses:
        "201":
          $ref: "#/components/responses/ImpactAssessmentResult"
        "200":
          $ref: "#/components/responses/ImpactAssessmentResult"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/impact-assessments:
    get:
      operationId: listImpactAssessments
      tags: [regulatory-changes]
      summary: Tax impact assessments
      description: |
        `OPERATOR`, `ANALYST` or `AUDITOR`.

        Assessments newest first — of one change, or the tenant's — each saying
        whether it is its change's current assessment.
      parameters:
        - name: changeId
          in: query
          required: false
          description: Only the assessments of this change.
          schema: { $ref: "#/components/schemas/RegulatoryChangeId" }
          example: 01920e10-1a2b-7c3d-8e4f-5a6b7c8d9e01
        - name: minSeverity
          in: query
          required: false
          description: Only assessments of at least this severity.
          schema: { $ref: "#/components/schemas/ImpactSeverity" }
          example: HIGH
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The assessments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactAssessmentList"
              examples:
                default:
                  summary: No assessments yet
                  value:
                    assessments: []
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/impact-assessments/{assessmentId}:
    get:
      operationId: getImpactAssessment
      tags: [regulatory-changes]
      summary: One impact assessment with its items and basis
      description: |
        `OPERATOR`, `ANALYST` or `AUDITOR`.

        The assessment, verified against its digest before it is returned: a
        stored assessment whose items no longer match its digest is
        `500 EVIDENCE_INTEGRITY` and is not shown.
      parameters:
        - $ref: "#/components/parameters/ImpactAssessmentId"
      responses:
        "200":
          $ref: "#/components/responses/ImpactAssessmentResult"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/review-recommendations:
    get:
      operationId: listReviewRecommendations
      tags: [regulatory-changes]
      summary: Review recommendations
      description: |
        `OPERATOR`, `ANALYST` or `AUDITOR`.

        Recommendations newest first, each with its change's current assessment
        so a recommendation overtaken by a reassessment shows `stale`.
      parameters:
        - name: status
          in: query
          required: false
          description: Only recommendations in this status.
          schema: { $ref: "#/components/schemas/ReviewRecommendationStatus" }
          example: RECOMMENDED
        - name: changeId
          in: query
          required: false
          description: Only the recommendations on this change.
          schema: { $ref: "#/components/schemas/RegulatoryChangeId" }
          example: 01920e10-1a2b-7c3d-8e4f-5a6b7c8d9e01
        - name: origin
          in: query
          required: false
          description: Only HUMAN or only AI_ASSISTED recommendations.
          schema: { $ref: "#/components/schemas/ReviewRecommendationOrigin" }
          example: AI_ASSISTED
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: The recommendations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewRecommendationList"
              examples:
                default:
                  summary: No recommendations yet
                  value:
                    recommendations: []
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }
    post:
      operationId: draftReviewRecommendation
      tags: [regulatory-changes]
      summary: Draft a review recommendation on a change's current assessment
      description: |
        `ANALYST`, signed in as themselves.

        Drafts a recommendation — `UPDATE_RULE`, `ADD_RULE`, `RETIRE_RULE`,
        `NOTIFY_CUSTOMERS`, `RETROSPECTIVE_REASSESSMENT`, `MONITOR` or
        `NO_ACTION` — with its rationale and the assessed items it is about,
        bound to the assessment's digest. The change is `IN_IMPACT_ASSESSMENT`
        and the assessment is its current one, else
        `409 ASSESSMENT_SUPERSEDED`. Targets are items the assessment found, of
        the kind the action needs.

        `AI_ASSISTED` records the model's provenance — use case, model, provider
        and prompt profiles, AI release train, the invocation and the model's
        original text, kept unchanged as evidence — at authority `A1` (propose)
        only (ZTAX-AIGOV-001 §4, §14). The rationale is the person's own. AI
        never counts as the recommender or the reviewer.

        **Idempotent on the `Idempotency-Key`**.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRecommendationRequest"
            examples:
              default:
                summary: An AI-assisted rule update recommendation
                value:
                  assessmentId: 01920e20-1a2b-7c3d-8e4f-5a6b7c8d9e01
                  origin: AI_ASSISTED
                  action: UPDATE_RULE
                  rationale: The NY excise component's rate rises on 1 January 2027; the rule needs a new version from that date.
                  targets: [{ kind: CONTENT_COMPONENT, ref: us-ny-excise }]
                  ai: { useCase: regulatory-change-recommendation, modelProfile: model-profile-a, providerProfile: provider-profile-a, promptProfile: rcr-v1, aiTrainVersion: "2026.11", authorityOutcome: A1, draft: Update the NY excise component rate from 1 January 2027. }
      responses:
        "201":
          $ref: "#/components/responses/ReviewRecommendationResult"
        "200":
          $ref: "#/components/responses/ReviewRecommendationResult"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/review-recommendations/{recommendationId}:
    get:
      operationId: getReviewRecommendation
      tags: [regulatory-changes]
      summary: One review recommendation with its history
      description: |
        `OPERATOR`, `ANALYST` or `AUDITOR`.

        The recommendation with every version of its text, its recommendation,
        its independent review and, once accepted, its `handoffRef`.
      parameters:
        - $ref: "#/components/parameters/ReviewRecommendationId"
      responses:
        "200":
          $ref: "#/components/responses/ReviewRecommendationResult"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/review-recommendations/{recommendationId}/revisions:
    post:
      operationId: reviseReviewRecommendation
      tags: [regulatory-changes]
      summary: Revise a draft or a recommendation returned for changes
      description: |
        `ANALYST`, signed in as themselves.

        Replaces what a `DRAFT` or `CHANGES_REQUESTED` recommendation says. The
        earlier text stays in the history, and the reviser may not review it.
      parameters:
        - $ref: "#/components/parameters/ReviewRecommendationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRecommendationRevisionRequest"
            examples:
              default:
                summary: Cite the new rate
                value:
                  action: UPDATE_RULE
                  rationale: The NY excise rate rises from 2.5% to 2.9% on 1 January 2027 (TB-ST-2026-11).
                  targets: [{ kind: CONTENT_COMPONENT, ref: us-ny-excise }]
                  expectedVersion: 3
      responses:
        "200":
          $ref: "#/components/responses/ReviewRecommendationResult"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/review-recommendations/{recommendationId}/recommend:
    post:
      operationId: recommendReviewRecommendation
      tags: [regulatory-changes]
      summary: Recommend a draft for independent review
      description: |
        `ANALYST`, signed in as themselves.

        A specialist's recommendation of a `DRAFT`, with the reason, on the
        change's current assessment (`409 ASSESSMENT_SUPERSEDED` otherwise). It
        then awaits an independent review.
      parameters:
        - $ref: "#/components/parameters/ReviewRecommendationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRecommendationActRequest"
            examples:
              default:
                summary: Recommend
                value:
                  reason: Checked against the bulletin and the current component version.
                  expectedVersion: 1
      responses:
        "200":
          $ref: "#/components/responses/ReviewRecommendationResult"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/review-recommendations/{recommendationId}/review:
    post:
      operationId: reviewReviewRecommendation
      tags: [regulatory-changes]
      summary: Independently review a recommended recommendation
      description: |
        `ANALYST`, signed in as themselves, and neither the recommender nor
        anyone who wrote a version of it (`403 MAKER_CHECKER`).

        `ACCEPT`, `REJECT` or `REQUEST_CHANGES` a `RECOMMENDED` recommendation,
        with the reason, on its exact version and the change's current
        assessment. `ACCEPT` records an opaque `handoffRef` a later rule-approval
        workflow can name. Acceptance publishes no release pack and changes no
        rule, content or tax result (Sidebar WF-02).
      parameters:
        - $ref: "#/components/parameters/ReviewRecommendationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRecommendationReviewRequest"
            examples:
              default:
                summary: Accept
                value:
                  decision: ACCEPT
                  reason: Independent review agrees with the basis and the target component.
                  expectedVersion: 2
      responses:
        "200":
          $ref: "#/components/responses/ReviewRecommendationResult"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

  /v1/review-recommendations/{recommendationId}/withdrawal:
    post:
      operationId: withdrawReviewRecommendation
      tags: [regulatory-changes]
      summary: Withdraw an open recommendation
      description: |
        `ANALYST`, signed in as themselves. Withdraws a recommendation that is
        not accepted, rejected or already withdrawn, with the reason — for
        example one overtaken by a reassessment.
      parameters:
        - $ref: "#/components/parameters/ReviewRecommendationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRecommendationActRequest"
            examples:
              default:
                summary: Withdraw after a reassessment
                value:
                  reason: Superseded by the reassessment after the registration changed.
                  expectedVersion: 2
      responses:
        "200":
          $ref: "#/components/responses/ReviewRecommendationResult"
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/Internal" }
        "503": { $ref: "#/components/responses/Unavailable" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ztax_session
      description: |
        An opaque, server-side session. The cookie is `HttpOnly` and
        `SameSite=Strict`, so it is sent by a browser automatically and is not
        readable by script. There is no bearer token and no JWT: a token a
        client can read is a token a client can leak, and a stateless token
        cannot be revoked (ADR-0020).

        On plain HTTP in local development the cookie is named `ztax_session`,
        because a browser silently drops a `__Host-` cookie that is not
        `Secure`.

  parameters:
    RegulatoryChangeId:
      name: changeId
      in: path
      required: true
      description: The regulatory change identifier.
      schema: { $ref: "#/components/schemas/RegulatoryChangeId" }
      example: 01920e10-1a2b-7c3d-8e4f-5a6b7c8d9e01

    ImpactAssessmentId:
