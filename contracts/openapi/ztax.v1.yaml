    ClassificationProposalId:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ClassificationProposalId
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
      example: 01920a4d-5a6b-7c8d-9e0f-1a2b3c4d5e6f

    ClassificationDecisionAction:
      x-ztax-privacy: { class: P0 }
      type: string
      title: ClassificationDecisionAction
      enum: [ACCEPT, REJECT, MODIFY, ESCALATE]

    ClassificationDecisionRequest:
      type: object
      title: ClassificationDecisionRequest
      description: |
        A reviewer's decision. It names no reviewer and no tenant: both come from the session.
        `modifiedCode` is required for `MODIFY` and refused for every other action.
        The proposal id, subject reference, proposed code and evidence id are stated by the caller; the service does not store or verify the proposal they refer to.
      additionalProperties: false
      required: [proposalId, subjectRef, proposedCode, action, reason]
      properties:
        proposalId: { $ref: "#/components/schemas/ClassificationProposalId" }
        subjectRef:
          x-ztax-privacy: { class: P0 }
          type: string
          minLength: 1
          maxLength: 512
        proposedCode:
          x-ztax-privacy: { class: P0 }
          type: string
          maxLength: 256
          description: The code the AI proposed, `ontology:...`.
        action: { $ref: "#/components/schemas/ClassificationDecisionAction" }
        reason:
          x-ztax-privacy: { class: P2, purposes: [PURP-AI-ASSIST, PURP-EVID], retention: RET-EVIDENCE, redaction: NO_LOG, aiAllowed: NONE }
          type: string
          minLength: 1
          maxLength: 500
          description: Why the reviewer decided this. Free text; never logged. Retention is set by the evidence retention decision, not yet decided.
        note:
          x-ztax-privacy: { class: P2, purposes: [PURP-AI-ASSIST, PURP-EVID], retention: RET-EVIDENCE, redaction: NO_LOG, aiAllowed: NONE }
          type: string
          maxLength: 2000
          description: An optional note. Free text; never logged. Retention is set by the evidence retention decision, not yet decided.
        modifiedCode:
          x-ztax-privacy: { class: P0 }
          type: string
          maxLength: 256
          description: The reviewer's own code in ontology format. Only for `MODIFY`.
        evidenceId:
          x-ztax-privacy: { class: P0 }
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9-]{1,64}$"
          description: The Gateway's evidence record id for the proposal call, when the proposal had one.

    ClassificationDecision:
      type: object
      title: ClassificationDecision
      description: A saved reviewer decision. Append-only. The proposal id, subject reference, proposed code and evidence id are stated by the caller; the service does not store or verify the proposal they refer to.
      additionalProperties: false
      required: [proposalId, subjectRef, proposedCode, action, reason, tenantId, reviewerUserId, decidedAt]
      properties:
        proposalId: { $ref: "#/components/schemas/ClassificationProposalId" }
        subjectRef:
          x-ztax-privacy: { class: P0 }
          type: string
        proposedCode:
          x-ztax-privacy: { class: P0 }
          type: string
        action: { $ref: "#/components/schemas/ClassificationDecisionAction" }
        reason:
          x-ztax-privacy: { class: P2, purposes: [PURP-AI-ASSIST, PURP-EVID], retention: RET-EVIDENCE, redaction: NO_LOG, aiAllowed: NONE }
          type: string
        note:
          x-ztax-privacy: { class: P2, purposes: [PURP-AI-ASSIST, PURP-EVID], retention: RET-EVIDENCE, redaction: NO_LOG, aiAllowed: NONE }
          type: string
        modifiedCode:
          x-ztax-privacy: { class: P0 }
          type: string
        evidenceId:
          x-ztax-privacy: { class: P0 }
          type: string
        tenantId:
          x-ztax-privacy: { class: P0 }
          type: string
          format: uuid
          description: The tenant of the session that recorded the decision.
        reviewerUserId:
          x-ztax-privacy: { class: P1, purposes: [PURP-SEC, PURP-EVID], retention: RET-EVIDENCE, redaction: NONE }
          type: string
          format: uuid
          description: The person who decided, from the session.
        decidedAt: { $ref: "#/components/schemas/Timestamp" }

    ClassificationProposal:
      type: object
      title: ClassificationProposal
      description: |
        An advisory mapping proposal. `authoritative` is always false; a person confirms it or it is nothing.

        `disposition` says what the AI plane contributed. `PROPOSED` carries a proposal (`id`, `proposedCode`,
        `provenance`) for a person to confirm. `REVIEW_REQUIRED` carries none: the AI plane was unavailable, not
        configured in this cell, or answered with something that cannot be used, so a person classifies the item
        without a suggestion. `reviewReason` is the reason code.
      additionalProperties: false
      required: [subjectRef, disposition, authoritative]
      properties:
        id:
          x-ztax-privacy: { class: P0 }
          type: string
          format: uuid
          description: Present when `disposition` is `PROPOSED`.
        subjectRef:
          x-ztax-privacy: { class: P0 }
          type: string
        disposition:
          x-ztax-privacy: { class: P0 }
          type: string
          enum: [PROPOSED, REVIEW_REQUIRED]
        reviewReason:
          x-ztax-privacy: { class: P0 }
          type: string
          description: |
            Present when `disposition` is `REVIEW_REQUIRED`: `AI_GATEWAY_UNAVAILABLE`, `AI_GATEWAY_NOT_CONFIGURED`,
