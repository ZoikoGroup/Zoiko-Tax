        - $ref: "#/components/parameters/ERPBridgeId"
        - $ref: "#/components/parameters/ERPExportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ERPResponseRequest"
            examples:
