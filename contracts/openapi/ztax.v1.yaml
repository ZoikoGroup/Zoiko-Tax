                        screening: { sellerMatches: PASS, buyerMatches: PASS, jurisdictionMatches: PASS, formAccepted: PASS, signaturePresent: PASS, datesValid: PASS, numberPresent: PASS, result: DOCUMENT_COMPLETE }
