          example: 01920a4c-0000-7000-8000-00000000e001
        - name: buyerRef
          in: query
          required: false
          description: Only certificates of this buyer.
          schema: { $ref: "#/components/schemas/BuyerRef" }
          example: CUST-0042
        - name: jurisdiction
