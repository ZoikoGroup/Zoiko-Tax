      tags: [erp]
      summary: The subledger-to-GL reconciliations (R6)
      description: |
        `OPERATOR`, `ANALYST` or `AUDITOR`.

        Every GL reconciliation run on the bridge, newest first, with its items
        and exact variances. Each is a record: a later run is a new one.
      parameters:
        - $ref: "#/components/parameters/ERPBridgeId"
        - name: period
          in: query
