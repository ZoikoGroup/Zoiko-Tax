  /v1/subledger/periods/{period}/transitions:
    post:
      operationId: transitionSubledgerPeriod
      tags:
        - subledger
      summary: Close a period, open an amendment window, or seal it
      description: |
        `OPERATOR`. Moves the period (ZTAX-FIN-REQ-0088): `OPEN` ⇄
        `SOFT_CLOSE` → `HARD_CLOSE` → `AMENDMENT_ACTIVE` → `HARD_CLOSE`, and
        `HARD_CLOSE` → `SEALED`, which is final. A hard close seals the
        period's journals, control balances, documents dated in it and open
        exceptions in a new close manifest, naming the previous one
        (ZTAX-FIN-REQ-0089, -0092, -0093).

        After a hard close nothing posts into the period by the normal path:
        a commit or a correction whose journal falls in it is refused with
        `STATE_TRANSITION_INVALID`. Inside an `AMENDMENT_ACTIVE` window it
        posts, marked as an amendment (ZTAX-FIN-REQ-0090). `SOFT_CLOSE` takes
        adjustment and rounding journals only.

        `REOPENED` is not a transition: it takes a reopen request and a
        second person's approval.
      parameters:
        - $ref: "#/components/parameters/LegalPeriod"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PeriodTransitionRequest"
            examples:
              default:
                summary: Close September
                value:
                  to: HARD_CLOSE
                  reason: month end
      responses:
        "200":
          description: The period after the move.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubledgerPeriod"
              examples:
                default:
                  summary: Hard-closed
                  value:
                    period: 2026-09
                    legalEntityId: 01920a4c-0000-7000-8000-00000000e001
                    state: HARD_CLOSE
                    history:
                      - seq: 1
                        state: HARD_CLOSE
                        reason: month end
                        recordedAt: 2026-10-02T09:00:00.000000Z
                        manifestDigest: zt1:4f2a8c1e0b9d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f
                    manifest:
                      digest: zt1:4f2a8c1e0b9d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f
