  /v1/classifications:propose:
    post:
      operationId: proposeClassification
      tags:
        - classification
      summary: Ask the AI plane for an advisory ontology mapping
      description: |
        `OPERATOR` or `ANALYST`. Sends the item to the Governed Model Gateway
        under the `classification-review` use case (ADR-0006) and returns
        what it proposes. The proposal is **advisory and never
        authoritative** (ZTAX-CLS-REQ-0082): it names an existing ontology
        node for a person to confirm, and nothing in this response can become
        a classification decision without that confirmation
        (ADR-0006 §2.6).

        When the AI plane cannot help, the item still goes to a person: a
        Gateway with no approved provider, a Gateway that is down or slow, a
        reply without its provenance, or a proposed code that is not an
        `ontology:` node all answer `200` with `disposition: REVIEW_REQUIRED`
        and the reason in `reviewReason`, and no proposal. Deterministic
        processing is unaffected by any of them. A cell with no classification
        service wired at all answers `503`. A governance refusal — kill switch,
        residency, authority — is a `403` with the Gateway's reason code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassificationProposalRequest"
            examples:
              sku:
                summary: A catalog item to map
                value:
                  subjectRef: sku:PLAN-UNL-5G
                  description: Unlimited 5G mobile plan with 20 GB hotspot
      responses:
        "200":
          description: The advisory proposal with the provenance that produced it, or `REVIEW_REQUIRED` when the AI plane could not help.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationProposal"
              examples:
                default:
                  summary: A proposal for review
                  value:
                    id: 01920a4d-5a6b-7c8d-9e0f-1a2b3c4d5e6f
                    subjectRef: sku:PLAN-UNL-5G
                    disposition: PROPOSED
                    proposedCode: ontology:telecom/voice/mobile
                    confidence: "0.97"
                    authoritative: false
                    provenance:
                      useCase: classification-review
                      modelProfile: model:cls-2027.03
                      providerProfile: provider:approved-a
                      promptProfile: prompt:classification-review-v1
                      aiTrainVersion: ai-2027.03.1
                aiUnavailable:
                  summary: The AI plane could not help; a person classifies the item
                  value:
                    subjectRef: sku:PLAN-UNL-5G
                    disposition: REVIEW_REQUIRED
                    reviewReason: AI_GATEWAY_UNAVAILABLE
                    authoritative: false
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
