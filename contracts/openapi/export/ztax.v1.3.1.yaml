  /v1/batches:
    post:
      operationId: submitBatch
      tags:
        - batches
      summary: Queue many commits as one job
      description: |
        `OPERATOR` only. Queues up to 1000 commits, executed asynchronously
        and in order by a worker in the cell. Each item is exactly a
        `:commit` request body; an item naming `supersedes` is executed as
        `:adjust`, under the content that made what it corrects. An item may
        correct an earlier item of the same batch.

        A batch changes how commits arrive, never what a commit is: each item
        takes the commit path a single request takes, under an idempotency key
        of its own, so a worker that stops halfway resumes at the first item
        with no result and commits nothing twice. A refused item — invalid
        input, a superseded decision, a closed period — is recorded with its
        reason code and the job carries on.

        `Idempotency-Key` is required: the same key and body returns the same
        job (ADR-0013). Poll `GET /v1/jobs/{jobId}` for progress.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRequest"
            examples:
              default:
                summary: Two lines
                value:
                  operation: COMMIT
                  items:
                    - businessKey: INV-0002/1
                      eventTime: 2026-09-24T18:00:00.000000Z
                      input:
                        money:
                          line.netAmount:
                            amount: "100.00"
                            currency: EUR
                        quantities:
                          line.quantity:
                            value: "3"
                            unit: EA
                        flags:
                          line.reducedRateApplies: false
                          line.exemptCertificateHeld: false
                    - businessKey: INV-0002/2
                      eventTime: 2026-09-24T18:00:00.000000Z
                      input:
                        money:
                          line.netAmount:
                            amount: "40.00"
                            currency: EUR
                        quantities:
                          line.quantity:
                            value: "1"
                            unit: EA
                        flags:
                          line.reducedRateApplies: true
                          line.exemptCertificateHeld: false
      responses:
        "202":
          description: |
            The job, queued. A replayed response carries
            `Idempotent-Replay: true` and is byte-for-byte the original.
          headers:
            Idempotent-Replay:
              description: Present, and `true`, when this is the stored response to an earlier request with the same key.
              schema:
                type: boolean
              example: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
              examples:
                default:
                  summary: Queued
                  value:
                    id: 01920a70-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                    operation: COMMIT
                    status: QUEUED
                    itemCount: 2
                    succeeded: 0
                    failed: 0
                    pending: 2
                    requestedAt: 2026-10-07T09:00:00.000000Z
                    items:
                      - index: 0
                        businessKey: INV-0002/1
                        status: PENDING
                      - index: 1
                        businessKey: INV-0002/2
                        status: PENDING
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"
