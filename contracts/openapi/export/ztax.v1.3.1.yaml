        - subjectRef
        - proposedCode
        - authoritative
        - provenance
      properties:
        id:
          x-ztax-privacy:
            class: P0
          type: string
          format: uuid
        subjectRef:
          x-ztax-privacy:
            class: P0
          type: string
        proposedCode:
          x-ztax-privacy:
            class: P0
          type: string
          description: An existing ontology node, `ontology:...`.
        confidence:
          x-ztax-privacy:
            class: P0
          type: string
          description: The model's own score as a canonical decimal in [0, 1]. Never a threshold that makes the proposal authoritative.
        authoritative:
          x-ztax-privacy:
            class: P0
          type: boolean
          enum:
            - false
        provenance:
          $ref: "#/components/schemas/AiProvenance"
    RefundId:
      x-ztax-privacy:
        class: P0
      type: string
      title: RefundId
      description: A refund identifier. A UUIDv7 in lowercase canonical form (ADR-0012 §2.1).
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      example: 01920a50-2a3b-7c4d-8e5f-6a7b8c9d0e1f
    RefundStatus:
      x-ztax-privacy:
