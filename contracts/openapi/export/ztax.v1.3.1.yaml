      title: DashboardObligations
      description: |
        Current obligations not yet filed whose due date falls within
        `windowDays` of today in their own legal calendar, overdue ones
        included, and the assessed amounts of all of them per currency.
      additionalProperties: false
      required:
        - windowDays
        - due
        - overdue
        - amounts
      properties:
        windowDays:
          x-ztax-privacy:
            class: P0
          type: integer
          format: int32
          minimum: 1
        due:
          x-ztax-privacy:
            class: P0
          type: integer
          format: int32
          minimum: 0
        overdue:
          x-ztax-privacy:
            class: P0
          type: integer
          format: int32
          minimum: 0
        amounts:
          type: array
          items:
            $ref: "#/components/schemas/MoneyValue"
    DashboardReconciliation:
      type: object
      title: DashboardReconciliation
      description: |
        Items of the latest run of each legal period. `matched` counts
        matched, explained and resolved items; `breaks` exceptions nobody has
        resolved; `open` items still pending.
      additionalProperties: false
      required:
        - runs
        - matched
        - breaks
        - open
      properties:
        runs:
          x-ztax-privacy:
            class: P0
          type: integer
          format: int32
          minimum: 0
        matched:
          x-ztax-privacy:
            class: P0
          type: integer
          format: int32
          minimum: 0
        breaks:
          x-ztax-privacy:
            class: P0
          type: integer
          format: int32
          minimum: 0
        open:
          x-ztax-privacy:
            class: P0
          type: integer
          format: int32
          minimum: 0
    DashboardEvidence:
      type: object
      title: DashboardEvidence
      description: |
        Seal coverage of the tenant's decisions: how many are recorded, and
        how many fall inside a period seal and can therefore prove their
        inclusion (ADR-0011 §2.4). Replay is not counted: its verdict is
        computed on request and never stored.
      additionalProperties: false
      required:
        - decisions
        - sealed
        - seals
      properties:
        decisions:
          x-ztax-privacy:
            class: P0
          type: integer
          format: int32
          minimum: 0
        sealed:
          x-ztax-privacy:
            class: P0
          type: integer
          format: int32
          minimum: 0
        seals:
          x-ztax-privacy:
            class: P0
          type: integer
          format: int32
          minimum: 0
    DashboardReadiness:
      x-ztax-privacy:
        class: P0
      type: string
      title: DashboardReadiness
      description: |
        Whether filing with an authority could proceed now: `READY` when the
        gate allows it, `AT_RISK` when only a customer authorization or
        credential stands in the way, `BLOCKED` otherwise.
      enum:
        - READY
        - AT_RISK
        - BLOCKED
    DashboardAuthority:
      type: object
      title: DashboardAuthority
      additionalProperties: false
      required:
        - country
        - authority
        - readiness
      properties:
        country:
          $ref: "#/components/schemas/CountryCode"
        authority:
          $ref: "#/components/schemas/AuthorityCode"
        readiness:
          $ref: "#/components/schemas/DashboardReadiness"
        reason:
          x-ztax-privacy:
            class: P0
          type: string
          description: The gate's reason when filing is not allowed; absent when it is.
    DashboardJurisdictions:
      type: object
      title: DashboardJurisdictions
      description: |
        Every authority the LegalAuthorization matrix names, resolved through
        the gate for `FILE` in the period against the customer's
        authorizations. The counts are of authorities.
      additionalProperties: false
      required:
        - ready
        - atRisk
        - blocked
        - authorities
      properties:
        ready:
          x-ztax-privacy:
            class: P0
          type: integer
          format: int32
          minimum: 0
        atRisk:
          x-ztax-privacy:
            class: P0
          type: integer
          format: int32
          minimum: 0
        blocked:
          x-ztax-privacy:
            class: P0
          type: integer
          format: int32
          minimum: 0
        authorities:
          type: array
          items:
            $ref: "#/components/schemas/DashboardAuthority"
    DashboardActionKind:
      x-ztax-privacy:
        class: P0
      type: string
      title: DashboardActionKind
      enum:
        - OBLIGATION_OVERDUE
        - OBLIGATION_ATTENTION
        - OBLIGATION_DUE
        - RECONCILIATION_BREAK
        - REFUND_UNCERTAIN
        - REFUND_FAILED
        - DECISION_REVIEW
        - WEBHOOK_DEAD
    DashboardPriority:
      x-ztax-privacy:
        class: P0
      type: string
      title: DashboardPriority
      description: "`P0` now, `P1` this week, `P2` this month."
      enum:
        - P0
        - P1
        - P2
    DashboardAction:
      type: object
      title: DashboardAction
      description: |
        One thing that needs a person. `subjectId` names the obligation,
        reconciliation item or refund it concerns, so a client can open it;
        it is absent for an action that aggregates many records.
      additionalProperties: false
      required:
        - kind
        - priority
        - title
        - context
      properties:
        kind:
          $ref: "#/components/schemas/DashboardActionKind"
        priority:
          $ref: "#/components/schemas/DashboardPriority"
        title:
          x-ztax-privacy:
            class: P0
          type: string
        context:
          x-ztax-privacy:
            class: P0
          type: string
        exposure:
          $ref: "#/components/schemas/MoneyValue"
        due:
          $ref: "#/components/schemas/CivilDate"
        subjectId:
          x-ztax-privacy:
            class: P0
          type: string
          format: uuid
    DashboardTrendPoint:
      type: object
      title: DashboardTrendPoint
      additionalProperties: false
      required:
        - period
        - decisions
        - liabilityIndex
      properties:
        period:
          $ref: "#/components/schemas/LegalPeriod"
        decisions:
          x-ztax-privacy:
            class: P0
          type: integer
          format: int32
          minimum: 0
        liability:
          $ref: "#/components/schemas/MoneyValue"
        liabilityIndex:
          x-ztax-privacy:
            class: P0
          type: integer
          format: int32
          minimum: 0
          maximum: 100
          description: The point's liability as a share of the largest in the trend, 0–100, for drawing. Not an amount.
    DashboardTrend:
      type: object
      title: DashboardTrend
      description: |
        The eight periods ending with the reported one, oldest first:
        decisions recorded, and tax credited to `TAX_COLLECTED_LIABILITY` in
        `currency` — the currency most journals posted in over those periods.
        `currency` and each point's `liability` are absent when nothing
        posted.
      additionalProperties: false
      required:
        - points
      properties:
        currency:
          $ref: "#/components/schemas/CurrencyCode"
        points:
          type: array
          items:
            $ref: "#/components/schemas/DashboardTrendPoint"
