    DeterminationState:
      x-ztax-privacy:
        class: P0
      type: string
      title: DeterminationState
      description: |
        `RESOLVED` is the only state that carries amounts. Every other state
        is recorded with its evidence and reason and is never a zero tax.
      enum:
        - RESOLVED
        - REVIEW_REQUIRED
        - UNSUPPORTED
        - AMBIGUOUS
        - CONFLICTED
      example: RESOLVED
    Treatment:
      x-ztax-privacy:
        class: P0
      type: string
      title: Treatment
      description: |
        `CUSTOMER_CHARGE` is on the invoice. `PROVIDER_COST` is borne by the
        seller and never on it. `REVERSE_CHARGE` is self-assessed by the
        customer: disclosed, neither charged nor remitted by the seller.
        `EXEMPT` is a customer charge a verified certificate suppressed.
      enum:
        - CUSTOMER_CHARGE
        - PROVIDER_COST
        - REVERSE_CHARGE
        - EXEMPT
      example: CUSTOMER_CHARGE
    ResponsibleParty:
      x-ztax-privacy:
        class: P0
      type: string
      title: ResponsibleParty
      enum:
        - SELLER
        - BUYER
        - NONE
      example: SELLER
