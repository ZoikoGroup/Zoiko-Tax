info:
  title: ZoikoTax
  version: 1.0.0
  summary: Discovery, identity, administration and determination surface of a ZoikoTax regional cell.
  description: |
    This is the `/v1` surface a ZoikoTax regional cell serves today: discovery,
    authentication, tenant administration, and the first part of the
    determination surface named in `ZTAX-INT-001` — quotes, transaction commit,
    decisions and replay. Adjust, refund, classifications, obligations, batches
    and jobs are added by addition under the same major version (ADR-0010 §2.6).

    **No authoritative fiscal output is permitted before A4.** A client
    discovers whether this deployment may produce one from
    `GET /v1/capabilities`, which reports `authoritative`, never from a release
    note. A deployment reporting `authoritative: false` produces advisory
    figures that must not be filed.

    ## Errors

    Every error is an RFC 9457 Problem Details document with
    `Content-Type: application/problem+json` (ADR-0016). Two fields matter more
    than the status code:

    - `ztx_reason_code` is from a closed, registered vocabulary. It means the
      same thing in an error, in a decision and in evidence, and it is what a
      client branches on. Never match on `title` or `detail`; both may be
      reworded.
    - `ztx_retryable` states whether retrying the request unchanged could
      succeed. It is a property of the error rather than something to infer from
      the status, so a client does not have to guess.

    The full reason-code vocabulary this deployment can emit is reported by
    `GET /v1/capabilities`.

    ## Fiscal amounts

    Every fiscal amount in this API is a JSON **string** in canonical decimal
    form, such as `"12.50"` — never a JSON number (ADR-0010 §2.9). Trailing
    zeros are significant: `"1.50"` and `"1.5"` are different assertions about
    precision. Do not parse one into a binary float; `JSON.parse` in a browser
    does exactly that and is the reason this rule exists.

    The same holds for rates and quantities, and for every value a
    determination emits. The `Decimal` schema is the one definition of the form.
  contact:
    name: ZoikoTax integration
    url: https://developers.zoikotax.com
  license:
    name: Proprietary
    identifier: LicenseRef-ZoikoTax-Proprietary
servers:
  - url: https://{cell}.zoikotax.com
    description: A regional execution cell. Data never leaves its region.
    variables:
      cell:
        default: eu-west-1
        description: The cell serving the tenant's residency region.
  - url: http://localhost:8080
    description: Local development stack (`docker compose up`).
tags:
  - name: discovery
    description: What this deployment can actually do, right now.
  - name: authentication
    description: Sessions. Opaque, server-side, cookie-borne (ADR-0020).
  - name: administration
    description: Tenant, users, sessions and the audit trail.
  - name: determination
    description: Quotes, commits, decisions and replay. Advisory until A4.
  - name: subledger
    description: The Tax Control Subledger — control journals and balances, not the customer GL.
  - name: classification
    description: Advisory classification assistance through the Governed Model Gateway.
  - name: obligations
    description: Periodic returns assessed from committed decisions, and their lifecycle.
  - name: refunds
    description: Refunds of tax a committed decision charged. Their own lifecycle; never a decision, never a credit.
  - name: webhooks
    description: Delivery of the cell's events to endpoints a tenant names. Signed, retried, dead-lettered and replayable; egress-guarded.
  - name: batches
    description: Many commits queued as one asynchronous job, each item on the single-commit path.
  - name: evidence
    description: Period seals, their verification, and the inclusion proof that ties one decision to a signed root.
  - name: documents
    description: Fiscal documents that present committed decisions, and the voids, credits and rebills that correct them. Never edited.
  - name: reconciliation
    description: R1 to R7 over a legal period, every item recorded with its exact variance, every resolution with its evidence.
  - name: retention
    description: Versioned retention policies, legal holds, and the disposition verdict that weighs them. Nothing here deletes or rewrites a record.
  - name: legal
    description: The LegalAuthorization matrix, customer authorizations and powers of attorney, and the gate that resolves whether an action may execute. Fails closed.
  - name: compliance
    description: Compliance packages that turn an obligation into a filing — preparation, independent review, exact-version approval, submission and the authority's answer. TRANSMITTING is not FILED.
  - name: remittance
    description: Payee master data and payment instructions for accepted returns. ZoikoTax instructs the customer's own provider and never holds funds; submitted is not settled.
  - name: shadow
    description: Shadow assurance — another engine's results compared with ZoikoTax's decisions, component by component. Non-impact; matching a comparator is not verified correctness.
  - name: migration
    description: Migration programs — immutable source snapshots, versioned code mappings, AS_KNOWN conversion with crosswalk and reconciliation, governed exceptions and a cutover state machine.
  - name: dashboard
    description: The Tax Command Center — read-only aggregates over the record the other surfaces write. Never a second source of any figure.
