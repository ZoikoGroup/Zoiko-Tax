  /v1/replay/{decisionId}:
    post:
      operationId: replayDecision
      tags:
        - determination
      summary: Replay a recorded decision and compare it byte for byte
      description: |
        `OPERATOR`, `ANALYST` or `AUDITOR`. Rebuilds the decision's result from
        its envelope alone, against the content bundle the envelope names —
        never the one active now — and compares the canonical bytes with the
        result that was recorded (ADR-0003 §3.3, ADR-0011 §2.8).

        The verdict is data, not an error. `DIVERGED` names the first path at
        which the two results differ; `BUNDLE_UNAVAILABLE` means this cell no
        longer holds the bundle the decision was made under, which is a fact
        about the cell rather than about the decision. Evidence that no longer
        matches its digest, or a record that disagrees with its envelope, is a
        `500 EVIDENCE_INTEGRITY` instead: that is an incident, not a verdict.

        Nothing is recorded. Replaying twice gives the same answer.
      parameters:
        - $ref: "#/components/parameters/DecisionId"
      responses:
        "200":
          description: The replay verdict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayReport"
              examples:
                match:
                  summary: The decision replays exactly
                  value:
                    decisionId: 01920a4b-7c3e-7d21-9f40-3c1a2b4d5e6f
                    verdict: MATCH
                    envelopeDigest: zt1:9c8d7e6f5a4b3c2d1e0f4b2d1e0f9a8c7b6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f
                    recordedResult: zt1:1a0b9c8d7e6f5a4b3c2d4b2d1e0f9a8c7b6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f
                    replayedResult: zt1:1a0b9c8d7e6f5a4b3c2d4b2d1e0f9a8c7b6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f
                diverged:
                  summary: The runtime no longer reproduces the recorded result
                  value:
                    decisionId: 01920a4b-7c3e-7d21-9f40-3c1a2b4d5e6f
