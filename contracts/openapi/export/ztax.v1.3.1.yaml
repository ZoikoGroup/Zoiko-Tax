              schema:
                $ref: "#/components/schemas/AuthorizationCheck"
              examples:
                default:
                  summary: Allowed under a mandate
                  value:
                    allowed: true
                    status: DIRECT_WITH_AUTH
                    rule:
                      id: DE-ELSTER-FILE
                      version: 1
                    authorizationId: 01920ad0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
