          minLength: 1
          maxLength: 512
          description: The caller's reference for the item, e.g. a catalog SKU.
          example: sku:PLAN-UNL-5G
        description:
          x-ztax-privacy:
            class: P0
            aiAllowed: APPROVED_MODEL_GATEWAY
          type: string
          minLength: 1
          maxLength: 2000
          description: The item's commercial description. Catalog text, never customer data; it is sent to the Gateway.
          example: Unlimited 5G mobile plan with 20 GB hotspot
    AiProvenance:
      type: object
      title: AiProvenance
      description: Which governed use case, model, provider, prompt and AI train produced an output (ADR-0006 §2.7).
      additionalProperties: false
      required:
        - useCase
        - modelProfile
        - providerProfile
        - promptProfile
        - aiTrainVersion
      properties:
        useCase:
          x-ztax-privacy:
            class: P0
          type: string
        modelProfile:
          x-ztax-privacy:
            class: P0
          type: string
        providerProfile:
          x-ztax-privacy:
            class: P0
          type: string
        promptProfile:
          x-ztax-privacy:
            class: P0
          type: string
        aiTrainVersion:
          x-ztax-privacy:
            class: P0
          type: string
    ClassificationProposal:
      type: object
      title: ClassificationProposal
      description: |
        An advisory mapping proposal. `authoritative` is always false; a person confirms it or it is nothing.

        `disposition` says what the AI plane contributed. `PROPOSED` carries a proposal (`id`, `proposedCode`,
        `provenance`) for a person to confirm. `REVIEW_REQUIRED` carries none: the AI plane was unavailable, not
        configured in this cell, or answered with something that cannot be used, so a person classifies the item
        without a suggestion. `reviewReason` is the reason code.
      additionalProperties: false
      required:
        - subjectRef
        - disposition
        - authoritative
      properties:
        id:
          x-ztax-privacy:
            class: P0
          type: string
          format: uuid
          description: Present when `disposition` is `PROPOSED`.
        subjectRef:
          x-ztax-privacy:
            class: P0
          type: string
        disposition:
          x-ztax-privacy:
            class: P0
          type: string
          enum:
            - PROPOSED
            - REVIEW_REQUIRED
        reviewReason:
          x-ztax-privacy:
            class: P0
          type: string
          description: |
            Present when `disposition` is `REVIEW_REQUIRED`: `AI_GATEWAY_UNAVAILABLE`, `AI_GATEWAY_NOT_CONFIGURED`,
            `AI_GATEWAY_REPLY_UNEVIDENCED` or `AI_PROPOSAL_NOT_AN_ONTOLOGY_NODE`.
        proposedCode:
          x-ztax-privacy:
            class: P0
          type: string
          description: An existing ontology node, `ontology:...`. Present when `disposition` is `PROPOSED`.
        confidence:
          x-ztax-privacy:
            class: P0
          type: string
          description: The model's own score as a canonical decimal in [0, 1]. Never a threshold that makes the proposal authoritative.
        authoritative:
          x-ztax-privacy:
            class: P0
          type: boolean
          enum:
            - false
        provenance:
          $ref: "#/components/schemas/AiProvenance"
    RefundId:
      x-ztax-privacy:
        class: P0
      type: string
      title: RefundId
      description: A refund identifier. A UUIDv7 in lowercase canonical form (ADR-0012 §2.1).
