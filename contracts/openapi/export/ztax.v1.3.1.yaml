  /v1/decisions/{decisionId}/inclusion:
    get:
      operationId: getDecisionInclusion
      tags:
        - evidence
      summary: Prove a decision is in its period's seal
      description: |
        `OPERATOR`, `ANALYST`, `AUDITOR` or `ADMIN`. The RFC 6962 audit path
        from the decision's leaf to the root of the seal covering the instant
        it was recorded (ADR-0011 §2.4). With the seal's signed payload
        (`GET /v1/seals/{sealId}`) and the published seal keyring, a verifier
        outside the cell can confirm the decision was sealed without seeing
        any other decision — the leaf is the decision's id, recorded instant
        and result digest, hashed as `SHA-256(0x00 ‖ leafDigest)`, and each
        level as `SHA-256(0x01 ‖ left ‖ right)`, an odd node promoted.

        Check the path against the **signed** root and leaf count, never
        against sizes the proof itself states. `404 NOT_FOUND` until the
        period is sealed.
      parameters:
        - $ref: "#/components/parameters/DecisionId"
      responses:
        "200":
          description: The proof.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InclusionProof"
              examples:
                default:
                  summary: The second of three decisions in a sealed day
                  value:
                    sealId: 01920a80-1a2b-7c3d-8e4f-5a6b7c8d9e0f
                    merkleRoot: zt1:4f2a8c1e0b9d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f
                    leafCount: 3
                    leafIndex: 1
                    leaf:
                      decisionId: 01920a4b-7c3e-7d21-9f40-3c1a2b4d5e6f
                      recordedAt: 2026-09-25T09:00:00.000000Z
                      resultDigest: zt1:2b1c0d9e8f7a6b5c4d3e5c3e2f1a0b9c8d7e6f4b2d1e0f9a8c7b6d5e4f3a2b1c
                    leafDigest: zt1:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b
                    auditPath:
                      - zt1:1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d
