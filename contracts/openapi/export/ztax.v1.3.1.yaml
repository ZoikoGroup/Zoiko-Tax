                      envelope: zt1:0d9e8f7a6b5c4d3e2f1a5c3e2f1a0b9c8d7e6f4b2d1e0f9a8c7b6d5e4f3a2b1c
                      result: zt1:2b1c0d9e8f7a6b5c4d3e5c3e2f1a0b9c8d7e6f4b2d1e0f9a8c7b6d5e4f3a2b1c
                    emitted:
                      TAX_VAT:
                        type: MONEY
