    PaymentReference:
      x-ztax-privacy:
        class: P5
        purposes:
          - PURP-RECON
          - PURP-EVID
        retention: RET-FISCAL
        redaction: REDACT
        aiAllowed: NONE
        evidencePolicy: RAW_REQUIRED
      type: string
      title: PaymentReference
      description: A payment provider's reference. It can identify a payer's transaction, so logs carry it redacted.
      minLength: 1
      maxLength: 255
      example: psp:ch_3Nf0a1
    RefundRequest:
      type: object
      title: RefundRequest
      additionalProperties: false
      required:
