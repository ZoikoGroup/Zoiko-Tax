  /v1/refunds/{refundId}/reports:
    post:
      operationId: reportRefund
      tags:
        - refunds
      summary: Record what the payment provider reported about a refund
      description: |
        `OPERATOR`. Records one provider report. `ACCEPTED` makes the refund
        `PENDING`, `SUCCEEDED` makes it `COMPLETED` and posts it to the Tax
        Control Subledger, `DECLINED` makes it `FAILED` and releases its tax
        to be refunded again. `TIMED_OUT` and `UNKNOWN` make it `UNCERTAIN` —
        never completed and never failed, because the money may or may not
        have moved — and a later definite report resolves it.

        Nothing leaves `COMPLETED` or `FAILED`. A report the lifecycle does
        not permit is refused with `409 STATE_TRANSITION_INVALID`.

        Safe to retry without an idempotency key: the same report arriving
        again (same outcome and reference, refund already where it put it)
        returns the refund unchanged rather than recording a second move.
      parameters:
        - $ref: "#/components/parameters/RefundId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefundReportRequest"
            examples:
              default:
                summary: The provider paid the refund
                value:
                  outcome: SUCCEEDED
                  externalReference: psp:re_9Kd2
      responses:
        "200":
          description: The refund after the report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
              examples:
                default:
                  summary: A completed refund
                  value:
                    id: 01920a50-2a3b-7c4d-8e5f-6a7b8c9d0e1f
                    decisionId: 01920a4b-7c3e-7d21-9f40-3c1a2b4d5e6f
                    legalEntityId: 01920a4c-0000-7000-8000-00000000e001
                    amount:
                      amount: "10.50"
                      currency: EUR
                    paymentReference: psp:ch_3Nf0a1
                    status: COMPLETED
                    requestedAt: 2026-10-07T10:00:00.000000Z
                    history:
                      - seq: 1
                        status: REQUESTED
                        recordedAt: 2026-10-07T10:00:00.000000Z
                      - seq: 2
                        status: COMPLETED
                        outcome: SUCCEEDED
                        externalReference: psp:re_9Kd2
                        recordedAt: 2026-10-07T11:12:00.000000Z
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
