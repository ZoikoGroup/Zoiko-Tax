    LegalEntityId:
      x-ztax-privacy:
        class: P0
      type: string
      title: LegalEntityId
      description: A legal entity within the tenant (ZTAX-OBL-REQ-0018). A UUID in lowercase canonical form.
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      example: 01920a4c-0000-7000-8000-00000000e001
    ControlAccount:
      x-ztax-privacy:
        class: P0
      type: string
      title: ControlAccount
      description: A Tax Control Subledger control account (ZTAX-FIN-001 §9). Never a customer GL account.
      enum:
        - TAX_COLLECTED_LIABILITY
        - TAX_ACCRUED_LIABILITY
        - TAX_RECOVERABLE
        - TAX_RECEIVABLE_CONTROL
        - TAX_CASH_CLEARING
        - TAX_RETURN_CLEARING
        - TAX_REMITTANCE_CLEARING
        - TAX_ADJUSTMENT_CONTROL
        - FX_CONTROL
        - ROUNDING_CONTROL
        - SUSPENSE_EXCEPTION
        - CUSTOMER_GL_BRIDGE
      example: TAX_COLLECTED_LIABILITY
    JournalLine:
      type: object
      title: JournalLine
      description: One line. The amount is positive and the side carries the direction (ZTAX-FIN-REQ-0044).
      additionalProperties: false
