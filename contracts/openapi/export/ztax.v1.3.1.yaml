                        action: user.role.granted
                        subjectType: user
                        subjectId: ztu_01JBQ0S9C3X8Q1H6M2KX5R7F4C
                        detail: "{\"role\":\"AUDITOR\"}"
                        recordedAt: 2026-09-23T12:00:00.000000Z
