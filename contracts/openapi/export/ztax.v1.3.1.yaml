        - type
        - legalEntityId
        - sourceKind
        - sourceId
        - postingDate
        - legalPeriod
        - currency
        - profile
        - lines
      properties:
        id:
          x-ztax-privacy:
            class: P0
          type: string
          format: uuid
        type:
          x-ztax-privacy:
            class: P0
          type: string
          enum:
            - INVOICE
            - CREDIT
            - REFUND
            - LIABILITY_ACCRUAL
            - RETURN
            - REMITTANCE
            - FX
            - ROUNDING
            - MIGRATION
            - ADJUSTMENT
        legalEntityId:
          $ref: "#/components/schemas/LegalEntityId"
        sourceKind:
          x-ztax-privacy:
            class: P0
