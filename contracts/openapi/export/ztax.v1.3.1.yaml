components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ztax_session
      description: |
        An opaque, server-side session. The cookie is `HttpOnly` and
        `SameSite=Strict`, so it is sent by a browser automatically and is not
        readable by script. There is no bearer token and no JWT: a token a
        client can read is a token a client can leak, and a stateless token
        cannot be revoked (ADR-0020).

        On plain HTTP in local development the cookie is named `ztax_session`,
        because a browser silently drops a `__Host-` cookie that is not
        `Secure`.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        A key the client mints before the first attempt and reuses, unchanged,
        on every retry of the same request (ADR-0013). Opaque to the server: it
        is compared, never parsed. Scoped to the tenant and to this endpoint, so
        a key used for a commit can never match an adjust.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 5f0c2a1e-commit-INV-0001-1
    DecisionId:
      name: decisionId
      in: path
      required: true
      description: The decision identifier.
      schema:
        $ref: "#/components/schemas/DecisionId"
      example: 01920a4b-7c3e-7d21-9f40-3c1a2b4d5e6f
    LegalHoldId:
      name: holdId
      in: path
      required: true
      description: The legal hold identifier.
      schema:
        $ref: "#/components/schemas/LegalHoldId"
      example: 01920ac0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
    AuthorizationId:
      name: authorizationId
      in: path
      required: true
      description: The customer authorization identifier.
      schema:
        $ref: "#/components/schemas/AuthorizationId"
      example: 01920ad0-1a2b-7c3d-8e4f-5a6b7c8d9e0f
    CompliancePackageId:
