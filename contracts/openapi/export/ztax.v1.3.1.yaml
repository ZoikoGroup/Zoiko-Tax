  /v1/transactions:commit:
    post:
      operationId: commitTransaction
      tags:
        - determination
      summary: Commit a transaction and record its decision
      description: |
        `OPERATOR` only. Evaluates the input against the active content bundle
        and records the result as an immutable decision, with the two evidence
        objects that let it replay exactly (ADR-0011 §2.8).

        **`Idempotency-Key` is mandatory** (ADR-0013 §2.1). A retry with the
        same key and the same body returns the original response verbatim,
        with `Idempotent-Replay: true`, and records nothing new. The same key
        with a different body is `409 IDEMPOTENCY_KEY_REUSE`; a key whose first
        request is still running is `409 REQUEST_IN_PROGRESS` with
        `Retry-After`. Neither executes. Bodies are compared in canonical form,
        so member order and whitespace do not matter and a decimal's scale
        does — `"45.00"` and `"45.0"` are different requests.

        A validation failure is recorded against the key and replayed on
        retry, because the same request fails the same way. A transient
        failure (`503`) is not: the key is released and a retry is a genuine
        new attempt.

        `supersedes` corrects an earlier decision for the same `businessKey`.
        It must name the current version; a decision is never edited, and a
        correction is a new decision linked to the old (ADR-0003).

        When the active content binds its accumulators to the cell (a
        bundle fiscal profile), the cell reads them under lock before
        evaluating, records this decision's contribution, and posts the
        decision to the Tax Control Subledger, all in this request's
        transaction. A request that supplies a value for a bound accumulator
        is refused with `400 INVALID_VALUE`: the store is the source
        (ZTAX-DET-REQ-0002). `accumulators` remains for content that reads a
        value the cell does not hold.

        Before A4 every decision is `ADVISORY` and `authoritative: false`.

        A `document` commit records the document, every line's situs decision
        and components, and the totals in the envelope and result, so a replay
        reproduces it exactly under the content that made it. A decision whose
        document is not `RESOLVED` is recorded and emits nothing: it posts no
        journal and assesses no obligation.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitRequest"
            examples:
              standardLine:
                summary: One standard-rated line against the worked pack
                value:
                  businessKey: INV-0001/1
                  eventTime: 2026-09-24T18:00:00.000000Z
                  input:
                    money:
                      line.netAmount:
                        amount: "100.00"
                        currency: EUR
                    quantities:
                      line.quantity:
                        value: "3"
                        unit: EA
                    flags:
                      line.reducedRateApplies: false
                      line.exemptCertificateHeld: false
              crossBorderBusiness:
                summary: A business customer established abroad, against a pack with location-aware content
                value:
                  businessKey: INV-0002/1
                  eventTime: 2026-10-15T12:00:00.000000Z
                  document:
                    type: INVOICE
                    currency: EUR
                    priceMode: EXCLUSIVE
                    seller:
                      id: TELCO-DE
                      establishment:
                        country: DE
                    customer:
                      id: ACME-FR
                      establishment:
                        country: FR
                      vat:
                        country: FR
                        validation: VALIDATED
                    lines:
                      - key: L1
                        sku: SIP-100
                        service: SIP_TRUNKING
                        amount: "250.00"
      responses:
        "201":
          description: |
            The recorded decision. A replayed response carries
            `Idempotent-Replay: true` and is byte-for-byte the original.
          headers:
            Idempotent-Replay:
              description: Present, and `true`, when this is the stored response to an earlier request with the same key.
              schema:
                type: boolean
              example: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
              examples:
                default:
                  summary: An advisory decision
                  value:
                    id: 01920a4b-7c3e-7d21-9f40-3c1a2b4d5e6f
                    businessKey: INV-0001/1
                    authoritative: false
                    outcome: ADVISORY
                    reasonCode: NOT_AUTHORITATIVE
                    eventTime: 2026-09-24T18:00:00.000000Z
                    recordedAt: 2026-09-25T09:00:00.000000Z
                    bundle:
                      bundleId: eu-vat-worked-2026.09
                      digest: zt1:be8651b55057f0f11f2a39820495b373417e5aa81b122f61b9fcb79faaf86c7b
                      irVersion: 1
                    digests:
                      input: zt1:4b2d1e0f9a8c7b6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d
                      envelope: zt1:9c8d7e6f5a4b3c2d1e0f4b2d1e0f9a8c7b6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f
                      result: zt1:1a0b9c8d7e6f5a4b3c2d4b2d1e0f9a8c7b6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f
                    emitted:
                      TAX_VAT:
                        type: MONEY
                        amount: "21.00"
                        currency: EUR
                      TAX_ECO_LEVY:
                        type: MONEY
                        amount: "0.11"
                        currency: EUR
        "400":
          $ref: "#/components/responses/Validation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
