# A local stand-in for one regional execution cell (ADR-0009 §2.6), with the
# browser client in front of it.
#
# A cell owns its own database and shares nothing with any other cell. This file
# models that shape at one-machine scale so the topology is familiar before the
# OpenTofu cell blueprint lands in W1 lane B.
#
#   docker compose up --build -d
#   curl localhost:8080/healthz      # the cell
#   open  http://localhost:3000      # the client, proxying /api to the cell
#
# Each service builds from its own Dockerfile in its own directory: the Go
# binary and the browser bundle share no toolchain, no base image and no build
# cache, and neither context contains the other's source.
#
# LOCAL DEVELOPMENT ONLY. The database password below is inline because this
# stack never holds real data. That is not the deployment pattern: ADR-0017 §2.4
# requires workload identity or a vault, and a static credential in a manifest is
# exactly what it forbids.

name: zoikotax-local-cell

services:
  postgres:
    # PostgreSQL 17 + PostGIS 3.5 (ADR-0008 §2.1). PostGIS is not optional —
    # jurisdiction resolution needs real geospatial support, and it is the reason
    # ADR-0008 §4.4 rules out CockroachDB.
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ztax
      POSTGRES_USER: ztax_app
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ztax_app -d ztax"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Schema first. ADR-0009 §2.2 makes this a separate deployable because it runs
  # under a DDL role the application never holds; here it is a separate service
  # that runs to completion before ztax-core starts, which is the same ordering
  # a cell gets from a pre-deploy job.
  ztax-migrate:
    build:
      context: ./backend
      target: ztax-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZTAX_ENVIRONMENT: development
      ZTAX_MIGRATE_DATABASE_URL: postgres://ztax_app:local-dev-only@postgres:5432/ztax?sslmode=disable&search_path=ztax,public
    command: ["up"]
    restart: "no"

  ztax-core:
    build:
      context: ./backend
      target: ztax-core
    depends_on:
      postgres:
        condition: service_healthy
      ztax-migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      ZTAX_CELL: local-dev
      ZTAX_REGION: local
      ZTAX_ENVIRONMENT: development

      # All seven release trains. A missing one fails the readiness probe
      # (ADR-0015 §5.1 control 5) rather than starting a process that cannot say
      # which combination produced a decision.
      ZTAX_TRAIN_APP: 0.0.0-dev
      ZTAX_TRAIN_CONTENT: 0.0.0-dev
      ZTAX_TRAIN_AI: 0.0.0-dev
      ZTAX_TRAIN_ADAPTER: 0.0.0-dev
      ZTAX_TRAIN_INFRA: 0.0.0-dev
      ZTAX_TRAIN_SCHEMA: 0.0.0-dev
      ZTAX_TRAIN_MIGRATION: 0.0.0-dev

      # A reference to where the credential lives, never the credential
      # (ADR-0017 §2.4).
      ZTAX_DATABASE_URL_REF: local://postgres

      # The local:// resolver reads this. It is the pattern ADR-0017 §2.4
      # forbids in a cell — a credential in an environment variable at rest —
      # and internal/platform/secrets refuses local:// references outside
      # development so it cannot be the thing that ships.
      ZTAX_LOCAL_SECRET_POSTGRES: postgres://ztax_app:local-dev-only@postgres:5432/ztax?sslmode=disable

      # Plain HTTP locally, so the session cookie cannot carry Secure and the
      # __Host- prefix has to come off with it (see setSessionCookie). Refused
      # outside development by config.Load.
      ZTAX_SECURE_COOKIES: "false"

      # No authoritative fiscal output before A4. Refused outside production.
      ZTAX_AUTHORITATIVE: "false"

      # The first tenant and administrator. Every admin endpoint requires an
      # administrator, so the first one cannot come through the API without an
      # unauthenticated endpoint that creates tenants. A no-op after the first
      # start.
      ZTAX_BOOTSTRAP_TENANT: acme
      ZTAX_BOOTSTRAP_TENANT_NAME: Acme Telecom
      ZTAX_BOOTSTRAP_ADMIN_EMAIL: admin@acme.example
      ZTAX_BOOTSTRAP_ADMIN_NAME: Acme Administrator
      ZTAX_BOOTSTRAP_ADMIN_PASSWORD_REF: local://bootstrap-admin
      ZTAX_LOCAL_SECRET_BOOTSTRAP_ADMIN: local-dev-only-password

      ZTAX_HTTP_ADDR: ":8080"
      ZTAX_LOG_LEVEL: debug

      # Inert until internal/platform/telemetry is wired (ADR-0015 §2.1). The
      # collector belongs in this stack once it is.
      ZTAX_OTLP_ENDPOINT: localhost:4317

    # The binary writes nothing to disk. Enforcing that here means a future
    # change that starts writing fails loudly in development rather than in a
    # cell.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  ztax-web:
    build:
      context: ./frontend
      target: ztax-web
    depends_on:
      # Started after the cell, but not dependent on it for its own health: the
      # client renders an unreachable cell as unreachable (ADR-0019 C3), and a
      # web tier that refuses to start without its API cannot show that.
      ztax-core:
        condition: service_started
    ports:
      - "3000:8080"
    environment:
      # Service name, not localhost: the browser calls /api on this origin and
      # nginx resolves the cell inside the compose network.
      ZTAX_API_ORIGIN: http://ztax-core:8080

    # nginx writes its cache, its pid, and the config its entrypoint renders
    # from the template — so the filesystem cannot be read-only wholesale. The
    # writable paths are named instead of the container being left open, which
    # keeps the property that matters: nothing else in this image can write
    # anywhere. It runs as uid 101 from the unprivileged base image.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    volumes:
      # The rendered config lands here. A tmpfs mounts root-owned by default and
      # this container is uid 101, so the mode is set explicitly — without it
      # the entrypoint cannot write the file and nginx starts with no server
      # block at all, listening on nothing while looking perfectly healthy.
      - type: tmpfs
        target: /etc/nginx/conf.d
        tmpfs:
          mode: 0o1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
