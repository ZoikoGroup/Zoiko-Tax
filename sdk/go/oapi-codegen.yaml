# oapi-codegen v2 configuration for the Go SDK's models.
#
# The version is pinned in the Makefile (OAPI_CODEGEN_VERSION) and the tool is
# run with `go run …@version`, so the generator never enters go.mod: it is a
# build tool, not a dependency of anyone who imports this module.
#
# The output path is passed with -o rather than set here. The CLI lets a config
# `output` override the flag, and generate-check needs to write the same
# generation somewhere other than the committed file to compare the two.
package: zoikotax

generate:
  # Models only. The client is hand-written (client.go), for the same reason
  # the TypeScript SDK's is: its behaviour — errors as values, no retries, no
  # credential handling — is a decision, and a generated client makes others.
  models: true

compatibility:
  # Role, TenantStatus and UserStatus share member names (ACTIVE). Prefixing
  # every enum value, not only the colliding ones, keeps a constant's name from
  # changing when the contract adds an enum that happens to collide.
  always-prefix-enum-values: true

output-options:
  # UserID, not UserId: what golint, revive and every Go reader expect.
  name-normalizer: ToCamelCaseWithInitialisms
  # A nil slice already means "absent"; a *[]Role is a second way to say it.
  prefer-skip-optional-pointer-on-container-types: true
  # Name the inline list envelopes ({"users": [...]}) so the client returns a
  # generated type rather than a hand-written copy of one.
  generate-types-for-anonymous-schemas: true

  # Zero runtime dependencies.
  #
  # The default mapping turns `format: email` into openapi_types.Email, which
  # imports github.com/oapi-codegen/runtime into every consumer's module graph
  # for a string with a validating UnmarshalJSON. The server validates email
  # addresses; a client that also did would reject a response the contract
  # later relaxes. So `email` is a plain string. `date-time` stays time.Time,
  # which is the standard library.
  type-mapping:
    string:
      formats:
        email:
          type: string

  # The stock imports.tmpl lists every package any generator mode might use,
  # including the oapi-codegen runtime, and relies on goimports to prune them.
  # This replacement lists only the standard library, so a future contract
  # construct that needs the runtime fails to compile here — loudly, in this
  # module's CI — instead of quietly adding a dependency to every integration.
  #
  # It also separates the generated header from the package clause with a blank
  # line, so it is not a second package comment appended to doc.go's.
  user-templates:
    imports.tmpl: |
      // Code generated by {{.ModuleName}} version {{.Version}} DO NOT EDIT.

      package {{.PackageName}}

      import (
      	"encoding/json"
      	"time"
      	{{- range .ExternalImports}}
      	{{ . }}
      	{{- end}}
      	{{- range .AdditionalImports}}
      	{{.Alias}} "{{.Package}}"
      	{{- end}}
      )
