# ZTAX-SEC-001 doctrine: secrets never enter source control.
# See ADR-0017 §2.4 for the environment-variable rule enforced separately
# by docs/tools/check_secrets_manifest.py.
#
# This config EXTENDS the default gitleaks ruleset — it does not replace it.
# The allowlist below covers the known, deliberately-fake dev/CI placeholders
# in the repo; .env.example holds the local stack's, moved there from
# docker-compose.yml. Each entry is path-scoped, so a new secret-shaped string
# in any other file is still caught. Adding a 4th placeholder requires a
# deliberate edit to this file.

[extend]
useDefault = true

[allowlist]
description = "Known fake dev/CI credentials — path-scoped only"
# docs/tools/tests/test_check_secrets_manifest.py intentionally contains fake secret-shaped strings as planted test fixtures.
paths = [
    '''docker-compose\.yml''',
    '''^\.env\.example$''',
    '''backend/\.env\.local\.example''',
    '''\.github/workflows/(?i:ci)\.yml''',
    '''docs/tools/tests/test_check_secrets_manifest\.py'''
]
# Exact values, not patterns. The contract once used this random-looking
# string as the example set-password link token; it was never issued by any
# cell and is now AAAA…, but it stays in this branch's history, which CI scans.
regexes = [
    '''^q9Zl3m0rYV8c2oQF6wq1n0Cw5hJ1tKx8bF3pTqYk2sA$''',
]

