# Every gate in `backend/make check`, plus the frontend's own and the stack.
#
# The split is by *toolchain*, not by control. An earlier
# version had eleven, six of which each paid a fresh checkout and Go setup to
# run one command — so most of the wall-clock was spent installing Go, and a
# contributor waiting on CI was mostly waiting on that.
#
# Consolidating costs one thing and it is worth naming: a job stops at its first
# failing step, so a gofmt failure now hides whether the tests would have
# passed. GitHub names the failing step, so you still know *which* control
# broke — you just learn about one per run instead of all of them. The steps are
# ordered cheapest-first so the common failures surface in seconds.
#
# What is deliberately still separate:
#
#   crosscheck   has no Go toolchain, and that absence IS the assertion
#                (ADR-0002 c2). Merging it into `backend` would destroy the
#                property it exists to demonstrate.
#   sdk-*        one per SDK toolchain — Python, Go, JDK, .NET. The TypeScript
#                SDK shares Node with `contracts` and runs there.
#   frontend     Node, not Go.
#   stack        builds every image through compose and asserts they answer
#                together — the thing no single-service job can.
#
# intelligence/ has its own workflow entirely (ADR-0006 §2.4, ADR-0007 §2.2):
# the AI train ships on its own cadence, so it gets its own pipeline rather
# than another job here.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'intelligence/**'
  pull_request:
    paths-ignore:
      - 'intelligence/**'
  workflow_dispatch:

permissions:
  contents: read

# A superseded run proves nothing. Cancel it and keep the runners for the head.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a toolchain change is a reviewed diff. It must stay in step with
  # backend/go.mod and with backend/Dockerfile's GO_VERSION.
  GOLANGCI_LINT_VERSION: v2.13.2
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: backend · every Go gate, tiers 1 to 3
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Attached to the whole job so tier 3 can run here rather than in a job of
    # its own. It costs a container the unit tests do not use; it saves a
    # checkout and a Go install.
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: ztax
          POSTGRES_USER: ztax_owner
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ztax_owner -d ztax"
          --health-interval 5s --health-timeout 5s --health-retries 20

    # The container superuser is ztax_owner, not ztax_app. It owns the schema
    # and runs the migrations, standing in for a cell's DDL role (ADR-0008
    # §2.8), so ztax_app stays the grant holder 000001 creates and the grant
    # tests see what the migrations granted rather than a superuser's
    # everything.
    env:
      ZTAX_ENVIRONMENT: development
      ZTAX_MIGRATE_DATABASE_URL: postgres://ztax_owner:ci-only@localhost:5432/ztax?sslmode=disable&search_path=ztax,public
      ZTAX_TEST_DATABASE_URL: postgres://ztax_owner:ci-only@localhost:5432/ztax?sslmode=disable&search_path=ztax,public

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # --- seconds, and the most common failures ------------------------------

      # vendor/ is excluded because it is upstream's code. ADR-0001 §9.2 is
      # explicit that the vendored tree is never patched in place, so
      # reformatting it would be the local modification vendor-verify detects.
      - name: gofmt
        run: make fmt-check

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # ADR-0001 control 6: the build reads vendor/, so this asserts the
      # vendored tree is complete rather than merely present.
      - name: build from vendor/
        run: go build -mod=vendor ./...

      # The module graph is part of the release evidence manifest (ADR-0001
      # control 3). A go.mod or go.sum that `go mod tidy` would change means the
      # manifest names a graph the build did not use.
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # ADR-0001 §9.2: vendoring is deliberately not a fork. A local patch would
      # silently break the General Decimal Arithmetic Specification anchor that
      # ADR-0001 §3.1 rests on, and this is what detects one.
      - name: apd vendored and unpatched (ADR-0001 c6)
        run: make vendor-verify

      # ADR-0010 §5.1 control 1. The handlers build their requests and
      # responses from types generated out of the contract; this regenerates
      # them and fails on any diff, so a contract change the server has not
      # caught up with is a build failure rather than a response that quietly
      # stops matching the SDKs.
      - name: wire types generated from the contract (ADR-0010 c1)
        run: make api-gen-check

      # --- the architectural controls -----------------------------------------

      # The analyzer's own suite runs first. A gate nobody has tested is a gate
      # nobody should trust.
      - name: float64 analyzer — its own suite (ADR-0001 c1)
        run: make fiscalfloat-test

      - name: float64 unreachable from a fiscal value (ADR-0001 c1)
        run: make fiscalfloat

      # ADR-0007 §2.5 layering, ADR-0006 §2.6 (fiscal may not import ai),
      # ADR-0005 §2.4 (the evaluator cannot reach a clock or a network),
      # ADR-0002 §2.3 (production code may not import internal/fiscaltest).
      # A layering diagram nobody can violate is worth more than one everyone
      # has seen.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend

      # --- the tests ----------------------------------------------------------

      # -race because ADR-0018 §2.2 asserts determinism across concurrent
      # goroutines, and -count=1 because a cached PASS is not a result.
      - name: tier 1 and 2 — unit, property, golden vectors
        run: make test

      # REPORT-ONLY: coverage is never a gate here. backend/README.md's own
      # citation of ADR-0018 §2.9 ("Coverage is reported and never gated.")
      # is what this comment relies on -- no ADR-0018 document is committed
      # to this repo to quote directly. This step re-runs the tier 1/2 tests
      # once more, WITHOUT -race (the existing `cover` target), only to
      # produce a coverage profile; it cannot fail on a percentage.
      - name: coverage (report-only, ADR-0018 §2.9)
        run: |
          make cover
          {
            echo "## Backend coverage (report-only — ADR-0018 §2.9)"
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && hashFiles('backend/coverage.out') != ''
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: error

      # Applied by the real migration runner, so this also asserts the
      # migrations apply cleanly from nothing on every commit.
      - name: apply migrations
        run: make migrate

      # ADR-0018 §2.4 and ADR-0001 control 2. Against a real PostgreSQL because
      # the claim is about a driver's behaviour, and a mock of the driver would
      # be a mock of the thing under test.
      - name: tier 3 — NUMERIC conformance (ADR-0001 c2)
        run: make test-integration

      # --- the CONTENT train --------------------------------------------------

      # The worked pack is compiled, sealed and then verified through the cell's
      # own loading path (ADR-0005 §2.6). Two things this asserts that the unit
      # tests cannot: the committed source still compiles under this build of
      # the compiler, and the artifact it produces is one a cell will accept.
      - name: compile and seal every pack (ADR-0005 §2.1)
        run: make content-all

      - name: the sealed bundles load the way a cell loads them (ADR-0005 §2.6)
        run: make content-verify-all

      # C3 at the compiler. The bundle digest is what every replay names, so a
      # compilation that is not byte-reproducible makes a replay depend on which
      # machine built the pack.
      - name: the compiled bundles are byte-reproducible (ADR-0001 §3.3)
        run: |
          sha256sum ../content/build/*/*.manifest.json > /tmp/first.sha256
          rm -rf ../content/build
          make content-all
          sha256sum -c /tmp/first.sha256

  crosscheck:
    name: backend · decimal agreement, Go ↔ Python (ADR-0002 c2)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Deliberately no Go toolchain in this job, and that is why it is not
      # folded into `backend`. The point of the check is that a second
      # implementation of the General Decimal Arithmetic Specification, reading
      # nothing but the vectors, reaches the same answers — which is what makes
      # ADR-0001 §3.1's cross-language claim testable rather than aspirational.
      # A job with Go installed could not demonstrate that. The script uses the
      # standard library only, so there is nothing to install.
      - name: golden vectors under Python decimal
        run: make golden-crosscheck

  contracts:
    name: contracts · the API contract and its SDKs (ADR-0010)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            sdk/typescript/package-lock.json

      # ADR-0010 §5.1 control 3: no `type: number` in a fiscal schema, every
      # error response references the shared Problem schema, every operation has
      # an operationId, a summary and examples.
      #
      # ADR-0010 §5.1 control 4: the 3.1 export is generated, not edited. The
      # check regenerates it and compares — which is the only thing keeping the
      # export from quietly becoming a second contract. The route manifest and
      # the Postman collection are generated and checked the same way, for the
      # same reason: each is a statement about the API, and a second statement
      # nobody generates is one that drifts.
      - name: contract lint, export, route manifest and collection
        working-directory: contracts
        run: |
          npm ci
          npm run check

      # ADR-0010 §2.1's drift gate on the SDK side: the types are generated from
      # the contract and committed, so a contract change the SDK has not been
      # regenerated for is a build failure rather than a discovery.
      - name: TypeScript SDK — generated types, types, tests
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run generate
          git diff --exit-code -- src/schema.ts
          npm run build
          node --test test/*.test.js

  # The other four SDKs (ADR-0010 §1, Build Plan lane K). One job each, because
  # each is a different toolchain — the same split as the rest of this file.
  # Every one regenerates its types from the contract's 3.1 export and fails on
  # a diff, then builds and tests; the gate command is the SDK's own, so CI runs
  # exactly what a developer runs.

  sdk-python:
    name: sdk · Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Development tools only, pinned with their whole graph. The SDK itself
      # has no runtime dependency.
      - run: python -m pip install -r requirements-dev.txt
      - name: generated types, mypy --strict, tests
        run: python scripts/check.py

  sdk-go:
    name: sdk · Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: sdk/go/go.mod
          cache: false # no go.sum: the module has no dependencies to cache
      - name: gofmt, vet, tidy, stdlib only, generated types, tests
        run: make fmt-check vet tidy-check deps-check generate-check test
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: sdk/go

  sdk-java:
    name: sdk · Java / Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          # The SDK compiles for 17; building on 17 proves that release target
          # is real rather than merely declared.
          java-version: "17"
          cache: maven
      # The model drift check is a test in this build, so verify is the gate.
      - name: generated models, build, tests (Java and Kotlin)
        run: mvn -B -f sdk/java/pom.xml verify

  sdk-dotnet:
    name: sdk · .NET
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/dotnet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: sdk/dotnet/global.json
      - name: generated models, locked restore, build, tests
        run: sh scripts/check.sh

  frontend:
    name: frontend · constraints, types, bundle (ADR-0019)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            sdk/typescript/package-lock.json

      # The client calls the cell through the generated SDK (ADR-0019 C4),
      # linked as file:../sdk/typescript. Its dist/ is not committed, so it is
      # built before the app resolves it.
      - name: build the TypeScript SDK
        working-directory: sdk/typescript
        run: npm ci && npm run build

      # ci, not install: the lockfile is the dependency decision, and a job that
      # silently resolves a different graph is not testing what ships.
      - run: npm ci

      # ADR-0019's binding constraints as rules: no fiscal arithmetic in the
      # browser (C1), no hand-written API calls outside the two pinned platform
      # modules (C4), no browser storage (C8), accessibility from the first
      # screen (C6).
      - name: constraints
        run: npm run lint

      - name: types
        run: npm run typecheck

      - name: bundle
        run: npm run build

  stack:
    name: the stack starts and answers
    runs-on: ubuntu-latest
    env:
      # Every `docker compose` call below (up, logs, down) picks up both
      # files with no -f flag needed on any of them. docker-compose.yml
      # alone is still the one-command local setup the README promises;
      # docker-compose.content.yml only applies when named, which this job
      # always does.
      COMPOSE_FILE: docker-compose.yml:docker-compose.content.yml
      # The pack docker-compose.content.yml mounts: the worked pack, whose
      # named inputs the Postman determination folder sends.
      ZTAX_CONTENT_PACK: eu-vat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Materializes the CONTENT train bundle the `docker compose up` step
      # below mounts: content/build (compiled, four-eyes approved, signed)
      # and content/.keys/keyring.json (the public verifier
      # docker-compose.content.yml points ZTAX_CONTENT_KEYRING at). The same
      # target `make check` already runs and proves in the `backend` job --
      # this job gets its own copy, since jobs do not share a filesystem.
      # The Postman determination folder sends the worked pack's named
      # inputs, so the stack runs that pack (ZTAX_CONTENT_PACK below selects
      # the build directory docker-compose.content.yml mounts).
      - name: make the CONTENT train bundle the determination folders need
        working-directory: backend
        run: make content CONTENT_PACK_NAME=eu-vat

      # ztax-contentc's compile step makes content/build 0750 on purpose
      # (ADR comment: "no reason to be world-traversable") -- right for a
      # human running the binary directly, wrong for ztax-core's container,
      # which runs as `nonroot` (backend/Dockerfile), a different uid than
      # the one that just ran `make content` on this runner. Without the
      # traversal bit, `nonroot` cannot even list the directory, let alone
      # read a 0644 file inside it. `o+rX` adds it only where something is
      # already a directory or already executable, so files stay plain data.
      # content/.keys/keyring.json itself is already 0644 (ztax-contentc's
      # own choice for public keys) and is mounted as a single file below,
      # which needs no directory traversal into content/.keys at all.
      - name: let the container's nonroot user traverse what make content built
        run: chmod -R o+rX content/build

      # This also replaces the separate image-build matrix: compose builds
      # ztax-core, ztax-migrate and ztax-web from their own Dockerfiles, so a
      # change that breaks an image fails here. A matrix that built the same
      # images and then threw them away was three more runners asserting less —
      # it proved they compile, this proves they run.
      # The stack reads its credentials and ports from .env, which is never
      # committed; CI runs on the committed placeholders.
      - name: .env from the example
        run: cp .env.example .env

      #
      # The job's own COMPOSE_FILE (above) is what turns on the bundle
      # `make content` just built: docker-compose.content.yml layers the
      # ZTAX_CONTENT_*/ZTAX_EVIDENCE_DIR settings and their mounts onto
      # ztax-core, so Postman folders 06/07 have content and somewhere to
      # record decisions.
      - name: docker compose up
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: the cell answers
        run: |
          curl --fail --silent --show-error --max-time 10 http://localhost:8080/healthz
          curl --fail --silent --show-error --max-time 10 http://localhost:8080/readyz

      - name: the client answers, and serves the application
        run: |
          curl --fail --silent --show-error --max-time 10 http://localhost:3000/healthz
          curl --fail --silent --show-error --max-time 10 http://localhost:3000/ | grep -q '<div id="root">'

      - name: the client reaches the cell through its own origin
        run: curl --fail --silent --show-error --max-time 10 http://localhost:3000/api/healthz

      # The two properties cheapest to break and most expensive to discover
      # late: that a session cookie survives the proxy, and that an
      # unauthenticated request is refused rather than served.
      - name: the cell refuses an unauthenticated administrative request
        run: |
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --max-time 10 http://localhost:3000/api/v1/admin/users)"
          test "$status" = "401" || (echo "::error::expected 401, got $status"; exit 1)

      - name: a bootstrapped administrator can sign in and read the tenant
        run: |
          curl --fail --silent --show-error --max-time 10 \
            --cookie-jar /tmp/ztax-cookies.txt \
            --header 'Content-Type: application/json' \
            --data '{"tenant":"acme","email":"admin@acme.example","password":"local-dev-only-password"}' \
            http://localhost:3000/api/v1/auth/sign-in > /dev/null
          curl --fail --silent --show-error --max-time 10 \
            --cookie /tmp/ztax-cookies.txt \
            http://localhost:3000/api/v1/admin/users | grep -q 'admin@acme.example'

      # The Postman collection, end to end against the running cell. The
      # contracts job proves it is what the contract generates; this proves it
      # passes — which it did not for a while, because nothing ran it: its
      # default password was one the stack never set, and three conformance
      # checks ran after sign-out and could only ever return 401.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # --env-var turns on folders 06 and 07 (determination), which need the
      # content bundle and OPERATOR session this job now provisions. It is a
      # runtime override, not a collection edit: the collection's own default
      # (runDetermination=false) is what a plain `newman run` still gets.
      - name: the Postman collection passes against the cell
        run: >
          npx --yes newman@6.2.2 run backend/postman/ZoikoTax.postman_collection.json
          --env-var runDetermination=true
          --reporters cli,json --reporter-json-export newman-report.json

      # pm.execution.skipRequest() drops a request from newman's own
      # executions entirely -- a skipped folder 06/07 is a green run with no
      # trace that it ever ran. A typo in --env-var above, or a regression in
      # the skip script's variable scope (QA audit: this is exactly what was
      # checked for and found correct when these folders were added), would
      # both go unnoticed without this. Reads the real collection off disk
      # and requires every request under a folder named "06 ..." or "07 ..."
      # to appear in newman's own executions -- not a hardcoded marker list,
      # so a request added to either folder is covered automatically, with
      # no second place to remember to update.
      - name: folders 06 and 07 actually ran, not silently skipped
        run: |
          python3 - <<'PY'
          import json
          import sys

          collection = json.load(open("backend/postman/ZoikoTax.postman_collection.json", encoding="utf-8"))
          expected = [
              item["name"]
              for folder in collection["item"]
              if folder["name"][:2] in ("06", "07")
              for item in folder["item"]
          ]

          report = json.load(open("newman-report.json", encoding="utf-8"))
          executed = {e["item"]["name"] for e in report["run"]["executions"]}

          missing = [name for name in expected if name not in executed]
          if missing:
              print("::error::determination folders 06/07 were skipped -- missing executions: "
                    + ", ".join(missing))
              sys.exit(1)
          print(f"folders 06/07 ran: {len(expected)} of {len(expected)} expected requests executed")
          PY

      # Runs whenever newman itself failed (a real assertion failure) or the
      # guard above did (a silent skip) -- the two ways this job goes red.
      # The guard's own message already names what was skipped; this is for
      # the other case, where something ran and answered wrong. Reads
      # newman-report.json defensively: it may not exist if newman never
      # got far enough to write one.
      #
      # request.url in newman's own JSON report has no "raw" field (verified
      # against a real newman run, not assumed) -- only protocol/host/path,
      # which this reassembles. The response body is response.stream, a
      # serialized Node Buffer ({"type": "Buffer", "data": [byte, ...]}), not
      # response.body -- also verified directly rather than guessed.
      - name: what failed, if anything did
        if: failure()
        run: |
          python3 - <<'PY'
          import json

          try:
              report = json.load(open("newman-report.json", encoding="utf-8"))
          except FileNotFoundError:
              print("newman-report.json does not exist -- newman did not get far enough to write one.")
              raise SystemExit

          for e in report["run"]["executions"]:
              failed = [a for a in (e.get("assertions") or []) if a.get("error")]
              if not failed:
                  continue
              req = e.get("request") or {}
              u = req.get("url") or {}
              host = ".".join(u.get("host") or [])
              path = "/".join(u.get("path") or [])
              url = f"{u.get('protocol', '')}://{host}/{path}" if host else str(u)
              resp = e.get("response") or {}
              print(f"\n--- {e['item']['name']} ---")
              print(f"{req.get('method', '?')} {url}")
              print(f"response: {resp.get('code', '?')}")
              for a in failed:
                  print(f"  FAILED: {a.get('assertion', '?')}: {a['error'].get('message', '')}")
              stream = resp.get("stream")
              if isinstance(stream, dict) and "data" in stream:
                  body = bytes(stream["data"]).decode("utf-8", errors="replace")
                  if body:
                      print(f"  body (first 800 chars): {body[:800]}")
          PY

      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: down
        if: always()
        run: docker compose down --volumes

  register:
    name: governance · the register gate (ZTAX-GOV-001 §9.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Pinned with the whole graph: the gate validates the register with
      # exactly the resolver a developer ran.
      - run: python -m pip install -r docs/tools/requirements.txt

      # The gate's own suite first, for the same reason fiscalfloat's runs
      # before fiscalfloat: every rule has a case that must fail, and a rule
      # with no failing case may never fire.
      - name: the gate's own suite
        run: python -m unittest discover -s docs/tools/tests

      - name: secret scan (ZTAX-SEC-001 doctrine -- no credentials in source control)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: deployment-manifest secrets scan (ADR-0017 §2.4)
        run: python docs/tools/check_secrets_manifest.py

      # GOV-001 §9.4: unregistered document IDs anywhere in the tree, broken
      # requirement references, missing owners, expired reviews, duplicate IDs,
      # production requirements without verification, publication hashes that
      # no longer match their source, and a hand-edited estate index.
      #
      # This job is date-sensitive by design. A review date or a gap due date
      # passing turns it red with no commit, because "expired mandatory review"
      # is a fact about the calendar, not about the diff.
      - name: the register, the requirements and the waivers agree
        run: python docs/tools/check_registry.py

      # ADR-0018 control 6, §2.12: a flaky test is quarantined, never
      # retried in CI. Rejects an expired or incomplete quarantine entry, a
      # quarantine that is the sole verification_ref of a requirement
      # (QA-REQ-0105), and a mismatch between docs/quarantine.yaml and the
      # QUARANTINE: <id> skip markers in the test trees it names.
      - name: quarantine register (ADR-0018 control 6)
        run: python docs/tools/check_quarantine.py

      # QA-REQ-0099/0100: a QA-SEV-1 defect always blocks; a QA-SEV-2 defect
      # blocks unless it carries an unexpired waiver whose requirement_id is
      # exactly ZTAX-QA-REQ-0100. This step only validates the register
      # (schema, duplicate IDs, waiver cross-references); it does not judge
      # --release here, since that is the manifest build's job below.
      - name: defects register (QA-REQ-0099, 0100)
        run: python docs/tools/check_defects.py

      # Requirement → test → evidence (#18). Runs each registered
      # verification_ref and uploads the result; non-blocking by design for individual
      # FAIL/ERROR counts, but a ratchet regression against docs/trace_baseline.json
      # is a hard gate that fails the job. It needs Go and the intelligence test extras
      # because it runs their tests.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: install intelligence dev extras (for intelligence/tests/*.py)
        working-directory: intelligence
        run: pip install -e '.[dev]'
      - name: the traceability report's own suite
        run: python -m unittest docs.test_generate_traceability_report -v
      - name: generate traceability report
        run: python docs/generate_traceability_report.py

      # QA-REQ-0109 to 0113: one ReleaseCertificationManifest, embedding the
      # traceability snapshot just generated above plus the waivers,
      # quarantine and defects registers, self-hashed for tamper evidence.
      # Default --out (docs/evidence/release_manifest.json) rides the
      # upload step below, which already uploads everything under
      # docs/evidence/ -- no separate artifact needed.
      - name: build the release certification manifest
        run: python docs/tools/build_release_manifest.py build --version 0.0.0-ci --commit "$GITHUB_SHA"
      - name: verify the release certification manifest (QA-REQ-0113)
        run: python docs/tools/build_release_manifest.py verify docs/evidence/release_manifest.json

      - name: upload traceability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: traceability-report
          path: docs/evidence/
          if-no-files-found: error

  ci:
    name: all gates green
    runs-on: ubuntu-latest
    needs: [backend, crosscheck, contracts, sdk-python, sdk-go, sdk-java, sdk-dotnet, frontend, stack, register]
    if: always()
    steps:
      # One check to require on the branch, so that adding a gate above does
      # not mean editing branch protection and forgetting to.
      - name: verify every gate passed
        # toJSON(needs) is routed through the environment rather than
        # inlined into the script: inlined, its own double quotes break out
        # of the surrounding shell quoting, and the grep that used to live
        # here was looking for an escaped "result": "failure" that never
        # actually appeared in the unquoted text -- so the gate always
        # passed, even when a needed job had failed.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          python3 - <<'PY'
          import json
          import os

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = [
              (name, info.get("result"))
              for name, info in needs.items()
              if info.get("result") != "success"
          ]
          if failed:
              names = ", ".join(f"{name}={result}" for name, result in failed)
              print(f"::error::a gate did not pass: {names}")
              raise SystemExit(1)
          PY
