# Secret scanning for intelligence/** — closes a gap in ci.yml, not a
# duplicate of it.
#
# ci.yml's `register` job runs gitleaks and check_secrets_manifest.py, but
# ci.yml's own triggers carry `paths-ignore: ['intelligence/**']` (ADR-0006
# §2.4, ADR-0007 §2.2: the AI train ships on its own cadence and gets its own
# pipeline, intelligence.yml). The consequence nobody intended: a push or PR
# that touches ONLY intelligence/** never runs ci.yml at all, so it never
# runs gitleaks or check_secrets_manifest.py either -- the one place in the
# estate that currently scans for secrets at all skips exactly the files
# this workflow covers.
#
# This workflow exists only to close that gap. It runs the identical two
# checks ci.yml's register job runs, pinned to the identical action SHAs, so
# a secret under intelligence/** is caught the same way a secret anywhere
# else already is.
#
# Deliberately NOT part of ci.yml's "all gates green" aggregate (needs:
# [backend, crosscheck, contracts, sdk-python, sdk-go, sdk-java, sdk-dotnet,
# frontend, stack, register] -- this workflow is untouched by that list, and
# ci.yml itself is not edited here). It should become a required check on
# main only if a repo admin decides to add it to branch protection; nothing
# here does that on its own.
name: secret-scan (intelligence)

on:
  pull_request:
    paths:
      - 'intelligence/**'
      - '.github/workflows/secret-scan.yml'
  push:
    branches: [main]
    paths:
      - 'intelligence/**'
      - '.github/workflows/secret-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    name: secret-scan (intelligence) · gitleaks + deployment-manifest scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # check_secrets_manifest.py imports only stdlib (os, re, sys,
      # subprocess) -- no pip install is needed for it. This step exists so
      # the interpreter running it is the same pinned 3.12, not whatever
      # ubuntu-latest's ambient python3 happens to be today: the script's own
      # function signatures use PEP 585 generics (list[tuple[int, str]]),
      # evaluated eagerly with no `from __future__ import annotations`, and
      # every other Python step in this repo pins its interpreter for the
      # same reason ("a toolchain change is a reviewed diff" -- ci.yml's own
      # env comment).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: secret scan (ZTAX-SEC-001 doctrine -- no credentials in source control)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: deployment-manifest secrets scan (ADR-0017 §2.4)
        run: python docs/tools/check_secrets_manifest.py
