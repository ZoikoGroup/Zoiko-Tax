# Checks every pull request must pass before it merges. Merging to main
# deploys straight to the VM (deploy.yml), so this is the only gate between a
# PR and production.
#
# Commands are the ones the earlier ci.yml ran; run the same make and npm
# targets locally to reproduce a failure. Make the `all checks` job the one
# required status check in branch protection.
name: CI

on:
  pull_request:

permissions:
  contents: read

# A superseded run proves nothing; keep the runners for the newest push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.13.2
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  GITLEAKS_VERSION: "8.28.0"

jobs:
  backend:
    name: backend · format, vet, build, lint, unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Cheapest first, so the common failures show in seconds.
      - name: gofmt
        run: make fmt-check

      - name: vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # The handlers use types generated from the contract; a contract change
      # the server has not caught up with fails here.
      - name: wire types match the contract
        run: make api-gen-check

      # Layering rules (backend/.golangci.yml).
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: backend

      - name: unit, property and golden tests
        run: make test

  backend-integration:
    name: backend · migrations and integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: ztax
          POSTGRES_USER: ztax_owner
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ztax_owner -d ztax"
          --health-interval 5s --health-timeout 5s --health-retries 20
    # ztax_owner runs the migrations as a cell's DDL role would, so ztax_app
    # keeps only the grants the migrations give it.
    env:
      ZTAX_ENVIRONMENT: development
      ZTAX_MIGRATE_DATABASE_URL: postgres://ztax_owner:ci-only@localhost:5432/ztax?sslmode=disable&search_path=ztax,public
      ZTAX_TEST_DATABASE_URL: postgres://ztax_owner:ci-only@localhost:5432/ztax?sslmode=disable&search_path=ztax,public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Applies every migration from an empty database.
      - name: apply migrations
        run: make migrate

      - name: integration tests against PostgreSQL
        run: make test-integration

  contracts:
    name: contracts · lint, exports, Postman, TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            sdk/typescript/package-lock.json

      # Lints the contract, then regenerates the 3.1 export, the route
      # manifest and the Postman collection and fails on any drift.
      - name: contract lint and generated files
        working-directory: contracts
        run: |
          npm ci
          npm run check

      - name: TypeScript SDK matches the contract
        working-directory: sdk/typescript
        run: |
          npm ci
          npm run generate
          git diff --exit-code -- src/schema.ts
          npm run build
          node --test test/*.test.js

  frontend:
    name: frontend · lint, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            sdk/typescript/package-lock.json

      # The app links the SDK as file:../sdk/typescript, whose dist/ is not
      # committed.
      - name: build the TypeScript SDK
        working-directory: sdk/typescript
        run: npm ci && npm run build

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: types
        run: npm run typecheck

      - name: build
        run: npm run build

  secrets:
    name: secrets · gitleaks and deployment manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The gitleaks CLI rather than gitleaks-action, which needs a paid
      # licence on organisation repositories. Scans only this PR's commits.
      - name: gitleaks on the PR's commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks git --config .gitleaks.toml --redact --verbose --log-opts="${BASE}..${HEAD}"

      - name: no secrets in deployment manifests
        run: python docs/tools/check_secrets_manifest.py

  all:
    name: all checks
    if: always()
    needs: [backend, backend-integration, contracts, frontend, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: every check passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || exit 1
          done
